# Loaded as a conf.d fragment so the image defaults stay in place.
#
# Review timeout layering, each backstopping the previous one:
#   repoguard.review.pipeline.budget-ms          10 min  (application, degrades to rules)
#   consumer_timeout                             20 min  (this file, redelivers)
#   app.rabbit.review.review-execution-timeout-ms 30 min (recovery compensator)
#
# Leaving this unset would inherit the RabbitMQ 3.13 default of 1800000 ms, which
# equals the recovery threshold: a slow review would then be redelivered at the
# same instant the compensator declared it stale, and both paths would re-run it.
consumer_timeout = 1200000
