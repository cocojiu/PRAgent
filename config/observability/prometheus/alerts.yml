groups:
  - name: repoguard-operation
    rules:
      - alert: RepoGuardServiceUnavailable
        expr: up{job=~"repoguard-api|repoguard-worker"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'RepoGuard scrape unavailable: {{ $labels.job }}'
          description: 'Check service health and the private observability network; scrape failure alone does not prove an application outage.'
      - alert: RepoGuardUsageSnapshotStale
        expr: time() - repoguard_llm_usage_snapshot_last_success_seconds{job="repoguard-api"} > 180
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: LLM accounting diagnostic snapshot is stale
          description: 'Inspect database availability and collection failures. Retained values are previous evidence, not a current zero balance.'
      - alert: RepoGuardUncertainUsageAged
        expr: >-
          (repoguard_llm_usage_oldest_age_seconds{job="repoguard-api",status=~"reserved|unknown"} > 3600)
          and on(job,instance) (time() - repoguard_llm_usage_snapshot_last_success_seconds{job="repoguard-api"} < 180)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LLM usage has remained uncertain for over an hour
          description: 'Inspect pending accounting records and final provider evidence. Do not release reservations or assign zero cost automatically.'
      - alert: RepoGuardBudgetAdmissionDenied
        expr: sum by (reason) (increase(repoguard_llm_budget_denied_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'LLM budget admission denied: {{ $labels.reason }}'
          description: 'Inspect quotas, pricing evidence and store availability; do not raise budgets automatically.'
      - alert: RepoGuardQueueWaitHigh
        expr: >-
          (histogram_quantile(0.95, sum by (le) (rate(repoguard_review_queue_wait_seconds_bucket[5m]))) > 60)
          and (sum(increase(repoguard_review_queue_wait_seconds_count[5m])) >= 5)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Review messages have high queue waiting time
          description: 'Check Worker capacity and recent retry/failure rates. The threshold requires at least five samples in the window.'
