global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: repoguard-api
    metrics_path: /actuator/prometheus
    sample_limit: 10000
    label_limit: 24
    body_size_limit: 3MB
    static_configs:
      - targets: ['repoguard-backend:8081']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'repoguard_.*|jvm_memory_(used|max|committed)_bytes|jvm_gc_pause_seconds.*|hikaricp_connections.*|process_cpu_usage|process_uptime_seconds|system_cpu_usage'
        action: keep
  - job_name: repoguard-worker
    metrics_path: /actuator/prometheus
    sample_limit: 10000
    label_limit: 24
    body_size_limit: 3MB
    static_configs:
      - targets: ['repoguard-backend-worker:8081']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'repoguard_.*|jvm_memory_(used|max|committed)_bytes|jvm_gc_pause_seconds.*|hikaricp_connections.*|process_cpu_usage|process_uptime_seconds|system_cpu_usage'
        action: keep
