# Local metrics storage for the existing Grafana stack; remote-write credentials are not required.
# Enable either this overlay or docker-compose.metrics.yml according to the chosen storage.
services:
  prometheus:
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    container_name: repoguard-prometheus
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.25
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=256MB
      - --web.listen-address=0.0.0.0:9090
      - --query.max-concurrency=4
      - --query.timeout=10s
    labels:
      com.repoguard.stack: observability
    volumes:
      - ./config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - repoguard_prometheus_data:/prometheus
    ports:
      - 127.0.0.1:9090:9090
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  grafana:
    volumes:
      - ./config/observability/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
volumes:
  repoguard_prometheus_data:
