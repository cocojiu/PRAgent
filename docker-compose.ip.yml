services:
  mysql:
    image: mysql:8.0
    container_name: repoguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repoguard_demo}
      MYSQL_USER: ${MYSQL_USER:-repoguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --performance-schema=OFF
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 700m

  rabbitmq:
    image: rabbitmq:3.13
    container_name: repoguard-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-repoguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/repoguard}
    volumes:
      - repoguard_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 384m

  backend:
    build:
      context: ./repoguard-backend
      dockerfile: Dockerfile
    container_name: repoguard-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-repoguard_demo}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repoguard}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-repoguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_DEFAULT_VHOST:-/repoguard}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      REPOGUARD_SECURITY_ENCRYPTION_KEY: ${REPOGUARD_SECURITY_ENCRYPTION_KEY}
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:-demo-ip-20260614}
      REPOGUARD_AUTH_TOKEN_SECRET: ${REPOGUARD_AUTH_TOKEN_SECRET}
      REPOGUARD_ADMIN_API_KEY: ${REPOGUARD_ADMIN_API_KEY}
      REPOGUARD_ADMIN_API_KEY_ENABLED: "true"
      REPOGUARD_GITHUB_WEBHOOK_SECRET: ${REPOGUARD_GITHUB_WEBHOOK_SECRET}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES:-}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES:-PRAgent-test}
      REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE: ${REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE:-true}
      REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT: ${REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT:-true}
      REPOGUARD_REVIEW_EXCHANGE: repoguard.review.exchange.v2
      REPOGUARD_REVIEW_QUEUE: repoguard.review.queue.v2
      REPOGUARD_REVIEW_ROUTING_KEY: repoguard.review.created.v2
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: 800m

  frontend:
    build:
      context: ./repoguard-frontend
      dockerfile: Dockerfile
    container_name: repoguard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    mem_limit: 128m

volumes:
  repoguard_mysql_data:
  repoguard_rabbitmq_data:
