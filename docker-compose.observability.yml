name: repoguard-observability

services:
  loki:
    image: grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    container_name: repoguard-loki
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["-config.file=/etc/loki/loki.yml"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.repoguard.stack: observability
    volumes:
      - ./config/observability/loki.yml:/etc/loki/loki.yml:ro
      - repoguard_loki_data:/loki
    ports:
      - "${LOKI_PORT_BIND:-127.0.0.1:3100}:3100"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  docker-proxy:
    image: wollomatic/socket-proxy:1.12.3@sha256:74e770f5ed3cfc9ecb6350e177d2aa55873568c85bc953079834e68607dbf71b
    container_name: repoguard-docker-proxy
    restart: unless-stopped
    read_only: true
    group_add:
      - "${DOCKER_SOCKET_GID:?Set DOCKER_SOCKET_GID to the group id of /var/run/docker.sock}"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=alloy
      - -allowGET=/(v[0-9]+\.[0-9]+/)?(version|info|_ping|containers/json|containers/[A-Za-z0-9_.-]+/(json|logs)|events)
      - -allowHEAD=/_ping
      - -allowhealthcheck
      - -watchdoginterval=30
      - -stoponwatchdog
      - -shutdowngracetime=5
      - -loglevel=warn
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.repoguard.stack: observability
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  alloy:
    image: grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    container_name: repoguard-alloy
    restart: unless-stopped
    user: "473:473"
    stop_grace_period: 30s
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.repoguard.stack: observability
    depends_on:
      docker-proxy:
        condition: service_healthy
      loki:
        condition: service_started
    volumes:
      - ./config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - repoguard_alloy_data:/var/lib/alloy/data
    networks:
      - default
      - docker_api
    ports:
      - "${ALLOY_PORT_BIND:-127.0.0.1:9080}:12345"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
    container_name: repoguard-grafana
    restart: unless-stopped
    stop_grace_period: 30s
    labels:
      com.repoguard.stack: observability
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD before starting observability services}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - repoguard_grafana_data:/var/lib/grafana
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT_BIND:-127.0.0.1:3000}:3000"
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: repoguard_observability
  docker_api:
    name: repoguard_observability_docker_api
    internal: true

volumes:
  repoguard_loki_data:
  repoguard_grafana_data:
  repoguard_alloy_data:
