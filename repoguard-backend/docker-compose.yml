services:
  mysql:
    image: mysql:8.0
    container_name: repoguard-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repoguard
      MYSQL_USER: repoguard
      MYSQL_PASSWORD: repoguard
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: repoguard-rabbitmq
    hostname: repoguard-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@repoguard-rabbitmq
      RABBITMQ_DEFAULT_USER: repoguard
      RABBITMQ_DEFAULT_PASS: repoguard
    volumes:
      - repoguard_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Backend Actuator performs the deeper AMQP health check.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s

volumes:
  repoguard_mysql_data:
  repoguard_rabbitmq_data:
