services:
  mysql:
    image: mysql:8.0
    container_name: repoguard-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repoguard
      MYSQL_USER: repoguard
      MYSQL_PASSWORD: repoguard
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repoguard_mysql_data:
