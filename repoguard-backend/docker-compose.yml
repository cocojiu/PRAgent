services:
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: repoguard-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repoguard
      MYSQL_USER: repoguard
      MYSQL_PASSWORD: repoguard
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13.7-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
    container_name: repoguard-rabbitmq
    hostname: repoguard-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_NODENAME: rabbit@repoguard-rabbitmq
      RABBITMQ_DEFAULT_USER: repoguard
      RABBITMQ_DEFAULT_PASS: repoguard
    volumes:
      - repoguard_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Backend Actuator performs the deeper AMQP health check.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s

volumes:
  repoguard_mysql_data:
  repoguard_rabbitmq_data:
