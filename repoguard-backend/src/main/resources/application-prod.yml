spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Spring's environment-variable form removes dashes rather than
      # introducing extra nested segments.  Keeping these names canonical
      # prevents `CONNECTION_TIMEOUT_MS` from binding as hikari.connection.*.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUMIDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT:2500}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLETIMEOUT:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAXLIFETIME:1500000}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

repoguard:
  security:
    encryption-key: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:}
    encryption-key-id: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:}
    encryption-salt: ${REPOGUARD_SECURITY_ENCRYPTION_SALT:}
    allow-plaintext-secrets: ${REPOGUARD_SECURITY_ALLOW_PLAINTEXT_SECRETS:false}
  auth:
    registration-enabled: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:false}
    secure-cookies: ${REPOGUARD_AUTH_SECURE_COOKIES:true}
