spring:
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:8}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:1}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS:2500}
      idle-timeout: ${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1500000}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}

repoguard:
  security:
    encryption-key: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:}
    encryption-key-id: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:}
    encryption-salt: ${REPOGUARD_SECURITY_ENCRYPTION_SALT:}
    allow-plaintext-secrets: ${REPOGUARD_SECURITY_ALLOW_PLAINTEXT_SECRETS:false}
  auth:
    registration-enabled: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:false}
    secure-cookies: ${REPOGUARD_AUTH_SECURE_COOKIES:true}
