spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/repoguard?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${SPRING_RABBITMQ_USERNAME:repoguard}
    password: ${SPRING_RABBITMQ_PASSWORD:repoguard}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

repoguard:
  security:
    encryption-key: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:repoguard-local-dev-encryption-key}
    encryption-key-id: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:local}
    encryption-salt: ${REPOGUARD_SECURITY_ENCRYPTION_SALT:repoguard-local-dev-encryption-salt}
    allow-plaintext-secrets: ${REPOGUARD_SECURITY_ALLOW_PLAINTEXT_SECRETS:false}
  auth:
    token-secret: ${REPOGUARD_AUTH_TOKEN_SECRET:changeme-local-dev}
    registration-enabled: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:true}

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
