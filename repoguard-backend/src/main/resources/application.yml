server:
  port: 8081

spring:
  application:
    name: repoguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:repoguard}
    password: ${SPRING_RABBITMQ_PASSWORD:repoguard}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

repoguard:
  security:
    encryption-key: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:repoguard-local-dev-encryption-key}
    encryption-key-id: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:local}
  auth:
    token-secret: ${REPOGUARD_AUTH_TOKEN_SECRET:repoguard-local-dev-auth-token-secret}
    access-token-ttl-seconds: ${REPOGUARD_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${REPOGUARD_AUTH_REFRESH_TOKEN_TTL_SECONDS:7200}
    remember-token-ttl-seconds: ${REPOGUARD_AUTH_REMEMBER_TOKEN_TTL_SECONDS:2592000}

app:
  security:
    admin-api-key:
      enabled: ${REPOGUARD_ADMIN_API_KEY_ENABLED:true}
      key: ${REPOGUARD_ADMIN_API_KEY:}
      header-name: ${REPOGUARD_ADMIN_API_KEY_HEADER:X-RepoGuard-Admin-Key}
  cors:
    allowed-origins:
      - http://localhost:5173
  rabbit:
    review:
      exchange: ${REPOGUARD_REVIEW_EXCHANGE:repoguard.review.exchange.v2}
      queue: ${REPOGUARD_REVIEW_QUEUE:repoguard.review.queue.v2}
      routing-key: ${REPOGUARD_REVIEW_ROUTING_KEY:repoguard.review.created.v2}
      dead-letter-exchange: ${REPOGUARD_REVIEW_DLX:repoguard.review.dlx}
      dead-letter-queue: ${REPOGUARD_REVIEW_DLQ:repoguard.review.dlq}
      dead-letter-routing-key: ${REPOGUARD_REVIEW_DLQ_ROUTING_KEY:repoguard.review.dead}
      publish-max-attempts: ${REPOGUARD_REVIEW_PUBLISH_MAX_ATTEMPTS:3}
      publish-initial-interval-ms: ${REPOGUARD_REVIEW_PUBLISH_INITIAL_INTERVAL_MS:500}
      publish-multiplier: ${REPOGUARD_REVIEW_PUBLISH_MULTIPLIER:3.0}
      publish-confirm-timeout-ms: ${REPOGUARD_REVIEW_PUBLISH_CONFIRM_TIMEOUT_MS:5000}
      publish-compensation-max-attempts: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_MAX_ATTEMPTS:10}
      publish-compensation-interval-ms: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_INTERVAL_MS:60000}
      publish-compensation-batch-size: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_BATCH_SIZE:20}
      publish-compensation-lease-ms: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_LEASE_MS:120000}
      worker-concurrency: ${REPOGUARD_REVIEW_WORKER_CONCURRENCY:1}
