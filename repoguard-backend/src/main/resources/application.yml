server:
  port: 8081
  compression:
    enabled: ${SERVER_COMPRESSION_ENABLED:true}
    mime-types: application/json,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
    min-response-size: ${SERVER_COMPRESSION_MIN_RESPONSE_SIZE:1024}

spring:
  application:
    name: repoguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:repoguard}
    password: ${SPRING_RABBITMQ_PASSWORD:repoguard}
    connection-timeout: ${SPRING_RABBITMQ_CONNECTION_TIMEOUT:3s}
    requested-heartbeat: ${SPRING_RABBITMQ_REQUESTED_HEARTBEAT:30s}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        concurrency: ${REPOGUARD_RABBIT_LISTENER_CONCURRENCY:${REPOGUARD_REVIEW_WORKER_CONCURRENCY:1}}
        max-concurrency: ${REPOGUARD_RABBIT_LISTENER_MAX_CONCURRENCY:${REPOGUARD_REVIEW_WORKER_MAX_CONCURRENCY:${REPOGUARD_REVIEW_WORKER_CONCURRENCY:1}}}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000
          multiplier: 2.0
          max-interval: 10000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

repoguard:
  async:
    github-comment-threads: ${REPOGUARD_ASYNC_GITHUB_COMMENT_THREADS:2}
    github-comment-queue-capacity: ${REPOGUARD_ASYNC_GITHUB_COMMENT_QUEUE_CAPACITY:100}
    review-publish-threads: ${REPOGUARD_ASYNC_REVIEW_PUBLISH_THREADS:2}
    review-publish-queue-capacity: ${REPOGUARD_ASYNC_REVIEW_PUBLISH_QUEUE_CAPACITY:100}
    dashboard-threads: ${REPOGUARD_ASYNC_DASHBOARD_THREADS:1}
    dashboard-queue-capacity: ${REPOGUARD_ASYNC_DASHBOARD_QUEUE_CAPACITY:16}
    rabbit-health-threads: ${REPOGUARD_ASYNC_RABBIT_HEALTH_THREADS:1}
    rabbit-health-queue-capacity: ${REPOGUARD_ASYNC_RABBIT_HEALTH_QUEUE_CAPACITY:4}
    shutdown-wait-seconds: ${REPOGUARD_ASYNC_SHUTDOWN_WAIT_SECONDS:10}
    rabbit-health-cache-millis: ${REPOGUARD_ASYNC_RABBIT_HEALTH_CACHE_MILLIS:5000}
    rabbit-health-failure-backoff-millis: ${REPOGUARD_ASYNC_RABBIT_HEALTH_FAILURE_BACKOFF_MILLIS:10000}
  data-retention:
    cleanup-lease-minutes: ${REPOGUARD_DATA_RETENTION_CLEANUP_LEASE_MINUTES:30}
    cleanup-max-tasks-per-run: ${REPOGUARD_DATA_RETENTION_CLEANUP_MAX_TASKS_PER_RUN:500}
  operational-data-retention:
    enabled: ${REPOGUARD_OPERATIONAL_RETENTION_ENABLED:true}
    batch-size: ${REPOGUARD_OPERATIONAL_RETENTION_BATCH_SIZE:500}
    max-batches-per-run: ${REPOGUARD_OPERATIONAL_RETENTION_MAX_BATCHES_PER_RUN:20}
    refresh-token-days: ${REPOGUARD_REFRESH_TOKEN_RETENTION_DAYS:30}
    login-audit-days: ${REPOGUARD_LOGIN_AUDIT_RETENTION_DAYS:180}
    operation-audit-days: ${REPOGUARD_OPERATION_AUDIT_RETENTION_DAYS:365}
    system-setting-log-days: ${REPOGUARD_SYSTEM_SETTING_LOG_RETENTION_DAYS:365}
    notification-log-days: ${REPOGUARD_NOTIFICATION_LOG_RETENTION_DAYS:90}
  observability:
    thresholds:
      enabled: ${REPOGUARD_OBSERVABILITY_THRESHOLDS_ENABLED:true}
      api-duration-ms: ${REPOGUARD_OBSERVABILITY_API_DURATION_MS:2000}
      api-response-bytes: ${REPOGUARD_OBSERVABILITY_API_RESPONSE_BYTES:524288}
      sql-duration-ms: ${REPOGUARD_OBSERVABILITY_SQL_DURATION_MS:500}
      sql-rows: ${REPOGUARD_OBSERVABILITY_SQL_ROWS:1000}
      frontend-api-duration-ms: ${REPOGUARD_OBSERVABILITY_FRONTEND_API_DURATION_MS:2000}
      frontend-long-task-ms: ${REPOGUARD_OBSERVABILITY_FRONTEND_LONG_TASK_MS:200}
      external-call-retry-attempt: ${REPOGUARD_OBSERVABILITY_EXTERNAL_CALL_RETRY_ATTEMPT:1}
      data-retention-cleanup-failures: ${REPOGUARD_OBSERVABILITY_DATA_RETENTION_CLEANUP_FAILURES:1}
      frontend-api-duration-ms-by-route:
        "[overview]": ${REPOGUARD_OBSERVABILITY_FRONTEND_OVERVIEW_API_DURATION_MS:1200}
        "[task-detail]": ${REPOGUARD_OBSERVABILITY_FRONTEND_TASK_DETAIL_API_DURATION_MS:1500}
        "[message-queue]": ${REPOGUARD_OBSERVABILITY_FRONTEND_MESSAGE_QUEUE_API_DURATION_MS:1200}
        "[notification-ops]": ${REPOGUARD_OBSERVABILITY_FRONTEND_NOTIFICATION_OPS_API_DURATION_MS:1200}
      frontend-long-task-ms-by-route:
        "[overview]": ${REPOGUARD_OBSERVABILITY_FRONTEND_OVERVIEW_LONG_TASK_MS:120}
        "[task-detail]": ${REPOGUARD_OBSERVABILITY_FRONTEND_TASK_DETAIL_LONG_TASK_MS:150}
        "[message-queue]": ${REPOGUARD_OBSERVABILITY_FRONTEND_MESSAGE_QUEUE_LONG_TASK_MS:150}
        "[notification-ops]": ${REPOGUARD_OBSERVABILITY_FRONTEND_NOTIFICATION_OPS_LONG_TASK_MS:150}
      external-call-retry-attempt-by-system:
        "[github]": ${REPOGUARD_OBSERVABILITY_GITHUB_RETRY_ATTEMPT:1}
        "[llm]": ${REPOGUARD_OBSERVABILITY_LLM_RETRY_ATTEMPT:1}
      api-duration-ms-by-path:
        "[/api/v1/dashboard/overview]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_OVERVIEW_API_DURATION_MS:1000}
        "[/api/v1/dashboard/summary]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_SUMMARY_API_DURATION_MS:500}
        "[/api/v1/dashboard/review-trend]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_REVIEW_TREND_API_DURATION_MS:800}
        "[/api/v1/dashboard/risk-distribution]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_RISK_DISTRIBUTION_API_DURATION_MS:500}
        "[/api/v1/dashboard/rules]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_RULES_API_DURATION_MS:800}
        "[/api/v1/dashboard/high-risk-reviews]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_HIGH_RISK_REVIEWS_API_DURATION_MS:800}
        "[/api/v1/dashboard/llm-quality]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_LLM_QUALITY_API_DURATION_MS:1000}
        "[/api/v1/reviews]": ${REPOGUARD_OBSERVABILITY_REVIEWS_LIST_API_DURATION_MS:800}
        "[/api/v1/reviews/repositories]": ${REPOGUARD_OBSERVABILITY_REVIEW_REPOSITORIES_API_DURATION_MS:500}
        "[/api/v1/reviews/{id}]": ${REPOGUARD_OBSERVABILITY_REVIEW_DETAIL_API_DURATION_MS:800}
        "[/api/v1/reviews/{id}/findings]": ${REPOGUARD_OBSERVABILITY_REVIEW_FINDINGS_API_DURATION_MS:800}
        "[/api/v1/reviews/{id}/changed-files]": ${REPOGUARD_OBSERVABILITY_REVIEW_CHANGED_FILES_API_DURATION_MS:800}
        "[/api/v1/reviews/{id}/missing-tests]": ${REPOGUARD_OBSERVABILITY_REVIEW_MISSING_TESTS_API_DURATION_MS:500}
        "[/api/v1/reviews/{id}/timeline]": ${REPOGUARD_OBSERVABILITY_REVIEW_TIMELINE_API_DURATION_MS:500}
        "[/api/v1/reviews/{id}/status]": ${REPOGUARD_OBSERVABILITY_REVIEW_STATUS_API_DURATION_MS:300}
        "[/api/v1/reviews/{id}/github-comments/preview]": ${REPOGUARD_OBSERVABILITY_REVIEW_COMMENT_PREVIEW_API_DURATION_MS:1000}
        "[/api/v1/reviews/{id}/github-comments/publications]": ${REPOGUARD_OBSERVABILITY_REVIEW_COMMENT_PUBLICATIONS_API_DURATION_MS:800}
        "[/api/v1/config/notification-bindings]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_BINDINGS_API_DURATION_MS:800}
        "[/api/v1/config/notification-bindings/{id}/test]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_BINDING_TEST_API_DURATION_MS:1200}
        "[/api/v1/notification-events]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_EVENTS_API_DURATION_MS:800}
        "[/api/v1/notification-events/{id}/retry]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_EVENT_RETRY_API_DURATION_MS:1200}
        "[/api/v1/notification-deliveries]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_DELIVERIES_API_DURATION_MS:800}
        "[/api/v1/notifications]": ${REPOGUARD_OBSERVABILITY_NOTIFICATIONS_API_DURATION_MS:500}
        "[/api/v1/config/data-retention/cleanup]": ${REPOGUARD_OBSERVABILITY_DATA_RETENTION_CLEANUP_API_DURATION_MS:1500}
        "[/api/v1/config/data-retention/cleanup-audits]": ${REPOGUARD_OBSERVABILITY_DATA_RETENTION_CLEANUP_AUDITS_API_DURATION_MS:800}
        "[/api/v1/users]": ${REPOGUARD_OBSERVABILITY_USERS_API_DURATION_MS:800}
        "[/api/v1/users/audits]": ${REPOGUARD_OBSERVABILITY_USER_AUDITS_API_DURATION_MS:800}
      api-response-bytes-by-path:
        "[/api/v1/dashboard/overview]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_OVERVIEW_RESPONSE_BYTES:196608}
        "[/api/v1/dashboard/summary]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_SUMMARY_RESPONSE_BYTES:8192}
        "[/api/v1/dashboard/review-trend]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_REVIEW_TREND_RESPONSE_BYTES:16384}
