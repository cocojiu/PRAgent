server:
  port: 8080

spring:
  application:
    name: repoguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
