server:
  port: 8081

spring:
  application:
    name: repoguard-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:repoguard}
    password: ${SPRING_RABBITMQ_PASSWORD:repoguard}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 1
        max-concurrency: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  rabbit:
    review:
      exchange: ${REPOGUARD_REVIEW_EXCHANGE:repoguard.review.exchange}
      queue: ${REPOGUARD_REVIEW_QUEUE:repoguard.review.queue}
      routing-key: ${REPOGUARD_REVIEW_ROUTING_KEY:repoguard.review.created}
