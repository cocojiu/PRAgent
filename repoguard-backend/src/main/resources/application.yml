        "[/api/v1/dashboard/rules]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_RULES_RESPONSE_BYTES:32768}
        "[/api/v1/dashboard/high-risk-reviews]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_HIGH_RISK_REVIEWS_RESPONSE_BYTES:32768}
        "[/api/v1/dashboard/llm-quality]": ${REPOGUARD_OBSERVABILITY_DASHBOARD_LLM_QUALITY_RESPONSE_BYTES:131072}
        "[/api/v1/reviews]": ${REPOGUARD_OBSERVABILITY_REVIEWS_LIST_RESPONSE_BYTES:65536}
        "[/api/v1/reviews/repositories]": ${REPOGUARD_OBSERVABILITY_REVIEW_REPOSITORIES_RESPONSE_BYTES:16384}
        "[/api/v1/reviews/{id}]": ${REPOGUARD_OBSERVABILITY_REVIEW_DETAIL_RESPONSE_BYTES:131072}
        "[/api/v1/reviews/{id}/findings]": ${REPOGUARD_OBSERVABILITY_REVIEW_FINDINGS_RESPONSE_BYTES:65536}
        "[/api/v1/reviews/{id}/changed-files]": ${REPOGUARD_OBSERVABILITY_REVIEW_CHANGED_FILES_RESPONSE_BYTES:65536}
        "[/api/v1/reviews/{id}/missing-tests]": ${REPOGUARD_OBSERVABILITY_REVIEW_MISSING_TESTS_RESPONSE_BYTES:32768}
        "[/api/v1/reviews/{id}/timeline]": ${REPOGUARD_OBSERVABILITY_REVIEW_TIMELINE_RESPONSE_BYTES:16384}
        "[/api/v1/reviews/{id}/status]": ${REPOGUARD_OBSERVABILITY_REVIEW_STATUS_RESPONSE_BYTES:8192}
        "[/api/v1/reviews/{id}/github-comments/preview]": ${REPOGUARD_OBSERVABILITY_REVIEW_COMMENT_PREVIEW_RESPONSE_BYTES:131072}
        "[/api/v1/reviews/{id}/github-comments/publications]": ${REPOGUARD_OBSERVABILITY_REVIEW_COMMENT_PUBLICATIONS_RESPONSE_BYTES:65536}
        "[/api/v1/config/notification-bindings]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_BINDINGS_RESPONSE_BYTES:65536}
        "[/api/v1/config/notification-bindings/{id}/test]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_BINDING_TEST_RESPONSE_BYTES:16384}
        "[/api/v1/notification-events]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_EVENTS_RESPONSE_BYTES:65536}
        "[/api/v1/notification-events/{id}/retry]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_EVENT_RETRY_RESPONSE_BYTES:32768}
        "[/api/v1/notification-deliveries]": ${REPOGUARD_OBSERVABILITY_NOTIFICATION_DELIVERIES_RESPONSE_BYTES:65536}
        "[/api/v1/notifications]": ${REPOGUARD_OBSERVABILITY_NOTIFICATIONS_RESPONSE_BYTES:32768}
        "[/api/v1/config/data-retention/cleanup]": ${REPOGUARD_OBSERVABILITY_DATA_RETENTION_CLEANUP_RESPONSE_BYTES:32768}
        "[/api/v1/config/data-retention/cleanup-audits]": ${REPOGUARD_OBSERVABILITY_DATA_RETENTION_CLEANUP_AUDITS_RESPONSE_BYTES:65536}
        "[/api/v1/users]": ${REPOGUARD_OBSERVABILITY_USERS_RESPONSE_BYTES:65536}
        "[/api/v1/users/audits]": ${REPOGUARD_OBSERVABILITY_USER_AUDITS_RESPONSE_BYTES:65536}
  security:
    encryption-key: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:repoguard-local-dev-encryption-key}
    encryption-key-id: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:local}
  auth:
    token-secret: ${REPOGUARD_AUTH_TOKEN_SECRET:changeme-local-dev}
    access-token-ttl-seconds: ${REPOGUARD_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${REPOGUARD_AUTH_REFRESH_TOKEN_TTL_SECONDS:7200}
    remember-token-ttl-seconds: ${REPOGUARD_AUTH_REMEMBER_TOKEN_TTL_SECONDS:2592000}
    registration-enabled: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:true}
    public-auth-requests-per-minute-per-ip: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP:30}
    public-auth-requests-per-minute-per-account-ip: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP:10}

app:
  runtime:
    api:
      enabled: ${REPOGUARD_API_ENABLED:true}
    worker:
      enabled: ${REPOGUARD_WORKER_ENABLED:true}
  security:
    admin-api-key:
      enabled: ${REPOGUARD_ADMIN_API_KEY_ENABLED:true}
      key: ${REPOGUARD_ADMIN_API_KEY:}
      header-name: ${REPOGUARD_ADMIN_API_KEY_HEADER:X-RepoGuard-Admin-Key}
    outbound:
      github-allowed-hosts: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS:api.github.com}
      llm-allowed-hosts: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS:dashscope.aliyuncs.com,api.openai.com}
      notification-allowed-hosts: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_HOSTS:qyapi.weixin.qq.com,oapi.dingtalk.com}
      infrastructure-allowed-hosts: ${REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS:localhost,127.0.0.1,::1,mysql,rabbitmq}
      private-network-allowed-hosts: ${REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS:localhost,127.0.0.1,::1,mysql,rabbitmq}
      github-allowed-ports: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS:443}
      llm-allowed-ports: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS:443}
      notification-allowed-ports: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_PORTS:443}
      mysql-allowed-ports: ${REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS:3306}
      rabbit-mq-allowed-ports: ${REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS:5671,5672}
  github:
    comment-publish:
      recovery-interval-ms: ${REPOGUARD_GITHUB_COMMENT_PUBLISH_RECOVERY_INTERVAL_MS:60000}
      recovery-batch-size: ${REPOGUARD_GITHUB_COMMENT_PUBLISH_RECOVERY_BATCH_SIZE:20}
    webhook:
      enabled: ${REPOGUARD_GITHUB_WEBHOOK_ENABLED:true}
      secret: ${REPOGUARD_GITHUB_WEBHOOK_SECRET:}
      require-signature: ${REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE:true}
      ignore-draft: ${REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT:true}
      max-payload-bytes: ${REPOGUARD_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES:1048576}
      max-requests-per-minute-per-ip: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP:120}
      max-requests-per-minute-per-repository: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY:60}
      allowed-actions:
        - opened
        - reopened
        - synchronize
        - ready_for_review
      allowed-repositories: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES:}
      allowed-head-branches: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES:PRAgent-test}
  cors:
    allowed-origins:
      - http://localhost:5173
  external-call:
    resilience:
      github:
        circuit-breaker-failure-rate-threshold: ${REPOGUARD_GITHUB_CB_FAILURE_RATE_THRESHOLD:50}
        circuit-breaker-sliding-window-size: ${REPOGUARD_GITHUB_CB_SLIDING_WINDOW_SIZE:20}
        circuit-breaker-minimum-calls: ${REPOGUARD_GITHUB_CB_MINIMUM_CALLS:5}
        circuit-breaker-wait-open-seconds: ${REPOGUARD_GITHUB_CB_WAIT_OPEN_SECONDS:30}
        retry-max-attempts: ${REPOGUARD_GITHUB_RETRY_MAX_ATTEMPTS:2}
        retry-wait-millis: ${REPOGUARD_GITHUB_RETRY_WAIT_MILLIS:300}
        rate-limit-for-period: ${REPOGUARD_GITHUB_RATE_LIMIT_FOR_PERIOD:30}
        rate-limit-refresh-millis: ${REPOGUARD_GITHUB_RATE_LIMIT_REFRESH_MILLIS:1000}
        rate-limit-timeout-millis: ${REPOGUARD_GITHUB_RATE_LIMIT_TIMEOUT_MILLIS:0}
      llm:
        circuit-breaker-failure-rate-threshold: ${REPOGUARD_LLM_CB_FAILURE_RATE_THRESHOLD:50}
        circuit-breaker-sliding-window-size: ${REPOGUARD_LLM_CB_SLIDING_WINDOW_SIZE:10}
        circuit-breaker-minimum-calls: ${REPOGUARD_LLM_CB_MINIMUM_CALLS:5}
        circuit-breaker-wait-open-seconds: ${REPOGUARD_LLM_CB_WAIT_OPEN_SECONDS:30}
        retry-max-attempts: ${REPOGUARD_LLM_RETRY_MAX_ATTEMPTS:2}
        retry-wait-millis: ${REPOGUARD_LLM_RETRY_WAIT_MILLIS:300}
        rate-limit-for-period: ${REPOGUARD_LLM_RATE_LIMIT_FOR_PERIOD:10}
        rate-limit-refresh-millis: ${REPOGUARD_LLM_RATE_LIMIT_REFRESH_MILLIS:1000}
        rate-limit-timeout-millis: ${REPOGUARD_LLM_RATE_LIMIT_TIMEOUT_MILLIS:0}
        bulkhead-max-concurrent-calls: ${REPOGUARD_LLM_BULKHEAD_MAX_CONCURRENT_CALLS:4}
        bulkhead-max-wait-millis: ${REPOGUARD_LLM_BULKHEAD_MAX_WAIT_MILLIS:0}
  rabbit:
    review:
      exchange: ${REPOGUARD_REVIEW_EXCHANGE:repoguard.review.exchange.v2}
      queue: ${REPOGUARD_REVIEW_QUEUE:repoguard.review.queue.v2}
      routing-key: ${REPOGUARD_REVIEW_ROUTING_KEY:repoguard.review.created.v2}
      dead-letter-exchange: ${REPOGUARD_REVIEW_DLX:repoguard.review.dlx}
      dead-letter-queue: ${REPOGUARD_REVIEW_DLQ:repoguard.review.dlq}
      dead-letter-routing-key: ${REPOGUARD_REVIEW_DLQ_ROUTING_KEY:repoguard.review.dead}
      publish-max-attempts: ${REPOGUARD_REVIEW_PUBLISH_MAX_ATTEMPTS:3}
      publish-initial-interval-ms: ${REPOGUARD_REVIEW_PUBLISH_INITIAL_INTERVAL_MS:500}
      publish-multiplier: ${REPOGUARD_REVIEW_PUBLISH_MULTIPLIER:3.0}
      publish-confirm-timeout-ms: ${REPOGUARD_REVIEW_PUBLISH_CONFIRM_TIMEOUT_MS:5000}
      publish-compensation-max-attempts: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_MAX_ATTEMPTS:10}
      publish-compensation-interval-ms: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_INTERVAL_MS:60000}
      publish-compensation-batch-size: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_BATCH_SIZE:20}
      publish-compensation-lease-ms: ${REPOGUARD_REVIEW_PUBLISH_COMPENSATION_LEASE_MS:120000}
      review-recovery-interval-ms: ${REPOGUARD_REVIEW_RECOVERY_INTERVAL_MS:60000}
      review-execution-timeout-ms: ${REPOGUARD_REVIEW_EXECUTION_TIMEOUT_MS:1800000}
      review-recovery-batch-size: ${REPOGUARD_REVIEW_RECOVERY_BATCH_SIZE:20}
      worker-concurrency: ${REPOGUARD_REVIEW_WORKER_CONCURRENCY:1}
      health-check-timeout-ms: ${REPOGUARD_REVIEW_HEALTH_CHECK_TIMEOUT_MS:1500}
    notification:
      exchange: ${REPOGUARD_NOTIFICATION_EXCHANGE:repoguard.notification.exchange}
      queue: ${REPOGUARD_NOTIFICATION_QUEUE:repoguard.notification.queue}
      routing-key: ${REPOGUARD_NOTIFICATION_ROUTING_KEY:repoguard.notification.created}
      dead-letter-exchange: ${REPOGUARD_NOTIFICATION_DLX:repoguard.notification.dlx}
      dead-letter-queue: ${REPOGUARD_NOTIFICATION_DLQ:repoguard.notification.dlq}
      dead-letter-routing-key: ${REPOGUARD_NOTIFICATION_DLQ_ROUTING_KEY:repoguard.notification.dead}
      publish-max-attempts: ${REPOGUARD_NOTIFICATION_PUBLISH_MAX_ATTEMPTS:3}
      publish-initial-interval-ms: ${REPOGUARD_NOTIFICATION_PUBLISH_INITIAL_INTERVAL_MS:500}
      publish-multiplier: ${REPOGUARD_NOTIFICATION_PUBLISH_MULTIPLIER:3.0}
      publish-confirm-timeout-ms: ${REPOGUARD_NOTIFICATION_PUBLISH_CONFIRM_TIMEOUT_MS:5000}
      publish-compensation-max-attempts: ${REPOGUARD_NOTIFICATION_PUBLISH_COMPENSATION_MAX_ATTEMPTS:5}
      publish-compensation-batch-size: ${REPOGUARD_NOTIFICATION_PUBLISH_COMPENSATION_BATCH_SIZE:20}
      publish-compensation-interval-ms: ${REPOGUARD_NOTIFICATION_PUBLISH_COMPENSATION_INTERVAL_MS:60000}
      worker-concurrency: ${REPOGUARD_NOTIFICATION_WORKER_CONCURRENCY:1}
