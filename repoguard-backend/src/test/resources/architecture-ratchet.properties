# Keep this threshold explicit so a new oversized production class cannot land silently.
maxProductionClassLines=450
# Total complexity budget is intentionally a ceiling at the reviewed baseline. A
# new production class, required environment variable, workflow, scheduled job,
# interface, DTO or script must be paired with an explicit deletion or consolidation.
maxProductionJavaLines=70074
maxProductionClassCount=941
maxTrackedWorkflowCount=15
maxPersonalRequiredEnvironmentVariables=12
maxScheduledJobCount=13
maxUnreferencedBeanCount=0
maxUnreferencedInterfaceCount=0
maxDuplicateDtoNameCount=0
maxDeprecatedConfigurationCount=4
maxOrphanProductionScriptCount=0
productionScriptCatalog=scripts/production-script-catalog.txt
configurationLifecycleCatalog=scripts/configuration-lifecycle-catalog.txt
backgroundJobCatalog=repoguard-backend/src/test/resources/background-job-catalog.txt
forbiddenProductionPackageRoots=com/repoguard/agent/util,com/repoguard/agent/legacy
