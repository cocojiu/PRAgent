worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_x_forwarded_proto $repoguard_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $uri $repoguard_cache_control {
        default "no-cache";
        ~^/assets/ "public, max-age=31536000, immutable";
        ~^/(?:api|grafana|actuator)(?:/|$) "";
    }

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=webhook_per_ip:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=1r/s;
    limit_req_status 429;

    access_log off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 30s;
    keepalive_requests 10000;
    reset_timedout_connection on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    include /etc/nginx/conf.d/*.conf;
}
