services:
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: repoguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repoguard}
      MYSQL_USER: ${MYSQL_USER:-repoguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-60}
      - --performance-schema=OFF
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${MYSQL_MEM_LIMIT:-700m}

  rabbitmq:
    image: rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
    container_name: repoguard-rabbitmq
    hostname: repoguard-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@repoguard-rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-repoguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/repoguard}
    volumes:
      - repoguard_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # Backend Actuator performs the deeper AMQP health check.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s
    mem_limit: ${RABBITMQ_MEM_LIMIT:-384m}

  backend:
    image: ${BACKEND_IMAGE}
    container_name: repoguard-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${APP_MYSQL_DATABASE:-${MYSQL_DATABASE:-repoguard}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repoguard}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-repoguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${APP_RABBITMQ_VIRTUAL_HOST:-${RABBITMQ_DEFAULT_VHOST:-/repoguard}}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      REPOGUARD_API_ENABLED: ${REPOGUARD_API_ENABLED:-true}
      REPOGUARD_WORKER_ENABLED: ${REPOGUARD_WORKER_ENABLED:-true}
      REPOGUARD_SECURITY_ENCRYPTION_KEY: ${REPOGUARD_SECURITY_ENCRYPTION_KEY}
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID}
      REPOGUARD_AUTH_TOKEN_SECRET: ${REPOGUARD_AUTH_TOKEN_SECRET}
      REPOGUARD_AUTH_REGISTRATION_ENABLED: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:-false}
      REPOGUARD_AUTH_SECURE_COOKIES: ${REPOGUARD_AUTH_SECURE_COOKIES:-true}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP:-30}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP:-10}
      REPOGUARD_ADMIN_API_KEY: ${REPOGUARD_ADMIN_API_KEY}
      REPOGUARD_ADMIN_API_KEY_ENABLED: ${REPOGUARD_ADMIN_API_KEY_ENABLED:-true}
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS:-api.github.com}
      REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS:-dashscope.aliyuncs.com,api.openai.com}
      REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_HOSTS:-qyapi.weixin.qq.com,oapi.dingtalk.com}
      REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS:-mysql,rabbitmq}
      REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS:-mysql,rabbitmq}
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS:-3306}
      REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS:-5671,5672}
      REPOGUARD_GITHUB_WEBHOOK_SECRET: ${REPOGUARD_GITHUB_WEBHOOK_SECRET}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES:-}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES:-PRAgent-test}
      REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE: ${REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE:-true}
      REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT: ${REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT:-true}
      REPOGUARD_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES: ${REPOGUARD_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP:-120}
      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY:-60}
      REPOGUARD_REVIEW_EXCHANGE: ${REPOGUARD_REVIEW_EXCHANGE:-repoguard.review.exchange.v2}
      REPOGUARD_REVIEW_QUEUE: ${REPOGUARD_REVIEW_QUEUE:-repoguard.review.queue.v2}
      REPOGUARD_REVIEW_ROUTING_KEY: ${REPOGUARD_REVIEW_ROUTING_KEY:-repoguard.review.created.v2}
      REPOGUARD_REVIEW_DLX: ${REPOGUARD_REVIEW_DLX:-repoguard.review.dlx}
      REPOGUARD_REVIEW_DLQ: ${REPOGUARD_REVIEW_DLQ:-repoguard.review.dlq}
      REPOGUARD_REVIEW_DLQ_ROUTING_KEY: ${REPOGUARD_REVIEW_DLQ_ROUTING_KEY:-repoguard.review.dead}
      REPOGUARD_NOTIFICATION_EXCHANGE: ${REPOGUARD_NOTIFICATION_EXCHANGE:-repoguard.notification.exchange}
      REPOGUARD_NOTIFICATION_QUEUE: ${REPOGUARD_NOTIFICATION_QUEUE:-repoguard.notification.queue}
      REPOGUARD_NOTIFICATION_ROUTING_KEY: ${REPOGUARD_NOTIFICATION_ROUTING_KEY:-repoguard.notification.created}
      REPOGUARD_NOTIFICATION_DLX: ${REPOGUARD_NOTIFICATION_DLX:-repoguard.notification.dlx}
      REPOGUARD_NOTIFICATION_DLQ: ${REPOGUARD_NOTIFICATION_DLQ:-repoguard.notification.dlq}
      REPOGUARD_NOTIFICATION_DLQ_ROUTING_KEY: ${REPOGUARD_NOTIFICATION_DLQ_ROUTING_KEY:-repoguard.notification.dead}
      REPOGUARD_REVIEW_WORKER_CONCURRENCY: ${REPOGUARD_REVIEW_WORKER_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: ${BACKEND_MEM_LIMIT:-800m}

  backend-worker:
    profiles:
      - worker-split
    image: ${BACKEND_IMAGE}
    container_name: repoguard-backend-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: ${WORKER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${APP_MYSQL_DATABASE:-${MYSQL_DATABASE:-repoguard}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repoguard}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-repoguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${APP_RABBITMQ_VIRTUAL_HOST:-${RABBITMQ_DEFAULT_VHOST:-/repoguard}}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      REPOGUARD_API_ENABLED: false
      REPOGUARD_WORKER_ENABLED: true
      REPOGUARD_SECURITY_ENCRYPTION_KEY: ${REPOGUARD_SECURITY_ENCRYPTION_KEY}
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID}
      REPOGUARD_AUTH_TOKEN_SECRET: ${REPOGUARD_AUTH_TOKEN_SECRET}
      REPOGUARD_AUTH_REGISTRATION_ENABLED: false
      REPOGUARD_AUTH_SECURE_COOKIES: ${REPOGUARD_AUTH_SECURE_COOKIES:-true}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP:-30}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP:-10}
      REPOGUARD_ADMIN_API_KEY: ${REPOGUARD_ADMIN_API_KEY}
      REPOGUARD_ADMIN_API_KEY_ENABLED: ${REPOGUARD_ADMIN_API_KEY_ENABLED:-true}
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS:-api.github.com}
      REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS:-dashscope.aliyuncs.com,api.openai.com}
      REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_HOSTS:-qyapi.weixin.qq.com,oapi.dingtalk.com}
      REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS:-mysql,rabbitmq}
      REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS:-mysql,rabbitmq}
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_NOTIFICATION_ALLOWED_PORTS:-443}
      REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS:-3306}
      REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS: ${REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS:-5671,5672}
      REPOGUARD_GITHUB_WEBHOOK_SECRET: ${REPOGUARD_GITHUB_WEBHOOK_SECRET}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES:-}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES: ${REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES:-PRAgent-test}
      REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE: ${REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE:-true}
      REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT: ${REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT:-true}
      REPOGUARD_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES: ${REPOGUARD_GITHUB_WEBHOOK_MAX_PAYLOAD_BYTES:-1048576}
      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP:-120}
      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY:-60}
      REPOGUARD_REVIEW_EXCHANGE: ${REPOGUARD_REVIEW_EXCHANGE:-repoguard.review.exchange.v2}
      REPOGUARD_REVIEW_QUEUE: ${REPOGUARD_REVIEW_QUEUE:-repoguard.review.queue.v2}
      REPOGUARD_REVIEW_ROUTING_KEY: ${REPOGUARD_REVIEW_ROUTING_KEY:-repoguard.review.created.v2}
      REPOGUARD_REVIEW_DLX: ${REPOGUARD_REVIEW_DLX:-repoguard.review.dlx}
      REPOGUARD_REVIEW_DLQ: ${REPOGUARD_REVIEW_DLQ:-repoguard.review.dlq}
      REPOGUARD_REVIEW_DLQ_ROUTING_KEY: ${REPOGUARD_REVIEW_DLQ_ROUTING_KEY:-repoguard.review.dead}
      REPOGUARD_NOTIFICATION_EXCHANGE: ${REPOGUARD_NOTIFICATION_EXCHANGE:-repoguard.notification.exchange}
      REPOGUARD_NOTIFICATION_QUEUE: ${REPOGUARD_NOTIFICATION_QUEUE:-repoguard.notification.queue}
      REPOGUARD_NOTIFICATION_ROUTING_KEY: ${REPOGUARD_NOTIFICATION_ROUTING_KEY:-repoguard.notification.created}
      REPOGUARD_NOTIFICATION_DLX: ${REPOGUARD_NOTIFICATION_DLX:-repoguard.notification.dlx}
      REPOGUARD_NOTIFICATION_DLQ: ${REPOGUARD_NOTIFICATION_DLQ:-repoguard.notification.dlq}
      REPOGUARD_NOTIFICATION_DLQ_ROUTING_KEY: ${REPOGUARD_NOTIFICATION_DLQ_ROUTING_KEY:-repoguard.notification.dead}
      REPOGUARD_REVIEW_WORKER_CONCURRENCY: ${REPOGUARD_REVIEW_WORKER_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: ${WORKER_MEM_LIMIT:-800m}

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: repoguard-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      REPOGUARD_FRONTEND_SERVER_NAME: "${REPOGUARD_FRONTEND_SERVER_NAME:?REPOGUARD_FRONTEND_SERVER_NAME is required}"
    expose:
      - "8080"
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: repoguard-caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
    environment:
      REPOGUARD_FRONTEND_SERVER_NAME: "${REPOGUARD_FRONTEND_SERVER_NAME:?REPOGUARD_FRONTEND_SERVER_NAME is required}"
    ports:
      - "${HTTP_PORT_BIND:-80}:80"
      - "${HTTPS_PORT_BIND:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - repoguard_caddy_data:/data
      - repoguard_caddy_config:/config
    mem_limit: ${CADDY_MEM_LIMIT:-128m}

volumes:
  repoguard_mysql_data:
    name: ${MYSQL_VOLUME_NAME:-repoguard_mysql_data}
  repoguard_rabbitmq_data:
    name: ${RABBITMQ_VOLUME_NAME:-repoguard_rabbitmq_data}
  repoguard_caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-repoguard_caddy_data}
  repoguard_caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-repoguard_caddy_config}
