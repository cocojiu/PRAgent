  REPOGUARD_REVIEW_CONTEXT_MAX_FILES: ${REPOGUARD_REVIEW_CONTEXT_MAX_FILES:-100}
  REPOGUARD_REVIEW_CONTEXT_MAX_FILE_BYTES: ${REPOGUARD_REVIEW_CONTEXT_MAX_FILE_BYTES:-524288}
  REPOGUARD_REVIEW_CONTEXT_MAX_TOTAL_BYTES: ${REPOGUARD_REVIEW_CONTEXT_MAX_TOTAL_BYTES:-8388608}
