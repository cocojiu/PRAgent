x-backend-secrets: &backend-secrets
  - source: mysql_password
    target: spring.datasource.password
  - source: security_encryption_key
    target: repoguard.security.encryption-key
  - source: security_encryption_salt
    target: repoguard.security.encryption-salt
  - source: auth_token_secret
    target: repoguard.auth.token-secret
  - source: admin_api_key
    target: app.security.admin-api-key.key
  - source: github_webhook_secret
    target: app.github.webhook.secret

services:
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    container_name: repoguard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql.root-password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repoguard}
      MYSQL_USER: ${MYSQL_USER:-repoguard}
      MYSQL_PASSWORD_FILE: /run/secrets/spring.datasource.password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-60}
      - --innodb-lock-wait-timeout=${MYSQL_INNODB_LOCK_WAIT_TIMEOUT_SECONDS:-10}
      - --max-execution-time=${MYSQL_MAX_SELECT_EXECUTION_TIME_MS:-30000}
      - --server-id=${MYSQL_SERVER_ID:-1}
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --sync-binlog=1
      - --binlog-expire-logs-seconds=${MYSQL_BINLOG_EXPIRE_LOGS_SECONDS:-604800}
      # Required by the read-only index-usage report used before an invisible
      # index is permanently removed in a later maintenance window.
      - --performance-schema=ON
    volumes:
      - repoguard_mysql_data:/var/lib/mysql
    secrets:
      - source: mysql_root_password
        target: mysql.root-password
      - source: mysql_password
        target: spring.datasource.password
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat "$$MYSQL_ROOT_PASSWORD_FILE")" mysqladmin ping -h 127.0.0.1 -uroot --silent'
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: ${MYSQL_MEM_LIMIT:-640m}
    cpu_shares: ${MYSQL_CPU_SHARES:-768}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
    container_name: repoguard-rabbitmq
    hostname: repoguard-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_NODENAME: rabbit@repoguard-rabbitmq
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-repoguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/repoguard}
    volumes:
      - repoguard_rabbitmq_data:/var/lib/rabbitmq
      # conf.d fragment; pins consumer_timeout between the pipeline budget and the
      # recovery staleness threshold instead of inheriting the 30 min default.
      - type: bind
        source: ./config/rabbitmq/rabbitmq.conf
        target: /etc/rabbitmq/conf.d/20-repoguard.conf
        read_only: true
        bind:
          # Short bind syntax creates a directory when the source is missing.
          # A missing broker policy must instead fail before RabbitMQ is touched.
          create_host_path: false
    healthcheck:
      # Backend Actuator performs the deeper AMQP health check.
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 20s
    mem_limit: ${RABBITMQ_MEM_LIMIT:-256m}
    cpu_shares: ${RABBITMQ_CPU_SHARES:-512}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: repoguard-backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: *backend-environment
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC}
      REPOGUARD_RUNTIME_ROLE: ${REPOGUARD_RUNTIME_ROLE:-combined}
      REPOGUARD_API_INSTANCE_COUNT: ${REPOGUARD_API_INSTANCE_COUNT:-1}
      REPOGUARD_AUTH_REGISTRATION_ENABLED: ${REPOGUARD_AUTH_REGISTRATION_ENABLED:-false}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${API_DB_MAX_POOL_SIZE:-8}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${API_DB_MIN_IDLE:-2}
    secrets: *backend-secrets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: ${BACKEND_MEM_LIMIT:-448m}
    cpu_shares: ${BACKEND_CPU_SHARES:-1024}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-worker:
    profiles:
      - worker-split
    image: ${BACKEND_IMAGE}
    container_name: repoguard-backend-worker
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Direct `docker compose up` must also serialize startup: API/Flyway first,
      # then the non-owner Worker and its schema guard.
      backend:
        condition: service_healthy
    environment:
      <<: *backend-environment
      JAVA_TOOL_OPTIONS: ${WORKER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:+UseSerialGC}
      # The API container owns the Flyway chain. Both roles share one image and
      # one database, so leaving migrations on here would race two processes for
      # the Flyway lock and make schema ownership depend on startup order.
      # SchemaVersionGuard refuses to boot this role against a stale schema.
      SPRING_FLYWAY_ENABLED: "false"
      REPOGUARD_RUNTIME_ROLE: worker
      REPOGUARD_API_INSTANCE_COUNT: 0
      REPOGUARD_AUTH_REGISTRATION_ENABLED: false
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${WORKER_DB_MAX_POOL_SIZE:-4}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${WORKER_DB_MIN_IDLE:-1}
    secrets: *backend-secrets
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: ${WORKER_MEM_LIMIT:-704m}
    # Preserve one core for the API, MySQL and RabbitMQ when a large PR runs a
    # CPU-bound rule scan on the two-core production host.
    cpus: ${WORKER_CPU_LIMIT:-1.0}
    cpu_shares: ${WORKER_CPU_SHARES:-512}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: repoguard-frontend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: ${FRONTEND_MEM_LIMIT:-128m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: repoguard-caddy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      REPOGUARD_FRONTEND_SERVER_NAME: "${REPOGUARD_FRONTEND_SERVER_NAME:?REPOGUARD_FRONTEND_SERVER_NAME is required}"
    ports:
      - "${HTTP_PORT_BIND:-80}:80"
      - "${HTTPS_PORT_BIND:-443}:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - repoguard_caddy_data:/data
      - repoguard_caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  mysql_root_password:
    file: ${MYSQL_ROOT_PASSWORD_FILE:?Set MYSQL_ROOT_PASSWORD_FILE}
  mysql_password:
    file: ${MYSQL_PASSWORD_FILE:?Set MYSQL_PASSWORD_FILE}
  security_encryption_key:
    file: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE:?Set REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE}
  security_encryption_salt:
    file: ${REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE:?Set REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE}
  auth_token_secret:
    file: ${REPOGUARD_AUTH_TOKEN_SECRET_FILE:?Set REPOGUARD_AUTH_TOKEN_SECRET_FILE}
  admin_api_key:
    file: ${REPOGUARD_ADMIN_API_KEY_FILE:?Set REPOGUARD_ADMIN_API_KEY_FILE}
  github_webhook_secret:
    file: ${REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE:?Set REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE}

volumes:
  repoguard_mysql_data:
    name: ${MYSQL_VOLUME_NAME:-repoguard_mysql_data}
  repoguard_rabbitmq_data:
    name: ${RABBITMQ_VOLUME_NAME:-repoguard_rabbitmq_data}
  repoguard_caddy_data:
    name: ${CADDY_DATA_VOLUME_NAME:-repoguard_caddy_data}
  repoguard_caddy_config:
    name: ${CADDY_CONFIG_VOLUME_NAME:-repoguard_caddy_config}
