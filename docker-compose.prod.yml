      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_IP:-120}
      REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY: ${REPOGUARD_GITHUB_WEBHOOK_MAX_REQUESTS_PER_MINUTE_PER_REPOSITORY:-60}
      REPOGUARD_REVIEW_EXCHANGE: ${REPOGUARD_REVIEW_EXCHANGE:-repoguard.review.exchange.v2}
      REPOGUARD_REVIEW_QUEUE: ${REPOGUARD_REVIEW_QUEUE:-repoguard.review.queue.v2}
