  REPOGUARD_SCHEDULER_SHUTDOWN_WAIT: ${REPOGUARD_SCHEDULER_SHUTDOWN_WAIT:-10s}
  REPOGUARD_LLM_BULKHEAD_MAX_CONCURRENT_CALLS: ${REPOGUARD_LLM_BULKHEAD_MAX_CONCURRENT_CALLS:-3}
