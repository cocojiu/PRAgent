      REPOGUARD_LLM_BULKHEAD_MAX_WAIT_MILLIS: ${REPOGUARD_LLM_BULKHEAD_MAX_WAIT_MILLIS:-250}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 20
    mem_limit: ${BACKEND_MEM_LIMIT:-800m}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  backend-worker:
    profiles:
      - worker-split
    image: ${BACKEND_IMAGE}
    container_name: repoguard-backend-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Direct `docker compose up` must also serialize startup: API/Flyway first,
      # then the non-owner Worker and its schema guard.
      backend:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: ${WORKER_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
      # The API container owns the Flyway chain. Both roles share one image and
      # one database, so leaving migrations on here would race two processes for
      # the Flyway lock and make schema ownership depend on startup order.
      # SchemaVersionGuard refuses to boot this role against a stale schema.
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${APP_MYSQL_DATABASE:-${MYSQL_DATABASE:-repoguard}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repoguard}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-repoguard}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${APP_RABBITMQ_VIRTUAL_HOST:-${RABBITMQ_DEFAULT_VHOST:-/repoguard}}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS}
      REPOGUARD_RUNTIME_ROLE: worker
      REPOGUARD_DEPLOYMENT_MODE: ${REPOGUARD_DEPLOYMENT_MODE:-monolith}
      REPOGUARD_API_INSTANCE_COUNT: 0
      REPOGUARD_SECURITY_ENCRYPTION_KEY: ${REPOGUARD_SECURITY_ENCRYPTION_KEY:?Set REPOGUARD_SECURITY_ENCRYPTION_KEY}
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:?Set REPOGUARD_SECURITY_ENCRYPTION_KEY_ID}
      REPOGUARD_SECURITY_ENCRYPTION_SALT: ${REPOGUARD_SECURITY_ENCRYPTION_SALT:?Set REPOGUARD_SECURITY_ENCRYPTION_SALT}
      REPOGUARD_SECURITY_ALLOW_PLAINTEXT_SECRETS: ${REPOGUARD_SECURITY_ALLOW_PLAINTEXT_SECRETS:-false}
      REPOGUARD_AUTH_TOKEN_SECRET: ${REPOGUARD_AUTH_TOKEN_SECRET:?Set REPOGUARD_AUTH_TOKEN_SECRET}
      REPOGUARD_AUTH_TOKEN_SECRET_ID: ${REPOGUARD_AUTH_TOKEN_SECRET_ID:-k1}
      REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS: ${REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS:-}
      REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS_ID: ${REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS_ID:-}
      REPOGUARD_AUTH_REGISTRATION_ENABLED: false
      REPOGUARD_AUTH_SECURE_COOKIES: ${REPOGUARD_AUTH_SECURE_COOKIES:-true}
      REPOGUARD_AUTH_REFRESH_CONCURRENCY_GRACE_SECONDS: ${REPOGUARD_AUTH_REFRESH_CONCURRENCY_GRACE_SECONDS:-5}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_IP:-30}
      REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP: ${REPOGUARD_AUTH_REQUESTS_PER_MINUTE_PER_ACCOUNT_IP:-10}
