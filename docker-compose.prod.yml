      REPOGUARD_REVIEW_PIPELINE_MAX_IN_FLIGHT_CHUNKS: ${REPOGUARD_REVIEW_PIPELINE_MAX_IN_FLIGHT_CHUNKS:-3}
      REPOGUARD_ASYNC_LLM_CHUNK_THREADS: ${REPOGUARD_ASYNC_LLM_CHUNK_THREADS:-3}
      REPOGUARD_ASYNC_LLM_CHUNK_QUEUE_CAPACITY: ${REPOGUARD_ASYNC_LLM_CHUNK_QUEUE_CAPACITY:-100}
      REPOGUARD_ASYNC_NOTIFICATION_PUBLISH_THREADS: ${REPOGUARD_ASYNC_NOTIFICATION_PUBLISH_THREADS:-2}
