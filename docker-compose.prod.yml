  REPOGUARD_SECRET_RE_ENCRYPTION_POLL_INTERVAL_MS: ${REPOGUARD_SECRET_RE_ENCRYPTION_POLL_INTERVAL_MS:-1000}
  REPOGUARD_AUTH_TOKEN_SECRET_ID: ${REPOGUARD_AUTH_TOKEN_SECRET_ID:-k1}
  REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS: ${REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS:-}
  REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS_ID: ${REPOGUARD_AUTH_TOKEN_SECRET_PREVIOUS_ID:-}
  REPOGUARD_AUTH_SECURE_COOKIES: ${REPOGUARD_AUTH_SECURE_COOKIES:-true}
