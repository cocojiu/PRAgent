x-backend-environment: &backend-environment
  SPRING_PROFILES_ACTIVE: prod
  # Keep the deployment model backward-compatible with images built before
  # configtree import moved into application configuration. This is required
  # for an image rollback after secrets have migrated to Compose file mounts.
  SPRING_CONFIG_IMPORT: "optional:configtree:/run/secrets/"
  SERVER_PORT: 8081
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/${APP_MYSQL_DATABASE:-${MYSQL_DATABASE:-repoguard}}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectTimeout=3000&socketTimeout=30000}
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repoguard}
  SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
  SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT_MS: ${DB_VALIDATION_TIMEOUT_MS:-2500}
  SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-300000}
  SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-1500000}
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER:-repoguard}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}
  SPRING_RABBITMQ_VIRTUAL_HOST: ${APP_RABBITMQ_VIRTUAL_HOST:-${RABBITMQ_DEFAULT_VHOST:-/repoguard}}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?Set APP_CORS_ALLOWED_ORIGINS}
  REPOGUARD_DEPLOYMENT_MODE: ${REPOGUARD_DEPLOYMENT_MODE:-monolith}
  REPOGUARD_RATE_LIMIT_STORE: ${REPOGUARD_RATE_LIMIT_STORE:-local}
  REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID:?Set REPOGUARD_SECURITY_ENCRYPTION_KEY_ID}
