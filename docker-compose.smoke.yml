services:
  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    environment:
      MYSQL_ROOT_PASSWORD: ${SMOKE_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SMOKE_MYSQL_DATABASE:-repoguard}
      MYSQL_USER: ${SMOKE_MYSQL_USER:-repoguard}
      MYSQL_PASSWORD: ${SMOKE_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=60
      - --innodb-lock-wait-timeout=10
      - --max-execution-time=30000
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --sync-binlog=1
      - --binlog-expire-logs-seconds=604800
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: ${SMOKE_MYSQL_MEM_LIMIT:-700m}

  rabbitmq:
    image: rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
    environment:
      RABBITMQ_DEFAULT_USER: ${SMOKE_RABBITMQ_USER:-repoguard}
      RABBITMQ_DEFAULT_PASS: ${SMOKE_RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${SMOKE_RABBITMQ_VHOST:-/repoguard}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: ${SMOKE_RABBITMQ_MEM_LIMIT:-384m}

  backend:
    image: ${SMOKE_BACKEND_IMAGE}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: ${SMOKE_JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:+UseSerialGC}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${SMOKE_MYSQL_DATABASE:-repoguard}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&connectTimeout=3000&socketTimeout=30000
      SPRING_DATASOURCE_USERNAME: ${SMOKE_MYSQL_USER:-repoguard}
      SPRING_DATASOURCE_PASSWORD: ${SMOKE_MYSQL_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: 6
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: 1
      SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: 3000
      SPRING_DATASOURCE_HIKARI_VALIDATIONTIMEOUT: 2500
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${SMOKE_RABBITMQ_USER:-repoguard}
      SPRING_RABBITMQ_PASSWORD: ${SMOKE_RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${SMOKE_RABBITMQ_VHOST:-/repoguard}
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1
      REPOGUARD_API_ENABLED: true
      REPOGUARD_WORKER_ENABLED: ${SMOKE_WORKER_ENABLED:-false}
      REPOGUARD_SECURITY_ENCRYPTION_KEY: ${REPOGUARD_SECURITY_ENCRYPTION_KEY}
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: ${REPOGUARD_SECURITY_ENCRYPTION_KEY_ID}
      REPOGUARD_SECURITY_ENCRYPTION_SALT: ${REPOGUARD_SECURITY_ENCRYPTION_SALT}
      REPOGUARD_AUTH_TOKEN_SECRET: ${SMOKE_AUTH_TOKEN_SECRET}
      REPOGUARD_AUTH_REGISTRATION_ENABLED: false
      REPOGUARD_ADMIN_API_KEY: ${SMOKE_ADMIN_API_KEY}
      REPOGUARD_ADMIN_API_KEY_ENABLED: true
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS: ${REPOGUARD_OUTBOUND_GITHUB_ALLOWED_HOSTS:-api.github.com}
      REPOGUARD_OUTBOUND_LLM_ALLOWED_HOSTS: dashscope.aliyuncs.com,api.openai.com,token-plan-cn.xiaomimimo.com
      REPOGUARD_OUTBOUND_INFRASTRUCTURE_ALLOWED_HOSTS: mysql,rabbitmq
      REPOGUARD_OUTBOUND_PRIVATE_NETWORK_ALLOWED_HOSTS: mysql,rabbitmq
      REPOGUARD_OUTBOUND_GITHUB_ALLOWED_PORTS: 443
      REPOGUARD_OUTBOUND_LLM_ALLOWED_PORTS: 443
      REPOGUARD_OUTBOUND_MYSQL_ALLOWED_PORTS: 3306
      REPOGUARD_OUTBOUND_RABBITMQ_ALLOWED_PORTS: 5672
      REPOGUARD_GITHUB_WEBHOOK_SECRET: ${REPOGUARD_GITHUB_WEBHOOK_SECRET}
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_REPOSITORIES: cocojiu/PRAgent
      REPOGUARD_GITHUB_WEBHOOK_ALLOWED_HEAD_BRANCHES: PRAgent-test
      REPOGUARD_GITHUB_WEBHOOK_REQUIRE_SIGNATURE: true
      REPOGUARD_GITHUB_WEBHOOK_IGNORE_DRAFT: true
      REPOGUARD_REVIEW_WORKER_CONCURRENCY: 1
      REPOGUARD_REVIEW_EXECUTION_BUDGET_MS: 600000
      REPOGUARD_REVIEW_PIPELINE_BUDGET_MS: 480000
      REPOGUARD_REVIEW_PIPELINE_MAX_TOTAL_CHUNKS: 64
      REPOGUARD_REVIEW_PIPELINE_MAX_IN_FLIGHT_CHUNKS: 2
      REPOGUARD_ASYNC_LLM_CHUNK_THREADS: 2
      REPOGUARD_ASYNC_LLM_CHUNK_QUEUE_CAPACITY: 100
      REPOGUARD_ASYNC_NOTIFICATION_PUBLISH_THREADS: 2
      REPOGUARD_ASYNC_NOTIFICATION_PUBLISH_QUEUE_CAPACITY: 100
      REPOGUARD_ASYNC_RECOVERY_THREADS: 3
      REPOGUARD_ASYNC_RECOVERY_QUEUE_CAPACITY: 100
      REPOGUARD_SCHEDULER_POOL_SIZE: 2
      REPOGUARD_SCHEDULER_SHUTDOWN_WAIT: 10s
      REPOGUARD_LLM_BULKHEAD_MAX_CONCURRENT_CALLS: 3
      REPOGUARD_LLM_BULKHEAD_MAX_WAIT_MILLIS: 250
    ports:
      - "127.0.0.1:${SMOKE_BACKEND_PORT}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health/readiness | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
    mem_limit: ${SMOKE_BACKEND_MEM_LIMIT:-800m}

volumes:
  mysql_data:
  rabbitmq_data:
