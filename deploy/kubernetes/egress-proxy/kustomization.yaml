apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Requires an operator-managed gateway in a namespace and pod both labeled
# networking.repoguard.io/egress-gateway=true, listening on TCP 3128.
resources:
  - ..
patches:
  - path: runtime.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: repoguard-allow-api-egress
    path: gateway-peer.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: repoguard-allow-worker-egress
    path: gateway-peer.yaml
