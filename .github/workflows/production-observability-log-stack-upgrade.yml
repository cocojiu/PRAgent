name: Production Loki Security Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only preflight, approved security upgrade, or rollback on retained active volumes
        type: choice
        options: [preflight, upgrade, rollback]
        default: preflight
        required: true
      source_run_id:
        description: Successful manual-main Loki source publication run
        type: string
        required: true
      source_sha:
        description: Full main source SHA signed by that publication
        type: string
        required: true
      target_release_id:
        description: Original production run-attempt ID; required only for rollback
        type: string
        required: false
      confirmation:
        description: State changes require UPGRADE_LOKI_SECURITY or ROLLBACK_LOKI_SECURITY
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-observability-maintenance
  cancel-in-progress: false

jobs:
  source:
    name: Verify signed Loki source and current vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      manifest_sha: ${{ steps.identity.outputs.manifest_sha }}
      image_reference: ${{ steps.identity.outputs.image_reference }}
      source_run_attempt: ${{ steps.identity.outputs.source_run_attempt }}
      release_id: ${{ steps.identity.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate explicit request
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          action = os.environ['ACTION']
          assert action in ('preflight', 'upgrade', 'rollback')
          assert re.fullmatch('[1-9][0-9]{0,19}', os.environ['SOURCE_RUN_ID'])
          assert re.fullmatch('[a-f0-9]{40}', os.environ['SOURCE_SHA'])
          if action != 'preflight':
              assert os.environ['GITHUB_REF'] == 'refs/heads/main'
              assert os.environ['CONFIRMATION'] == ('UPGRADE_LOKI_SECURITY' if action == 'upgrade' else 'ROLLBACK_LOKI_SECURITY')
          if action == 'rollback':
              assert re.fullmatch('[1-9][0-9]{4,19}-[1-9][0-9]{0,3}', os.environ['TARGET_RELEASE_ID'])
          else:
              assert not os.environ['TARGET_RELEASE_ID']
          PY
      - name: Verify source manifest, image provenance and SBOM signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/loki-release.py fetch --repository "${GITHUB_REPOSITORY}" \
            --source-sha "${SOURCE_SHA}" --run-id "${SOURCE_RUN_ID}" --output verified-loki
      - name: Bind verified image and production release identity
        id: identity
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          verified = json.loads(pathlib.Path('verified-loki/verification-result.json').read_text())
          assert verified['state'] == 'verified'
          release = os.environ['TARGET_RELEASE_ID'] if os.environ['ACTION'] == 'rollback' else os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('manifest_sha=' + verified['manifestSha256'] + '\n')
              output.write('image_reference=' + verified['image']['repository'] + '@' + verified['image']['digest'] + '\n')
              output.write('source_run_attempt=' + str(verified['runAttempt']) + '\n')
              output.write('release_id=' + release + '\n')
          PY
      - name: Enforce current zero HIGH and CRITICAL image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ${{ steps.identity.outputs.image_reference }}
          scanners: vuln
          format: json
          output: verified-loki/current-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Preserve verified release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-verified-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-loki/
          if-no-files-found: error
          retention-days: 7

  production:
    name: ${{ inputs.action == 'upgrade' && 'Upgrade Loki on verified restored volumes' || inputs.action == 'rollback' && 'Rollback Loki on retained active volumes' || 'Read-only Loki preflight' }}
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.action == 'preflight' || github.ref == 'refs/heads/main') }}
    needs: source
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/validate-production-target
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          deploy-user: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          deploy-path: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
      - name: Download this run's verified inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "loki-verified-inputs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --dir verified-loki
      - uses: ./.github/actions/bootstrap-production-ssh
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          deploy-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Read production preflight without installing files
        if: inputs.action != 'rollback'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          EXPECTED_MANIFEST_SHA: ${{ needs.source.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > remote-preflight.py
          import hashlib, json, os, pathlib
          source = pathlib.Path('verified-loki/loki-source-manifest.json').read_bytes()
          assert hashlib.sha256(source).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA']
          code = pathlib.Path('scripts/loki-release.py').read_text()
          print('namespace={"__name__":"loki_readonly","__file__":"/dev/stdin"}')
          print('exec(compile(' + repr(code) + ',"loki-release.py","exec"),namespace)')
          print('import json\nmanifest=json.loads(' + repr(source.decode()) + ')')
          print('s=manifest["source"];namespace["validate_source"](manifest,s["repository"],s["gitSha"],s["runId"],s["runAttempt"])')
          print('print(json.dumps(namespace["production_preflight"](manifest,allow_candidate=True)))')
          PY
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" python3 - \
            < remote-preflight.py > loki-production-preflight.json
      - name: Apply explicit approved operation and retain all original data
        id: operation
        if: inputs.action != 'preflight'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          ACTION: ${{ inputs.action }}
          CONFIRMATION: ${{ inputs.confirmation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_RUN_ATTEMPT: ${{ needs.source.outputs.source_run_attempt }}
          MANIFEST_SHA: ${{ needs.source.outputs.manifest_sha }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = 'refs/heads/main'
          test "${DEPLOY_PATH}" = '/opt/repoguard'
          case "${ACTION}:${CONFIRMATION}" in
            upgrade:UPGRADE_LOKI_SECURITY | rollback:ROLLBACK_LOKI_SECURITY) ;;
            *) echo 'Explicit production confirmation mismatch.' >&2; exit 1 ;;
          esac
          stage="/opt/repoguard/.deploy-state/loki-release-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "STAGE_PATH='${stage}' python3 -" <<'PY'
          import os, pathlib, re
          root = pathlib.Path('/opt/repoguard')
          base = root / '.deploy-state'
          stage = pathlib.Path(os.environ['STAGE_PATH'])
          assert root.resolve() == root and base.resolve() == base
          assert base.is_dir() and base.stat().st_uid == 0
          assert stage.parent == base and re.fullmatch('loki-release-input-[1-9][0-9]*-[1-9][0-9]*', stage.name)
          assert not stage.exists()
          stage.mkdir(mode=0o700)
          PY
          python3 - <<'PY'
          import hashlib, pathlib
          names = ['scripts/loki-release.py', 'scripts/loki_snapshot.py', 'scripts/loki-deploy.py',
              'scripts/release-manifest.py', 'verified-loki/loki-source-manifest.json']
          pathlib.Path('source-transport.sha256').write_text(''.join(
              hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() + '  ' + pathlib.Path(name).name + '\n' for name in names))
          PY
          scp -P "${DEPLOY_PORT:-22}" scripts/loki-release.py scripts/loki_snapshot.py \
            scripts/loki-deploy.py scripts/release-manifest.py verified-loki/loki-source-manifest.json source-transport.sha256 \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${stage}/"
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${stage}' && sha256sum -c source-transport.sha256 >&2 && python3 '${stage}/loki-deploy.py' '${ACTION}' --repository '${GITHUB_REPOSITORY}' --source-sha '${SOURCE_SHA}' --run-id '${SOURCE_RUN_ID}' --run-attempt '${SOURCE_RUN_ATTEMPT}' --manifest '${stage}/loki-source-manifest.json' --manifest-sha '${MANIFEST_SHA}' --release-id '${RELEASE_ID}' --confirmation '${CONFIRMATION}'" \
            > loki-production-result.json
      - name: Read retained journal after an unsuccessful operation
        if: failure() && steps.operation.outcome == 'failure'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          RELEASE_ID: ${{ needs.source.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[1-9][0-9]{4,19}-[1-9][0-9]{0,3}$ ]]
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -f '/opt/repoguard/.deploy-state/loki-security-${RELEASE_ID}/result.json' && test ! -L '/opt/repoguard/.deploy-state/loki-security-${RELEASE_ID}/result.json' && cat -- '/opt/repoguard/.deploy-state/loki-security-${RELEASE_ID}/result.json'" \
            > loki-production-result.json
      - name: Attest successful production operation result
        if: success() && inputs.action != 'preflight'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loki-production-result.json
      - name: Retain production preflight and operation result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-production-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            loki-production-preflight.json
            loki-production-result.json
          if-no-files-found: warn
          retention-days: 90
