name: Production Observability Image Security

on:
  pull_request:
    paths:
      - ".github/workflows/production-observability*.yml"
      - "config/observability/**"
      - "docker-compose.observability.yml"
      - "deploy/images/loki-security.Dockerfile"
      - ".github/actions/verify-loki-candidate/**"
      - "scripts/loki*.py"
      - "repoguard-backend/src/test/java/com/repoguard/agent/quality/Loki*Test.java"
      - "repoguard-backend/src/test/java/com/repoguard/agent/integration/LokiSnapshotLinuxIntegrationTest.java"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-observability*.yml"
      - "config/observability/**"
      - "docker-compose.observability.yml"
      - "deploy/images/loki-security.Dockerfile"
      - ".github/actions/verify-loki-candidate/**"
      - "scripts/loki*.py"
      - "repoguard-backend/src/test/java/com/repoguard/agent/quality/Loki*Test.java"
      - "repoguard-backend/src/test/java/com/repoguard/agent/integration/LokiSnapshotLinuxIntegrationTest.java"
  workflow_dispatch:
    inputs:
      build_loki_candidate:
        description: Build and validate a fixed-source Loki security candidate without publishing or deploying
        type: boolean
        default: false
        required: false
      archive_loki_candidate:
        description: Preserve the checked image and verify loading it on an independent runner
        type: boolean
        default: false
        required: false
      verify_loki_recovery:
        description: Verify encrypted volume recovery and real collector cursor upgrade and rollback on an isolated runner
        type: boolean
        default: false
        required: false
      publish_loki_candidate:
        description: Publish the exact checked image with source evidence; manual main only, no production deployment
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  resolve:
    name: Validate immutable observability images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate explicit publication request
        shell: bash
        env:
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_loki_candidate && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH_REQUESTED}" = "true" ]; then
            test "${GITHUB_REF}" = 'refs/heads/main' || {
              echo "Loki source publication requires an explicit dispatch from main." >&2
              exit 1
            }
          fi

      - name: Resolve pinned images
        id: images
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
          DOCKER_SOCKET_GID: "0"
        run: |
          set -euo pipefail
          compose_args=(
            -p repoguard-observability
            --env-file /dev/null
            -f docker-compose.observability.yml
            -f config/observability/docker-compose.production.yml
          )
          docker compose "${compose_args[@]}" config --quiet
          docker compose "${compose_args[@]}" \
            -f config/observability/docker-compose.runtime-metrics.yml config --quiet
          METRICS_REMOTE_WRITE_URL=https://metrics-validation.invalid/api/v1/write \
          METRICS_REMOTE_WRITE_USERNAME=validation \
          METRICS_REMOTE_WRITE_PASSWORD=validation \
            docker compose "${compose_args[@]}" \
              -f config/observability/docker-compose.metrics.yml config --quiet
          services="$(docker compose "${compose_args[@]}" config --services | sort | paste -sd, -)"
          test "${services}" = "alloy,docker-proxy,grafana,loki" || {
            echo "Unexpected observability service set: ${services}" >&2
            exit 1
          }
          local_services="$(docker compose "${compose_args[@]}" \
            -f config/observability/docker-compose.runtime-metrics.yml config --services | sort | paste -sd, -)"
          test "${local_services}" = "alloy,docker-proxy,grafana,loki" || {
            echo "Unexpected local metrics service set: ${local_services}" >&2
            exit 1
          }
          compose_images="$(docker compose "${compose_args[@]}" \
            -f config/observability/docker-compose.runtime-metrics.yml config --images | sort -u)"
          image_count="$(printf '%s\n' "${compose_images}" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          test "${image_count}" -eq 4 || {
            echo "Expected exactly four observability images; found ${image_count}." >&2
            exit 1
          }
          while IFS= read -r image; do
            case "${image}" in
              *@sha256:*)
                digest="${image##*@sha256:}"
                test "${#digest}" -eq 64
                case "${digest}" in
                  *[!0-9a-f]*)
                    echo "Invalid image digest: ${image}" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Observability image is not pinned by digest: ${image}" >&2
                exit 1
                ;;
            esac
          done <<EOF
          ${compose_images}
          EOF
          images="$(
            {
              printf '%s\n' "${compose_images}"
              printf '%s\n' \
                'grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7' \
                'grafana/grafana:11.6.16@sha256:d67af92050b8d93b393dc741864752a69c9da1ffa39c1bb9af49ad5d9e47d2c3' \
                'grafana/grafana:12.4.6@sha256:dc91df727e7a90043b74ed4e2df7e4302f0eb3ad8f1e9fe278b0f7a7689d3432' \
                'grafana/loki:3.5.12@sha256:c2a6860c2f94ecc98fffce7c10e6c8b350cf25e2ea3daa255dff27d7c6a4dffc' \
                'grafana/loki:3.6.13@sha256:b31e171ab90b521ff7e7f3a909eefc050811d4dbf02c857e44c2a2f555461b6b' \
                'grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc'
            } | sort -u
          )"
          images_json="$(printf '%s\n' "${images}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "images=${images_json}" >> "${GITHUB_OUTPUT}"

      - name: Validate runtime metrics Loki configuration
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
          DOCKER_SOCKET_GID: "0"
        run: |
          set -euo pipefail
          loki_image="$(docker compose -p repoguard-observability --env-file /dev/null \
            -f docker-compose.observability.yml \
            -f config/observability/docker-compose.production.yml \
            -f config/observability/docker-compose.runtime-metrics.yml config --images | grep '^grafana/loki:' | head -n 1)"
          test -n "${loki_image}"
          docker run --rm --network none --read-only \
            --memory 256m --cpus 0.25 --cap-drop ALL --security-opt no-new-privileges \
            -v "${PWD}/config/observability/loki-runtime-metrics.yml:/etc/loki/loki.yml:ro" \
            -v "${PWD}/config/observability/runtime-rules:/etc/loki/runtime-rules:ro" \
            "${loki_image}" -config.file=/etc/loki/loki.yml -verify-config=true

      - name: Validate Loki and Alloy configurations
        shell: bash
        env:
          GRAFANA_ADMIN_PASSWORD: validation-only
          DOCKER_SOCKET_GID: "0"
        run: |
          set -euo pipefail
          compose_args=(
            -p repoguard-observability
            --env-file /dev/null
            -f docker-compose.observability.yml
            -f config/observability/docker-compose.production.yml
          )
          loki_image="$(docker compose "${compose_args[@]}" config --images | grep '^grafana/loki:' | head -n 1)"
          alloy_image="$(docker compose "${compose_args[@]}" config --images | grep '^grafana/alloy:' | head -n 1)"
          test -n "${loki_image}"
          test -n "${alloy_image}"

          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "${PWD}/config/observability/loki.yml:/etc/loki/loki.yml:ro" \
            "${loki_image}" \
            -config.file=/etc/loki/loki.yml -verify-config=true

          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "${PWD}/config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            "${alloy_image}" validate /etc/alloy/config.alloy

          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -e METRICS_REMOTE_WRITE_URL=https://metrics-validation.invalid/api/v1/write \
            -e METRICS_REMOTE_WRITE_USERNAME=validation \
            -e METRICS_REMOTE_WRITE_PASSWORD=validation \
            -v "${PWD}/config/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            -v "${PWD}/config/observability/alloy/metrics.alloy:/etc/alloy/metrics.alloy:ro" \
            "${alloy_image}" validate /etc/alloy

          docker run --rm --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            -v "${PWD}/config/observability/promtail.yml:/etc/promtail/promtail.yml:ro" \
            "${alloy_image}" convert --source-format=promtail \
            --output=/dev/null /etc/promtail/promtail.yml

  scan:
    name: Report HIGH/CRITICAL CVEs · ${{ matrix.image }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.images) }}
    steps:
      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Explain baseline mode
        shell: bash
        run: |
          {
            echo "## Observability image baseline"
            echo
            echo "- Image: \`${{ matrix.image }}\`"
            echo "- HIGH/CRITICAL findings are reported while the staged supported-version upgrade is evaluated."
            echo "- Enforcement will be enabled after the upgraded production images pass the observation window."
          } >> "${GITHUB_STEP_SUMMARY}"

  loki-recovery-rehearsal:
    name: Isolated Loki encrypted backup and recovery
    needs: resolve
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.verify_loki_recovery) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      REPOGUARD_LOKI_RECOVERY_REHEARSAL: 'true'
    steps:
      - name: Checkout recovery implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Prepare recovery evidence directory
        run: mkdir -p repoguard-backend/target
      - name: Enforce zero HIGH and CRITICAL on the actual recovery source image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ghcr.io/cocojiu/pragent-loki@sha256:870766ebe4760b30077fd47206b21cfd3722f6f5f4dc6fdadc83612a179ee491
          scanners: vuln
          format: json
          output: repoguard-backend/target/loki-recovery-trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Run formal Loki release and recovery contracts
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=LokiReleaseManifestTest,LokiSnapshotSafetyTest,LokiDeploymentSafetyTest,ProductionObservabilityWorkflowContractTest,LokiSnapshotLinuxIntegrationTest test
      - name: Require actual execution and a verified recovery result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path('repoguard-backend/target')
          expected = {'quality.LokiReleaseManifestTest': 9, 'quality.LokiSnapshotSafetyTest': 6,
              'quality.LokiDeploymentSafetyTest': 7,
              'quality.ProductionObservabilityWorkflowContractTest': 8,
              'integration.LokiSnapshotLinuxIntegrationTest': 1}
          for name, count in expected.items():
              suite = ET.parse(root / ('surefire-reports/TEST-com.repoguard.agent.' + name + '.xml')).getroot()
              assert int(suite.get('tests')) == count
              assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
          result = json.loads((root / 'loki-recovery-evidence.json').read_text())
          assert result['state'] == 'verified' and result['encryptedBackupRestored']
          assert result['realAlloyCursorRetained'] and result['persistedLogsAfterRollback'] == 3
          assert result['previousLogsRetained'] == 2 and result['collectorWroteAfterRollback']
          assert result['originalVolumesUnchanged'] and result['productionWrites'] == result['publishedPorts'] == 0
          scan = json.loads((root / 'loki-recovery-trivy.json').read_text())
          assert scan['Metadata']['ImageID'] == 'sha256:68e3f90a94951e9afe02d7ff518d6ce03aa5acb0ae2c372dad76e74d658a0eb5'
          assert not [v for item in scan['Results'] for v in item.get('Vulnerabilities') or []]
          PY
      - name: Preserve isolated recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-encrypted-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            repoguard-backend/target/loki-recovery-evidence.json
            repoguard-backend/target/loki-recovery-trivy.json
            repoguard-backend/target/loki-fixture-diagnostics/
            repoguard-backend/target/surefire-reports/*Loki*Test*
            repoguard-backend/target/surefire-reports/*ProductionObservabilityWorkflowContractTest*
          if-no-files-found: error
          retention-days: 7


  loki-security-candidate:
    name: Isolated Loki security rebuild
    needs: resolve
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.build_loki_candidate || inputs.archive_loki_candidate || inputs.publish_loki_candidate)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build fixed-source candidate without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p loki-candidate-evidence
          docker build --progress=plain -f deploy/images/loki-security.Dockerfile \
            -t repoguard-loki-candidate:ci deploy/images 2>&1 | tee loki-candidate-evidence/build.log
          docker image inspect repoguard-loki-candidate:ci > loki-candidate-evidence/image.json
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges repoguard-loki-candidate:ci -version \
            2>&1 | tee loki-candidate-evidence/version.txt

      - name: Enforce zero HIGH and CRITICAL candidate vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: repoguard-loki-candidate:ci
          format: json
          output: loki-candidate-evidence/trivy.json
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate checked candidate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: repoguard-loki-candidate:ci
          format: cyclonedx
          output: loki-candidate-evidence/sbom.cdx.json

      - name: Validate both deployed Loki configurations
        shell: bash
        run: |
          set -euo pipefail
          for config in loki.yml loki-runtime-metrics.yml; do
            docker run --rm --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges \
              -v "${PWD}/config/observability/${config}:/etc/loki/loki.yml:ro" \
              -v "${PWD}/config/observability/runtime-rules:/etc/loki/runtime-rules:ro" \
              repoguard-loki-candidate:ci -config.file=/etc/loki/loki.yml -verify-config=true \
              2>&1 | tee "loki-candidate-evidence/${config}.log"
          done

      - name: Verify isolated persisted log upgrade and rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, time, urllib.error, urllib.parse, urllib.request

          evidence = pathlib.Path('loki-candidate-evidence')
          owner = 'repoguard-loki-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
          network, volume = owner + '-net', owner + '-data'
          baseline = 'grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193'
          active = None
          resources = []
          results = []
          expected = set()
          start = time.time_ns() - 60_000_000_000
          runtime_config = pathlib.Path('config/observability/loki-runtime-metrics.yml').resolve()
          runtime_rules = pathlib.Path('config/observability/runtime-rules').resolve()
          expected_rules = set(re.findall(r'^\s+- alert: ([A-Za-z0-9_]+)$',
              (runtime_rules / 'fake/repoguard-runtime.yml').read_text(), re.MULTILINE))
          assert len(expected_rules) >= 6

          def docker(*args):
              return subprocess.check_output(['docker', *args], text=True, stderr=subprocess.STDOUT, timeout=120).strip()

          def request(base, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data,
                  headers={'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=5) as response:
                  return response.status, response.read()

          def wait_for(check, description):
              deadline = time.monotonic() + 120
              while True:
                  try:
                      value = check()
                      if value:
                          return value
                  except (urllib.error.URLError, TimeoutError, ConnectionError):
                      pass
                  if time.monotonic() >= deadline:
                      raise RuntimeError(description + ' timed out')
                  time.sleep(2)

          try:
              docker('pull', baseline)
              docker('network', 'create', '--internal', '--label', 'repoguard.loki-owner=' + owner, network)
              resources.append(('network', network))
              docker('volume', 'create', '--label', 'repoguard.loki-owner=' + owner, volume)
              resources.append(('volume', volume))
              for phase, image, write in [('baseline', baseline, True),
                                          ('candidate', 'repoguard-loki-candidate:ci', True),
                                          ('rollback', baseline, False)]:
                  active = owner + '-' + phase
                  docker('run', '-d', '--name', active, '--network', network, '--read-only',
                      '--memory', '384m', '--cpus', '0.50', '--cap-drop', 'ALL',
                      '--security-opt', 'no-new-privileges', '--tmpfs', '/tmp:rw,noexec,nosuid,size=32m',
                      '--label', 'repoguard.loki-owner=' + owner,
                      '-v', volume + ':/loki',
                      '-v', str(runtime_config) + ':/etc/loki/loki.yml:ro',
                      '-v', str(runtime_rules) + ':/etc/loki/runtime-rules:ro',
                      image, '-config.file=/etc/loki/loki.yml', '-ingester.wal-dir=/loki/wal')
                  state = json.loads(docker('inspect', active))[0]
                  assert state['Config']['User'] == '10001'
                  assert state['HostConfig']['ReadonlyRootfs'] is True
                  assert state['HostConfig']['Memory'] == 384 * 1024 * 1024
                  assert state['HostConfig']['NanoCpus'] == 500_000_000
                  assert not any(binding for binding in (state['NetworkSettings']['Ports'] or {}).values())
                  base = 'http://' + state['NetworkSettings']['Networks'][network]['IPAddress'] + ':3100'
                  wait_for(lambda: request(base, '/ready')[0] == 200, phase + ' readiness')
                  loaded_rules = set()

                  def all_rules_loaded():
                      status, body = request(base, '/prometheus/api/v1/rules')
                      rules = json.loads(body)
                      assert status == 200 and rules['status'] == 'success'
                      loaded_rules.clear()
                      loaded_rules.update(rule['name'] for group in rules['data']['groups'] for rule in group['rules'])
                      return expected_rules <= loaded_rules

                  wait_for(all_rules_loaded, phase + ' runtime rule loading')
                  if write:
                      message = phase + '-' + owner
                      status, _ = request(base, '/loki/api/v1/push', {'streams': [{
                          'stream': {'job': 'repoguard-loki-rebuild'},
                          'values': [[str(time.time_ns()), message]]}]})
                      assert status == 204
                      expected.add(message)

                  def has_all_logs():
                      query = urllib.parse.urlencode({'query': '{job="repoguard-loki-rebuild"}',
                          'start': start, 'end': time.time_ns(), 'limit': 100})
                      status, body = request(base, '/loki/api/v1/query_range?' + query)
                      result = json.loads(body)
                      assert status == 200 and result['status'] == 'success'
                      messages = {value[1] for stream in result['data']['result'] for value in stream['values']}
                      return expected <= messages

                  wait_for(has_all_logs, phase + ' persisted log query')
                  results.append({'phase': phase, 'imageId': state['Image'], 'retainedLogs': sorted(expected),
                      'loadedRules': sorted(loaded_rules), 'memoryLimitBytes': state['HostConfig']['Memory']})
                  docker('stop', '--time', '45', active)
                  stopped = json.loads(docker('inspect', active))[0]['State']
                  assert not stopped.get('OOMKilled') and stopped['ExitCode'] == 0
                  (evidence / (phase + '.log')).write_text(docker('logs', active))
                  docker('rm', active)
                  active = None
              (evidence / 'persistence-result.json').write_text(json.dumps({
                  'productionConnections': 0, 'publishedPorts': 0, 'phases': results,
                  'runtimeConfigSha256': hashlib.sha256(runtime_config.read_bytes()).hexdigest(),
                  'memoryLimitBytes': 384 * 1024 * 1024, 'cpuLimit': 0.50,
                  'expectedRules': sorted(expected_rules)}, indent=2))
          finally:
              if active:
                  try:
                      (evidence / 'failed-container.log').write_text(docker('logs', active))
                  finally:
                      docker('rm', '-f', active)
              for kind, name in reversed(resources):
                  labels = json.loads(docker(kind, 'inspect', name))[0].get('Labels') or {}
                  assert labels.get('repoguard.loki-owner') == owner
                  docker(kind, 'rm', name)
          PY

      - name: Archive exact checked image
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.archive_loki_candidate || inputs.publish_loki_candidate) }}
        shell: bash
        run: |
          set -euo pipefail
          docker image save repoguard-loki-candidate:ci --output loki-candidate-evidence/image.tar
          (cd loki-candidate-evidence && sha256sum image.tar > image.tar.sha256)

      - name: Retain isolated candidate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-security-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: loki-candidate-evidence/
          retention-days: 7
          if-no-files-found: error

  loki-candidate-transfer:
    name: Verify Loki image on a fresh runner
    needs: loki-security-candidate
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.archive_loki_candidate || inputs.publish_loki_candidate) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's checked candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "loki-security-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --dir loki-candidate-evidence
      - name: Verify transferred candidate
        uses: ./.github/actions/verify-loki-candidate
        with:
          directory: loki-candidate-evidence
      - name: Preserve independent transfer verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-candidate-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: loki-candidate-evidence/transfer-verification.json
          if-no-files-found: error
          retention-days: 7

  loki-candidate-publish:
    name: Publish checked Loki source image
    needs: [resolve, loki-security-candidate, loki-candidate-transfer]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_loki_candidate == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download this run's checked candidate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "loki-security-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --dir loki-candidate-evidence
      - name: Verify transferred candidate
        id: loaded
        uses: ./.github/actions/verify-loki-candidate
        with:
          directory: loki-candidate-evidence
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push and read back exact checked image
        id: image
        shell: bash
        env:
          CHECKED_IMAGE_ID: ${{ steps.loaded.outputs.image_id }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-loki"
          tag="3.7.8-repoguard.1-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="${repository}:${tag}"
          docker image tag "${CHECKED_IMAGE_ID}" "${image}"
          docker image push "${image}"
          digest="$(docker image inspect "${image}" | jq -er --arg prefix "${repository}@" \
            '[.[0].RepoDigests[] | select(startswith($prefix)) | split("@")[1]] | unique | if length == 1 then .[0] else error("ambiguous pushed digest") end')"
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker image pull "${repository}@${digest}"
          test "$(docker image inspect --format '{{.Id}}' "${repository}@${digest}")" = "${CHECKED_IMAGE_ID}"
          echo "repository=${repository}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Attest exact image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
      - name: Attest checked SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: loki-candidate-evidence/sbom.cdx.json
      - name: Create checked Loki source manifest
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ steps.image.outputs.repository }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          CHECKED_IMAGE_ID: ${{ steps.loaded.outputs.image_id }}
          CHECKED_ARCHIVE_SHA256: ${{ steps.loaded.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('loki-candidate-evidence')
          digest = os.environ['SOURCE_DIGEST']
          assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
          evidence = {}
          for name in ('trivy.json', 'sbom.cdx.json', 'persistence-result.json', 'transfer-verification.json'):
              evidence[name] = hashlib.sha256((root / name).read_bytes()).hexdigest()
          runtime = json.loads((root / 'persistence-result.json').read_text())
          manifest = {'formatVersion': 1, 'version': '3.7.8-repoguard.1',
              'source': {'repository': os.environ['GITHUB_REPOSITORY'],
                  'workflow': '.github/workflows/production-observability-security.yml',
                  'gitSha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF'],
                  'runId': int(os.environ['GITHUB_RUN_ID']), 'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT'])},
              'upstreamGitSha': '09e6ce2ff1bdc19763a10265b870c86f51c98655',
              'image': {'repository': os.environ['SOURCE_REPOSITORY'], 'digest': digest,
                  'imageId': os.environ['CHECKED_IMAGE_ID'], 'platform': 'linux/amd64'},
              'checks': {'highCriticalCount': 0, 'configurationValidation': 'passed',
                  'persistenceUpgradeRollback': 'passed', 'independentImageTransfer': 'passed',
                  'imageProvenance': 'attested', 'sbom': 'attested'},
              'runtime': {'configSha256': runtime['runtimeConfigSha256'],
                  'memoryLimitBytes': runtime['memoryLimitBytes'], 'cpuLimit': runtime['cpuLimit'],
                  'expectedRules': runtime['expectedRules']},
              'archiveSha256': os.environ['CHECKED_ARCHIVE_SHA256'], 'evidenceSha256': evidence}
          pathlib.Path('loki-source-manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Attest checked Loki source manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: loki-source-manifest.json
      - name: Preserve signed source manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loki-source-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: loki-source-manifest.json
          if-no-files-found: error
          retention-days: 90
