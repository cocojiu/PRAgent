name: Real Chain Smoke

on:
  workflow_dispatch:
    inputs:
      max_total_tokens:
        description: Stop before starting another task after this cumulative token budget is reached
        required: true
        default: "15000"
        type: string
      backup_path:
        description: Optional absolute pre-D1 database backup path
        required: false
        type: string
      backend_image:
        description: Optional full backend image reference; defaults to the image recorded in the deployment environment
        required: false
        type: string
      backend_image_tag:
        description: Optional existing ACR backend image tag to pull into the isolated stack
        required: false
        type: string
      expected_revision:
        description: Optional full 40-character OCI revision; required with backend_image_tag
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: GitHub and LLM real chain smoke
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }
          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]*)
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key for deployment target..."
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying after $((attempt * 10)) seconds..." >&2
            sed 's/^/ssh-keyscan: /' ssh-keyscan.err >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Verify production health before isolated smoke
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
        run: curl -fsS "http://${DEPLOY_HOST}/actuator/health"

      - name: Verify remote isolated smoke assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -x '${DEPLOY_PATH}/performance/remote/run-isolated-real-chain-smoke.sh' && \
             test -x '${DEPLOY_PATH}/performance/remote/run-real-chain-smoke.sh' && \
             test -f '${DEPLOY_PATH}/docker-compose.smoke.yml' || {
               echo 'Missing remote isolated smoke assets under ${DEPLOY_PATH}' >&2
               exit 1
             }"

      - name: Run three sequential real tasks in isolated stack
        shell: bash
        env:
          ALIYUN_DEPLOY_REGISTRY: ${{ secrets.ALIYUN_DEPLOY_REGISTRY || vars.ALIYUN_DEPLOY_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || vars.ALIYUN_NAMESPACE }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME || vars.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_REPOSITORY: ${{ secrets.ALIYUN_REPOSITORY || vars.ALIYUN_REPOSITORY }}
          BACKUP_PATH: ${{ inputs.backup_path }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          MAX_TOTAL_TOKENS: ${{ inputs.max_total_tokens }}
          SMOKE_SUMMARY_PATH: ${{ runner.temp }}/real-chain-smoke-summary.txt
          SMOKE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SMOKE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          backend_image="${BACKEND_IMAGE}"
          pull_requested=false

          case "${backend_image}" in
            *[!a-zA-Z0-9._:/@-]*)
              echo "backend_image contains unsupported characters." >&2
              exit 2
              ;;
          esac
          case "${BACKEND_IMAGE_TAG}" in
            *[!a-zA-Z0-9_.-]*)
              echo "backend_image_tag contains unsupported characters." >&2
              exit 2
              ;;
          esac
          case "${EXPECTED_REVISION}" in
            ''|*[!0-9a-f]*)
              if [ -n "${EXPECTED_REVISION}" ]; then
                echo "expected_revision must be a lowercase hexadecimal commit SHA." >&2
                exit 2
              fi
              ;;
          esac
          if [ -n "${EXPECTED_REVISION}" ] && [ "${#EXPECTED_REVISION}" -ne 40 ]; then
            echo "expected_revision must contain exactly 40 hexadecimal characters." >&2
            exit 2
          fi

          if [ -n "${BACKEND_IMAGE_TAG}" ]; then
            test -z "${backend_image}" || {
              echo "Specify either backend_image or backend_image_tag, not both." >&2
              exit 2
            }
            test -n "${EXPECTED_REVISION}" || {
              echo "expected_revision is required with backend_image_tag." >&2
              exit 2
            }
            for value in \
              "${ALIYUN_DEPLOY_REGISTRY}" \
              "${ALIYUN_NAMESPACE}" \
              "${ALIYUN_REPOSITORY}"; do
              case "${value}" in
                ''|*[!a-zA-Z0-9._:/-]*)
                  echo "Aliyun image coordinates are missing or contain unsupported characters." >&2
                  exit 2
                  ;;
              esac
            done
            case "${ALIYUN_REGISTRY_USERNAME}" in
              ''|*[!a-zA-Z0-9._@-]*)
                echo "Aliyun registry username is missing or contains unsupported characters." >&2
                exit 2
                ;;
            esac
            test -n "${ALIYUN_REGISTRY_PASSWORD}" || {
              echo "Missing ALIYUN_REGISTRY_PASSWORD." >&2
              exit 2
            }
            backend_image="${ALIYUN_DEPLOY_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:backend-${BACKEND_IMAGE_TAG}"
            pull_requested=true
            printf '%s' "${ALIYUN_REGISTRY_PASSWORD}" \
              | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "docker login '${ALIYUN_DEPLOY_REGISTRY}' -u '${ALIYUN_REGISTRY_USERNAME}' --password-stdin"
          fi

          smoke_project="repoguard-smoke-${SMOKE_RUN_ID}-${SMOKE_RUN_ATTEMPT}"
          expected_strategy_policy="1|review-prompt-v2|review-context-v2|review-schema-v2|high-risk-verifier-v1|server-risk-v2|OBSERVE|1|1"
          policy_probe_log="$(mktemp)"
          smoke_output_log="$(mktemp "${RUNNER_TEMP}/real-chain-smoke-output.XXXXXX.log")"
          policy_probe_pid=""
          : >"${SMOKE_SUMMARY_PATH}"

          cleanup_policy_probe() {
            if [ -n "${policy_probe_pid}" ] && kill -0 "${policy_probe_pid}" 2>/dev/null; then
              kill "${policy_probe_pid}" 2>/dev/null || true
              wait "${policy_probe_pid}" 2>/dev/null || true
            fi
            rm -f -- "${policy_probe_log}" "${smoke_output_log}"
          }

          write_observe_summary() {
            local smoke_exit_status="$1"
            local policy_probe_exit_status="$2"
            {
              printf 'workflow_head_revision=%s\n' "${GITHUB_SHA}"
              printf 'target_backend_revision=%s\n' "${EXPECTED_REVISION:-deployment-image}"
              printf 'workflow_run_id=%s\n' "${SMOKE_RUN_ID}"
              printf 'workflow_run_attempt=%s\n' "${SMOKE_RUN_ATTEMPT}"
              printf 'smoke_exit_status=%s\n' "${smoke_exit_status}"
              printf 'policy_probe_exit_status=%s\n' "${policy_probe_exit_status}"
              LC_ALL=C grep -E \
                '^smoke_(backend_revision=|review_policy_source=|stale_tasks_neutralized=|created |result=|progress |summary |stop=|cleanup )' \
                "${smoke_output_log}" \
                | LC_ALL=C grep -E '^[a-zA-Z0-9_. =|:/-]+$' || true
              LC_ALL=C grep -E '^smoke_strategy_policy=[a-zA-Z0-9_.|/-]+$' \
                "${policy_probe_log}" || true
            } >"${SMOKE_SUMMARY_PATH}"
            {
              echo "### OBSERVE isolated smoke summary"
              echo
              echo '```text'
              cat "${SMOKE_SUMMARY_PATH}"
              echo '```'
            } >>"${GITHUB_STEP_SUMMARY}"
          }
          trap cleanup_policy_probe EXIT

          printf -v policy_probe_args ' %q' "${smoke_project}" "${expected_strategy_policy}"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s --${policy_probe_args}" >"${policy_probe_log}" 2>&1 <<'POLICY_PROBE' &
          set -euo pipefail
          project="$1"
          expected_policy="$2"
          for _ in $(seq 1 120); do
            mysql_container="$(
              docker ps -q \
                --filter "label=com.docker.compose.project=${project}" \
                --filter "label=com.docker.compose.service=mysql"
            )"
            if [ -n "${mysql_container}" ]; then
              strategy_policy="$(
                docker exec "${mysql_container}" sh -lc \
                  'mysql -N -s -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -e "SELECT CONCAT_WS('\''|'\'', strategy_version, prompt_version, context_version, schema_version, verifier_version, aggregation_version, enforcement_mode, replay_verified, active) FROM review_strategy_policy_snapshot WHERE active = 1 ORDER BY id DESC LIMIT 1"' \
                  2>/dev/null || true
              )"
              if [ -n "${strategy_policy}" ]; then
                echo "smoke_strategy_policy=${strategy_policy}"
                test "${strategy_policy}" = "${expected_policy}" || {
                  echo "Active review strategy is not the expected OBSERVE baseline." >&2
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for the isolated OBSERVE strategy snapshot." >&2
          exit 1
          POLICY_PROBE
          policy_probe_pid=$!

          printf -v smoke_args ' %q' \
            "${DEPLOY_PATH}" \
            "${backend_image}" \
            "${pull_requested}" \
            "${EXPECTED_REVISION}" \
            "${BACKUP_PATH}" \
            "${MAX_TOTAL_TOKENS}" \
            "${SMOKE_RUN_ID}" \
            "${SMOKE_RUN_ATTEMPT}"
          set +e
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s --${smoke_args}" 2>&1 <<'ISOLATED_SMOKE' | tee "${smoke_output_log}"
          set -euo pipefail
          deploy_path="$1"
          backend_image="$2"
          pull_requested="$3"
          expected_revision="$4"
          backup_path="$5"
          max_total_tokens="$6"
          smoke_run_id="$7"
          smoke_run_attempt="$8"
          production_env="${deploy_path}/.env"
          docker_compat_dir=""

          cleanup_runtime_compatibility() {
            if [ -n "${docker_compat_dir}" ]; then
              rm -rf -- "${docker_compat_dir}"
            fi
          }
          trap cleanup_runtime_compatibility EXIT

          read_production_secret() {
            secret_name="$1"
            direct_value="$(
              sed -n "s/^${secret_name}=//p" "${production_env}" | tail -n 1
            )"
            if [ -n "${direct_value}" ]; then
              printf '%s' "${direct_value}"
              return 0
            fi

            secret_file="$(
              sed -n "s/^${secret_name}_FILE=//p" "${production_env}" | tail -n 1
            )"
            test -n "${secret_file}" || {
              echo "Missing ${secret_name} and ${secret_name}_FILE in production environment." >&2
              return 1
            }
            case "${secret_file}" in
              /*) ;;
              *) secret_file="${deploy_path}/${secret_file#./}" ;;
            esac
            test -r "${secret_file}" || {
              echo "Configured ${secret_name}_FILE is not readable." >&2
              return 1
            }
            cat -- "${secret_file}"
          }

          test -f "${production_env}" || {
            echo "Missing production environment file." >&2
            exit 1
          }
          encryption_key="$(read_production_secret REPOGUARD_SECURITY_ENCRYPTION_KEY)"
          encryption_salt="$(read_production_secret REPOGUARD_SECURITY_ENCRYPTION_SALT)"
          production_mysql_password="$(read_production_secret MYSQL_PASSWORD)"
          test -n "${encryption_key}" \
            && test -n "${encryption_salt}" \
            && test -n "${production_mysql_password}" || {
            echo "Production encryption and MySQL compatibility material must not be empty." >&2
            exit 1
          }
          case "${production_mysql_password}" in
            *$'\n'*|*$'\r'*)
              echo "Production MySQL password cannot contain line breaks." >&2
              exit 1
              ;;
          esac
          export REPOGUARD_SECURITY_ENCRYPTION_KEY="${encryption_key}"
          export REPOGUARD_SECURITY_ENCRYPTION_SALT="${encryption_salt}"
          export REPOGUARD_GITHUB_WEBHOOK_SECRET="$(openssl rand -hex 32)"
          unset encryption_key encryption_salt

          if [ -z "${backend_image}" ]; then
            backend_container="$(
              cd "${deploy_path}"
              docker compose --env-file .env -f docker-compose.prod.yml ps -q backend
            )"
            if [ -n "${backend_container}" ]; then
              backend_image="$(
                docker inspect "${backend_container}" --format '{{.Config.Image}}'
              )"
            fi
          fi
          if [ -z "${backend_image}" ]; then
            backend_image="$(
              sed -n 's/^BACKEND_IMAGE=//p' "${production_env}" | tail -n 1
            )"
          fi
          test -n "${backend_image}" || {
            echo "Missing deployed BACKEND_IMAGE" >&2
            exit 1
          }
          if [ "${pull_requested}" = "true" ]; then
            docker pull "${backend_image}" >/dev/null
          fi
          if [ -n "${expected_revision}" ]; then
            actual_revision="$(
              docker image inspect "${backend_image}" \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
            )"
            test "${actual_revision}" = "${expected_revision}" || {
              echo "Backend image revision mismatch: expected ${expected_revision}, found ${actual_revision:-missing}" >&2
              exit 1
            }
            echo "smoke_backend_revision=${actual_revision}"
          fi

          production_mysql_container="$(
            cd "${deploy_path}"
            docker compose --env-file "${production_env}" \
              -f docker-compose.prod.yml ps -q mysql
          )"
          test -n "${production_mysql_container}" || {
            echo "Production MySQL container is unavailable for compatibility injection." >&2
            exit 1
          }
          real_docker_bin="$(command -v docker)"
          test -x "${real_docker_bin}" || {
            echo "Docker executable is unavailable." >&2
            exit 1
          }
          "${real_docker_bin}" exec --help | grep -q -- '--env-file' || {
            echo "Docker exec does not support --env-file compatibility injection." >&2
            exit 1
          }
          docker_compat_dir="$(
            mktemp -d "${deploy_path}/.smoke-docker-compat.XXXXXX"
          )"
          chmod 0700 "${docker_compat_dir}"
          printf 'MYSQL_PASSWORD=%s\n' "${production_mysql_password}" \
            >"${docker_compat_dir}/production-mysql.env"
          chmod 0600 "${docker_compat_dir}/production-mysql.env"
          unset production_mysql_password
          cat >"${docker_compat_dir}/docker" <<'DOCKER_COMPATIBILITY'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "exec" ] \
              && [ "${2:-}" = "${PRODUCTION_MYSQL_CONTAINER:-}" ]; then
            shift
            exec "${REAL_DOCKER_BIN}" exec \
              --env-file "${PRODUCTION_MYSQL_ENV_FILE}" "$@"
          fi
          exec "${REAL_DOCKER_BIN}" "$@"
          DOCKER_COMPATIBILITY
          chmod 0700 "${docker_compat_dir}/docker"
          export PRODUCTION_MYSQL_CONTAINER="${production_mysql_container}"
          export PRODUCTION_MYSQL_ENV_FILE="${docker_compat_dir}/production-mysql.env"
          export REAL_DOCKER_BIN="${real_docker_bin}"
          export PATH="${docker_compat_dir}:${PATH}"
          hash -r

          "${deploy_path}/performance/remote/run-isolated-real-chain-smoke.sh" \
            "${backup_path}" "${max_total_tokens}" "${backend_image}" \
            "${smoke_run_id}" "${smoke_run_attempt}"
          ISOLATED_SMOKE
          smoke_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          smoke_status="${smoke_pipeline_status[0]}"
          if [ "${smoke_pipeline_status[1]}" -ne 0 ]; then
            smoke_status="${smoke_pipeline_status[1]}"
          fi

          policy_probe_status=0
          if [ "${smoke_status}" -ne 0 ]; then
            if kill -0 "${policy_probe_pid}" 2>/dev/null; then
              kill "${policy_probe_pid}" 2>/dev/null || true
            fi
          fi
          wait "${policy_probe_pid}" || policy_probe_status=$?
          policy_probe_pid=""
          cat "${policy_probe_log}" || true
          write_observe_summary "${smoke_status}" "${policy_probe_status}"
          if [ "${smoke_status}" -ne 0 ]; then
            exit "${smoke_status}"
          fi
          test "${policy_probe_status}" -eq 0

      - name: Verify production health after isolated smoke
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
        run: curl -fsS "http://${DEPLOY_HOST}/actuator/health"

      - name: Upload sanitized OBSERVE smoke summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-chain-observe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/real-chain-smoke-summary.txt
          if-no-files-found: warn
          retention-days: 90
