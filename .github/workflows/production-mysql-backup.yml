name: Production MySQL Backup

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      verify_restore:
        description: Restore into an isolated MySQL container and rehearse pending migrations
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-mysql-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Verified encrypted backup to immutable primary and replica storage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Acquire short-lived backup credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.REPOGUARD_BACKUP_ROLE_ARN || vars.REPOGUARD_BACKUP_ROLE_ARN }}
          role-session-name: repoguard-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: ${{ secrets.REPOGUARD_BACKUP_REGION || vars.REPOGUARD_BACKUP_REGION }}
          mask-aws-account-id: true

      - name: Prepare SSH
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" && test -n "${DEPLOY_SSH_KEY}"
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${DEPLOY_PORT:-22}" "${DEPLOY_HOST}" >>~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts

      - name: Install backup operation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_USER}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${DEPLOY_PATH}" == /opt/repoguard || "${DEPLOY_PATH}" == /opt/repoguard/* ]]
          ssh_args=(-i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}")
          scp_args=(-i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}")
          ssh "${ssh_args[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -m 700 -d '${DEPLOY_PATH}/scripts' '${DEPLOY_PATH}/migration-rehearsal' '/opt/repoguard/backups/mysql' && find '${DEPLOY_PATH}/migration-rehearsal' -maxdepth 1 -type f -name 'V*__*.sql' -delete"
          scp "${scp_args[@]}" scripts/backup-prod-mysql.sh scripts/prune-prod-mysql-backups.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/"
          scp "${scp_args[@]}" repoguard-backend/src/main/resources/db/migration/V*__*.sql \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/migration-rehearsal/"
          ssh "${ssh_args[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/backup-prod-mysql.sh' '${DEPLOY_PATH}/scripts/prune-prod-mysql-backups.sh'"

      - name: Create encrypted backup and verify restore
        id: backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.REPOGUARD_BACKUP_ENCRYPTION_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESTORE_INPUT: ${{ inputs.verify_restore }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSWORD}"
          echo "::add-mask::${BACKUP_ENCRYPTION_PASSWORD}"
          verify_restore="true"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            verify_restore="${VERIFY_RESTORE_INPUT}"
          fi
          [[ "${verify_restore}" == "true" || "${verify_restore}" == "false" ]]

          result="${RUNNER_TEMP}/mysql-backup-result.txt"
          printf '%s\n' "${BACKUP_ENCRYPTION_PASSWORD}" \
            | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "cd '${DEPLOY_PATH}' && BACKUP_ROOT='/opt/repoguard/backups/mysql' VERIFY_RESTORE='${verify_restore}' VERIFY_MIGRATIONS='${verify_restore}' MIGRATION_DIR='${DEPLOY_PATH}/migration-rehearsal' bash scripts/backup-prod-mysql.sh --password-stdin" \
            | tee "${result}"

          expected="${verify_restore}"
          [[ "${verify_restore}" == "true" ]] || expected="skipped"
          restore_verified="$(awk -F= '$1 == "RESTORE_VERIFIED" {print $2}' "${result}")"
          migration_rehearsal="$(awk -F= '$1 == "MIGRATION_REHEARSAL" {print $2}' "${result}")"
          [[ "${restore_verified}" == "${expected}" && "${migration_rehearsal}" == "${expected}" ]]

          backup_path="$(awk -F= '$1 == "BACKUP_PATH" {print $2}' "${result}")"
          backup_sha256="$(awk -F= '$1 == "BACKUP_SHA256" {print $2}' "${result}")"
          backup_name="${backup_path##*/}"
          [[ "${backup_path}" == "/opt/repoguard/backups/mysql/${backup_name}" ]]
          [[ "${backup_name}" =~ ^repoguard-[0-9]{8}T[0-9]{6}Z\.sql\.gz\.enc$ ]]
          [[ "${backup_sha256}" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "path=${backup_path}"
            echo "name=${backup_name}"
            echo "sha256=${backup_sha256}"
            echo "restore_verified=${restore_verified}"
          } >>"${GITHUB_OUTPUT}"

      - name: Copy verified encrypted backup off host
        id: copy
        shell: bash
        env:
          BACKUP_PATH: ${{ steps.backup.outputs.path }}
          BACKUP_NAME: ${{ steps.backup.outputs.name }}
          BACKUP_SHA256: ${{ steps.backup.outputs.sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          [[ "${BACKUP_PATH}" == "/opt/repoguard/backups/mysql/${BACKUP_NAME}" ]]
          [[ "${BACKUP_NAME}" =~ ^repoguard-[0-9]{8}T[0-9]{6}Z\.sql\.gz\.enc$ ]]
          [[ "${BACKUP_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          directory="${RUNNER_TEMP}/mysql-offsite"
          install -m 700 -d "${directory}"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${BACKUP_PATH}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${BACKUP_PATH}.sha256" \
            "${directory}/"
          [[ "$(awk 'NR == 1 {print $1}' "${directory}/${BACKUP_NAME}.sha256")" == "${BACKUP_SHA256}" ]]
          (cd "${directory}" && sha256sum --check --status "${BACKUP_NAME}.sha256")
          chmod 600 "${directory}/${BACKUP_NAME}" "${directory}/${BACKUP_NAME}.sha256"
          echo "directory=${directory}" >>"${GITHUB_OUTPUT}"

      - name: Persist to immutable primary and replica storage
        id: object_storage
        shell: bash
        env:
          BACKUP_DIRECTORY: ${{ steps.copy.outputs.directory }}
          BACKUP_NAME: ${{ steps.backup.outputs.name }}
          BACKUP_SHA256: ${{ steps.backup.outputs.sha256 }}
          REPOGUARD_BACKUP_BUCKET: ${{ secrets.REPOGUARD_BACKUP_BUCKET || vars.REPOGUARD_BACKUP_BUCKET }}
          REPOGUARD_BACKUP_REGION: ${{ secrets.REPOGUARD_BACKUP_REGION || vars.REPOGUARD_BACKUP_REGION }}
          REPOGUARD_BACKUP_KMS_KEY_ID: ${{ secrets.REPOGUARD_BACKUP_KMS_KEY_ID || vars.REPOGUARD_BACKUP_KMS_KEY_ID }}
          REPOGUARD_BACKUP_ENDPOINT: ${{ secrets.REPOGUARD_BACKUP_ENDPOINT || vars.REPOGUARD_BACKUP_ENDPOINT }}
          REPOGUARD_BACKUP_REPLICA_BUCKET: ${{ secrets.REPOGUARD_BACKUP_REPLICA_BUCKET || vars.REPOGUARD_BACKUP_REPLICA_BUCKET }}
          REPOGUARD_BACKUP_REPLICA_REGION: ${{ secrets.REPOGUARD_BACKUP_REPLICA_REGION || vars.REPOGUARD_BACKUP_REPLICA_REGION }}
          REPOGUARD_BACKUP_REPLICA_KMS_KEY_ID: ${{ secrets.REPOGUARD_BACKUP_REPLICA_KMS_KEY_ID || vars.REPOGUARD_BACKUP_REPLICA_KMS_KEY_ID }}
          REPOGUARD_BACKUP_REPLICA_ENDPOINT: ${{ secrets.REPOGUARD_BACKUP_REPLICA_ENDPOINT || vars.REPOGUARD_BACKUP_REPLICA_ENDPOINT }}
          REPOGUARD_BACKUP_OBJECT_LOCK_DAYS: ${{ vars.REPOGUARD_BACKUP_OBJECT_LOCK_DAYS }}
        run: |
          set -euo pipefail
          timestamp="${BACKUP_NAME#repoguard-}"
          object_key="repoguard/mysql/${timestamp:0:4}/${timestamp:4:2}/${timestamp:6:2}/${BACKUP_NAME}"
          result="${RUNNER_TEMP}/mysql-object-storage-result.txt"
          bash scripts/upload-immutable-backup-object.sh \
            "${BACKUP_DIRECTORY}/${BACKUP_NAME}" "${object_key}" "${BACKUP_SHA256}" \
            | tee "${result}"
          [[ "$(awk -F= '$1 == "IMMUTABLE_REPLICATION_VERIFIED" {print $2}' "${result}")" == "true" ]]
          {
            echo "verified=true"
            echo "primary_uri=$(awk -F= '$1 == "PRIMARY_OBJECT_URI" {print $2}' "${result}")"
            echo "replica_uri=$(awk -F= '$1 == "REPLICA_OBJECT_URI" {print $2}' "${result}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Verify production health before retention
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 8 --max-time 20 https://pragent.top/actuator/health/readiness)"
          [[ "$(jq -r '.status // empty' <<<"${health}")" == "UP" ]]

      - name: Apply local seven-backup retention
        id: retention
        if: ${{ success() && steps.backup.outputs.restore_verified == 'true' && steps.object_storage.outputs.verified == 'true' }}
        shell: bash
        env:
          CURRENT_BACKUP_PATH: ${{ steps.backup.outputs.path }}
          CURRENT_BACKUP_SHA256: ${{ steps.backup.outputs.sha256 }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          result="${RUNNER_TEMP}/mysql-retention-result.txt"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && CURRENT_BACKUP_PATH='${CURRENT_BACKUP_PATH}' CURRENT_BACKUP_SHA256='${CURRENT_BACKUP_SHA256}' bash scripts/prune-prod-mysql-backups.sh" \
            | tee "${result}"
          [[ "$(awk -F= '$1 == "RETENTION_APPLIED" {print $2}' "${result}")" == "true" ]]
          [[ "$(awk -F= '$1 == "RETENTION_COUNT" {print $2}' "${result}")" == "7" ]]
          echo "applied=true" >>"${GITHUB_OUTPUT}"

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Production MySQL backup"
            echo "- Backup: \`${{ steps.backup.outputs.name }}\`"
            echo "- SHA-256: \`${{ steps.backup.outputs.sha256 }}\`"
            echo "- Restore and migration rehearsal: \`${{ steps.backup.outputs.restore_verified }}\`"
            echo "- Primary immutable object: \`${{ steps.object_storage.outputs.primary_uri }}\`"
            echo "- Replica immutable object: \`${{ steps.object_storage.outputs.replica_uri }}\`"
            echo "- Local retention applied: \`${{ steps.retention.outputs.applied }}\`"
          } >>"${GITHUB_STEP_SUMMARY}"
