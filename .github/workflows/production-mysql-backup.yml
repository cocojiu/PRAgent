name: Production MySQL Backup

on:
  workflow_dispatch:
    inputs:
      verify_restore:
        description: Restore into an isolated temporary MySQL container and verify row counts
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-mysql-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted backup and isolated restore verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]* | "")
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Upload backup operation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -m 700 -d '${DEPLOY_PATH}/scripts' '/opt/repoguard/backups/mysql'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            scripts/backup-prod-mysql.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/backup-prod-mysql.sh"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/backup-prod-mysql.sh'"

      - name: Create encrypted backup and verify restore
        id: backup
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.REPOGUARD_BACKUP_ENCRYPTION_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          VERIFY_RESTORE: ${{ inputs.verify_restore }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_ENCRYPTION_PASSWORD}" || {
            echo "Missing REPOGUARD_BACKUP_ENCRYPTION_PASSWORD secret." >&2
            exit 1
          }
          echo "::add-mask::${BACKUP_ENCRYPTION_PASSWORD}"

          case "${VERIFY_RESTORE}" in
            true | false)
              ;;
            *)
              echo "verify_restore must resolve to true or false." >&2
              exit 1
              ;;
          esac

          result_file="${RUNNER_TEMP}/production-mysql-backup-result.txt"
          printf '%s\n' "${BACKUP_ENCRYPTION_PASSWORD}" \
            | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "cd '${DEPLOY_PATH}' && \
                 BACKUP_ROOT='/opt/repoguard/backups/mysql' \
                 VERIFY_RESTORE='${VERIFY_RESTORE}' \
                 bash scripts/backup-prod-mysql.sh --password-stdin" \
            | tee "${result_file}"

          restore_verified="$(awk -F= '$1 == "RESTORE_VERIFIED" { print $2 }' "${result_file}")"
          expected_restore="${VERIFY_RESTORE}"
          if [[ "${expected_restore}" == "false" ]]; then
            expected_restore="skipped"
          fi
          [[ "${restore_verified}" == "${expected_restore}" ]] || {
            echo "Restore verification result was not the expected value." >&2
            exit 1
          }

      - name: Write sanitized backup summary
        if: always()
        shell: bash
        run: |
          result_file="${RUNNER_TEMP}/production-mysql-backup-result.txt"
          {
            echo "## Production MySQL backup"
            echo
            if [[ ! -s "${result_file}" ]]; then
              echo "The backup operation did not produce a sanitized result."
              exit 0
            fi

            while IFS='=' read -r key value; do
              case "${key}" in
                BACKUP_TIMESTAMP_UTC)
                  echo "- Timestamp (UTC): \`${value}\`"
                  ;;
                MYSQL_VERSION)
                  echo "- MySQL: \`${value}\`"
                  ;;
                DATABASE_NAME)
                  echo "- Database: \`${value}\`"
                  ;;
                TABLE_COUNT)
                  echo "- Tables: \`${value}\`"
                  ;;
                EXACT_ROW_COUNT)
                  echo "- Exact rows: \`${value}\`"
                  ;;
                SOURCE_SIZE_BYTES)
                  echo "- Source bytes: \`${value}\`"
                  ;;
                BACKUP_BYTES)
                  echo "- Encrypted backup bytes: \`${value}\`"
                  ;;
                BACKUP_PATH)
                  echo "- Server path: \`${value}\`"
                  ;;
                BACKUP_SHA256)
                  echo "- SHA-256: \`${value}\`"
                  ;;
                LOGICAL_DUMP_SHA256)
                  echo "- Logical dump SHA-256: \`${value}\`"
                  ;;
                KEY_FINGERPRINT)
                  echo "- Key fingerprint: \`${value}\`"
                  ;;
                LEGACY_PLAINTEXT_BACKUP_COUNT)
                  echo "- Legacy plaintext backups detected: \`${value}\`"
                  ;;
                RESTORE_VERIFIED)
                  echo "- Isolated restore verified: \`${value}\`"
                  ;;
              esac
            done <"${result_file}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify production health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            https://pragent.top/actuator/health)"
          status="$(jq -r '.status // empty' <<<"${health}")"
          [[ "${status}" == "UP" ]] || {
            echo "Production health is not UP after backup operation." >&2
            exit 1
          }
