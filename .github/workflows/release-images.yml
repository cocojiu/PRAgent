name: Release Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - ".github/workflows/production-observability*.yml"
      - "config/observability/**"
      - "docker-compose.observability.yml"
  # Production deployment is always an explicit manual opt-in. Pushes only
  # build and publish images; they never connect to the production host.
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      deploy_existing_tag:
        description: Approved manifest version for rollback; requires release_run_id
        required: false
        type: string
      release_run_id:
        description: Successful release run to reuse; omitted selects a verified build for this SHA
        required: false
        type: string
      deploy:
        description: Deploy to the configured server (manual opt-in; default off)
        required: false
        default: false
        type: boolean
      frontend_progress_stream:
        description: Build the opt-in SSE frontend variant; backend activation is separate
        required: false
        default: false
        type: boolean
      migrate_legacy_secret_files:
        description: Preserve active inline values in secret files before the first configtree deployment
        required: false
        default: false
        type: boolean
      initialize_missing_encryption_salt:
        description: Initialize the salt introduced after the currently deployed legacy release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  VITE_REVIEW_PROGRESS_STREAM: ${{ github.event_name == 'workflow_dispatch' && inputs.frontend_progress_stream == true && 'true' || 'false' }}
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY || vars.ALIYUN_REGISTRY }}
  ALIYUN_DEPLOY_REGISTRY: ${{ secrets.ALIYUN_DEPLOY_REGISTRY || vars.ALIYUN_DEPLOY_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || vars.ALIYUN_NAMESPACE }}
  ALIYUN_REPOSITORY: ${{ secrets.ALIYUN_REPOSITORY || vars.ALIYUN_REPOSITORY }}
  ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME || vars.ALIYUN_REGISTRY_USERNAME }}

jobs:
  resolve:
    name: Resolve verified release artifacts
    runs-on: ubuntu-latest
    outputs:
      reuse_run_id: ${{ steps.resolve.outputs.reuse_run_id }}
      manifest_kind: ${{ steps.resolve.outputs.manifest_kind }}
    steps:
      - name: Checkout release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select and verify reusable manifest
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID_INPUT: ${{ inputs.release_run_id }}
          DEPLOY_EXISTING_TAG: ${{ inputs.deploy_existing_tag }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: python3 scripts/release-manifest.py resolve --directory "$RUNNER_TEMP/reused-release"

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: resolve
    if: ${{ needs.resolve.outputs.reuse_run_id == '' }}
    outputs:
      image_version: ${{ steps.images.outputs.image_version }}
      backend_digest: ${{ steps.backend_image.outputs.digest }}
      frontend_digest: ${{ steps.frontend_image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan pushed Git range for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Repository governance guard
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests

      - name: Generate ephemeral validation secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/repoguard-compose-secrets"
          install -d -m 700 "${secret_dir}"
          write_secret() {
            setting="$1"
            filename="$2"
            value="$3"
            path="${secret_dir}/${filename}"
            printf '%s' "${value}" > "${path}"
            chmod 444 "${path}"
            echo "${setting}=${path}" >> "$GITHUB_ENV"
          }
          encryption_key="CI!1-$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 32)"
          auth_token_secret="$(openssl rand -hex 32)"
          admin_api_key="$(openssl rand -hex 32)"
          webhook_secret="$(openssl rand -hex 32)"
          for value in "${encryption_key}" "${encryption_salt}" "${auth_token_secret}" "${admin_api_key}" "${webhook_secret}"; do
            echo "::add-mask::${value}"
          done
          echo "REPOGUARD_SECURITY_ENCRYPTION_KEY=${encryption_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_SECURITY_ENCRYPTION_SALT=${encryption_salt}" >> "$GITHUB_ENV"
          echo "SMOKE_AUTH_TOKEN_SECRET=${auth_token_secret}" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_API_KEY=${admin_api_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_GITHUB_WEBHOOK_SECRET=${webhook_secret}" >> "$GITHUB_ENV"
          write_secret MYSQL_ROOT_PASSWORD_FILE mysql.root-password "$(openssl rand -hex 32)"
          write_secret MYSQL_PASSWORD_FILE spring.datasource.password "$(openssl rand -hex 32)"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE repoguard.security.encryption-key "${encryption_key}"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE repoguard.security.encryption-salt "${encryption_salt}"
          write_secret REPOGUARD_AUTH_TOKEN_SECRET_FILE repoguard.auth.token-secret "${auth_token_secret}"
          write_secret REPOGUARD_ADMIN_API_KEY_FILE app.security.admin-api-key.key "${admin_api_key}"
          write_secret REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE app.github.webhook.secret "${webhook_secret}"

      - name: Exercise legacy production secret migration
        shell: bash
        run: |
          set -euo pipefail
          migration_dir="${RUNNER_TEMP}/repoguard-secret-migration"
          install -d -m 700 "${migration_dir}"
          legacy_env="${migration_dir}/.env"
          state_dir="${migration_dir}/state"

          mysql_root_password="$(openssl rand -hex 32)"
          mysql_password="$(openssl rand -hex 32)"
          encryption_key="CI!1-$(openssl rand -hex 32)"
          auth_token_secret="$(openssl rand -hex 32)"
          admin_api_key="$(openssl rand -hex 32)"
          webhook_secret="$(openssl rand -hex 32)"
          for value in \
            "${mysql_root_password}" \
            "${mysql_password}" \
            "${encryption_key}" \
            "${auth_token_secret}" \
            "${admin_api_key}" \
            "${webhook_secret}"; do
            echo "::add-mask::${value}"
          done

          {
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "${mysql_root_password}"
            printf 'MYSQL_PASSWORD=%s\n' "${mysql_password}"
            printf 'REPOGUARD_SECURITY_ENCRYPTION_KEY=%s\n' "${encryption_key}"
            printf 'REPOGUARD_AUTH_TOKEN_SECRET=%s\n' "${auth_token_secret}"
            printf 'REPOGUARD_ADMIN_API_KEY=%s\n' "${admin_api_key}"
            printf 'REPOGUARD_GITHUB_WEBHOOK_SECRET=%s\n' "${webhook_secret}"
          } > "${legacy_env}"
          chmod 600 "${legacy_env}"

          if ENV_FILE="${legacy_env}" \
            DEPLOY_STATE_DIR="${state_dir}" \
            sh scripts/migrate-prod-secret-files.sh prepare \
              > "${migration_dir}/expected-failure.log" 2>&1; then
            echo "Missing encryption salt unexpectedly passed without explicit initialization." >&2
            exit 1
          fi
          grep -q \
            'Neither REPOGUARD_SECURITY_ENCRYPTION_SALT nor REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE is configured.' \
            "${migration_dir}/expected-failure.log"

          MYSQL_ROOT_PASSWORD=ambient-value-must-not-win \
            ENV_FILE="${legacy_env}" \
            DEPLOY_STATE_DIR="${state_dir}" \
            INITIALIZE_MISSING_ENCRYPTION_SALT=true \
            sh scripts/migrate-prod-secret-files.sh prepare

          assert_secret() {
            expected="$1"
            path="$2"
            test "$(stat -c '%a' "${path}")" = "444"
            printf '%s' "${expected}" | cmp - "${path}"
          }
          test "$(stat -c '%a' "${migration_dir}/secrets")" = "700"
          assert_secret "${mysql_root_password}" "${migration_dir}/secrets/mysql.root-password"
          assert_secret "${mysql_password}" "${migration_dir}/secrets/spring.datasource.password"
          assert_secret "${encryption_key}" "${migration_dir}/secrets/repoguard.security.encryption-key"
          generated_salt="$(cat "${migration_dir}/secrets/repoguard.security.encryption-salt")"
          echo "::add-mask::${generated_salt}"
          test "${#generated_salt}" = "64"
          printf '%s' "${generated_salt}" | grep -Eq '^[0-9a-f]{64}$'
          assert_secret "${generated_salt}" "${migration_dir}/secrets/repoguard.security.encryption-salt"
          assert_secret "${auth_token_secret}" "${migration_dir}/secrets/repoguard.auth.token-secret"
          assert_secret "${admin_api_key}" "${migration_dir}/secrets/app.security.admin-api-key.key"
          assert_secret "${webhook_secret}" "${migration_dir}/secrets/app.github.webhook.secret"
          grep -q '^MYSQL_ROOT_PASSWORD=' "${legacy_env}"
          grep -q '^MYSQL_ROOT_PASSWORD_FILE=./secrets/mysql.root-password$' "${legacy_env}"
          test -s "${state_dir}/secret-file-migration.pending"

          chmod 600 "${migration_dir}/secrets/"*
          ENV_FILE="${legacy_env}" \
            DEPLOY_STATE_DIR="${state_dir}" \
            INITIALIZE_MISSING_ENCRYPTION_SALT=true \
            sh scripts/migrate-prod-secret-files.sh prepare
          assert_secret "${mysql_root_password}" "${migration_dir}/secrets/mysql.root-password"
          assert_secret "${mysql_password}" "${migration_dir}/secrets/spring.datasource.password"
          assert_secret "${encryption_key}" "${migration_dir}/secrets/repoguard.security.encryption-key"
          assert_secret "${generated_salt}" "${migration_dir}/secrets/repoguard.security.encryption-salt"
          assert_secret "${auth_token_secret}" "${migration_dir}/secrets/repoguard.auth.token-secret"
          assert_secret "${admin_api_key}" "${migration_dir}/secrets/app.security.admin-api-key.key"
          assert_secret "${webhook_secret}" "${migration_dir}/secrets/app.github.webhook.secret"

          ENV_FILE="${legacy_env}" \
            DEPLOY_STATE_DIR="${state_dir}" \
            INITIALIZE_MISSING_ENCRYPTION_SALT=true \
            sh scripts/migrate-prod-secret-files.sh finalize
          ! grep -Eq '^(MYSQL_ROOT_PASSWORD|MYSQL_PASSWORD|REPOGUARD_SECURITY_ENCRYPTION_KEY|REPOGUARD_SECURITY_ENCRYPTION_SALT|REPOGUARD_AUTH_TOKEN_SECRET|REPOGUARD_ADMIN_API_KEY|REPOGUARD_GITHUB_WEBHOOK_SECRET)=' "${legacy_env}"
          grep -q '^REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE=./secrets/app.github.webhook.secret$' "${legacy_env}"
          test ! -e "${state_dir}/secret-file-migration.pending"

          ENV_FILE="${legacy_env}" \
            DEPLOY_STATE_DIR="${state_dir}" \
            sh scripts/migrate-prod-secret-files.sh finalize

      - name: Validate production Compose models
        shell: bash
        run: |
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml config --quiet
          REPOGUARD_RUNTIME_ROLE=api \
          REPOGUARD_DEPLOYMENT_MODE=split \
          docker compose --profile worker-split \
            --env-file .env.prod.example \
            -f docker-compose.prod.yml config --quiet
          SMOKE_BACKEND_IMAGE=repoguard/backend:validation \
          SMOKE_BACKEND_PORT=18081 \
          SMOKE_MYSQL_ROOT_PASSWORD=validation-root \
          SMOKE_MYSQL_PASSWORD=validation-db \
          SMOKE_RABBITMQ_PASSWORD=validation-rabbit \
          REPOGUARD_SECURITY_ENCRYPTION_KEY_ID=validation-001 \
            docker compose -f docker-compose.smoke.yml config --quiet
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml \
            -f docker-compose.metrics-bridge.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
          METRICS_REMOTE_WRITE_URL=https://metrics-validation.invalid/api/v1/write \
          METRICS_REMOTE_WRITE_USERNAME=validation \
          METRICS_REMOTE_WRITE_PASSWORD=validation \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              -f config/observability/docker-compose.metrics.yml \
              config --quiet

      - name: Exercise production deployment preflight
        shell: bash
        run: >-
          BACKEND_IMAGE=repoguard/backend:validation
          FRONTEND_IMAGE=repoguard/frontend:validation
          ENV_FILE=.env.prod.example
          PREFLIGHT_ONLY=true
          sh scripts/deploy-prod.sh

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build backend after PR quality
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/PRAgent-test' }}
        working-directory: repoguard-backend
        run: ./mvnw -B -DskipTests package

      - name: Verify and build backend
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/PRAgent-test') }}
        working-directory: repoguard-backend
        run: ./mvnw -B verify

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: repoguard-frontend/package-lock.json

      - name: Install and audit frontend dependencies
        working-directory: repoguard-frontend
        run: |
          # 使用 npm ci 的单次内置审计；audit-level 仍会让高危/严重漏洞返回非零。
          # 避免安装后再次调用已退役的 npm audit quick endpoint。
          npm ci --audit=true --audit-level=high --registry=https://registry.npmjs.org

      - name: Build frontend after PR quality
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/PRAgent-test' }}
        working-directory: repoguard-frontend
        run: npm run build

      - name: Verify and build frontend
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/PRAgent-test') }}
        working-directory: repoguard-frontend
        run: |
          npm run quality
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image names
        id: images
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          test -n "${ALIYUN_REGISTRY}" || { echo "Missing ALIYUN_REGISTRY secret or variable"; exit 1; }
          test -n "${ALIYUN_NAMESPACE}" || { echo "Missing ALIYUN_NAMESPACE secret or variable"; exit 1; }
          test -n "${ALIYUN_REPOSITORY}" || { echo "Missing ALIYUN_REPOSITORY secret or variable"; exit 1; }
          test -n "${ALIYUN_REGISTRY_USERNAME}" || { echo "Missing ALIYUN_REGISTRY_USERNAME secret or variable"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            image_tag="${IMAGE_TAG_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            ref_slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
            image_tag="${ref_slug}-${GITHUB_SHA::12}"
          fi
          if [ "${VITE_REVIEW_PROGRESS_STREAM}" = "true" ] && [[ "${image_tag}" != *-sse ]]; then
            image_tag="${image_tag}-sse"
          fi
          if [ "${VITE_REVIEW_PROGRESS_STREAM}" != "true" ] && [[ "${image_tag}" == *-sse ]]; then
            echo "The -sse variant tag requires frontend_progress_stream=true"; exit 1
          fi
          test "${#image_tag}" -le 128 || { echo "Variant image tag exceeds 128 characters"; exit 1; }
          test -n "${image_tag}" || { echo "Missing resolved image tag"; exit 1; }
          backend_image="${REGISTRY}/${owner}/${repo}-backend:${image_tag}"
          frontend_image="${REGISTRY}/${owner}/${repo}-frontend:${image_tag}"
          aliyun_backend_image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:backend-${image_tag}"
          aliyun_frontend_image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:frontend-${image_tag}"
          echo "BACKEND_IMAGE=${backend_image}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "$GITHUB_ENV"
          echo "ALIYUN_BACKEND_IMAGE=${aliyun_backend_image}" >> "$GITHUB_ENV"
          echo "ALIYUN_FRONTEND_IMAGE=${aliyun_frontend_image}" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${image_tag}" >> "$GITHUB_ENV"
          echo "image_version=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image to GHCR
        id: backend_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: repoguard-backend
          file: repoguard-backend/Dockerfile
          push: true
          # Images are mirrored to Aliyun ACR only after the GHCR image passes release checks.
          # Keep the mirrored manifest compatible with Aliyun ACR; attestations are stored in GitHub.
          sbom: false
          provenance: false
          build-args: |
            OCI_VERSION=${{ env.IMAGE_VERSION }}
            OCI_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Generate backend SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.BACKEND_IMAGE }}@${{ steps.backend_image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/backend-sbom.spdx.json
          artifact-name: backend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          upload-artifact: true
          upload-release-assets: false

      - name: Attest backend build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend_image.outputs.digest }}

      - name: Attest backend SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.backend_image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/backend-sbom.spdx.json

      - name: Verify non-root backend secret mount access
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh \
            --mount "type=bind,src=${MYSQL_PASSWORD_FILE},dst=/run/secrets/spring.datasource.password,readonly" \
            --mount "type=bind,src=${REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE},dst=/run/secrets/repoguard.security.encryption-key,readonly" \
            --mount "type=bind,src=${REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE},dst=/run/secrets/repoguard.security.encryption-salt,readonly" \
            --mount "type=bind,src=${REPOGUARD_AUTH_TOKEN_SECRET_FILE},dst=/run/secrets/repoguard.auth.token-secret,readonly" \
            --mount "type=bind,src=${REPOGUARD_ADMIN_API_KEY_FILE},dst=/run/secrets/app.security.admin-api-key.key,readonly" \
            --mount "type=bind,src=${REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE},dst=/run/secrets/app.github.webhook.secret,readonly" \
            "${BACKEND_IMAGE}@${{ steps.backend_image.outputs.digest }}" \
            -ec '
              test "$(id -u)" != "0"
              for secret_path in /run/secrets/*; do
                test -r "${secret_path}"
                test -s "${secret_path}"
              done
            '

      - name: Build and push frontend image to GHCR
        id: frontend_image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: repoguard-frontend
          file: repoguard-frontend/Dockerfile
          push: true
          # Images are mirrored to Aliyun ACR only after the GHCR image passes release checks.
          # Keep the mirrored manifest compatible with Aliyun ACR; attestations are stored in GitHub.
          sbom: false
          provenance: false
          cache-from: type=gha,scope=frontend
          # Bind the compiled frontend option to the immutable image config.
          # It is also checked before signing the reusable source manifest.
          build-args: |
            OCI_VERSION=${{ env.IMAGE_VERSION }}
            OCI_REVISION=${{ github.sha }}
            REVIEW_PROGRESS_STREAM=${{ env.VITE_REVIEW_PROGRESS_STREAM }}
          cache-to: type=gha,scope=frontend,mode=max
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Generate frontend SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.FRONTEND_IMAGE }}@${{ steps.frontend_image.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/frontend-sbom.spdx.json
          artifact-name: frontend-sbom-${{ github.run_id }}-${{ github.run_attempt }}
          upload-artifact: true
          upload-release-assets: false

      - name: Attest frontend build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend_image.outputs.digest }}

      - name: Attest frontend SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.FRONTEND_IMAGE }}
          subject-digest: ${{ steps.frontend_image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/frontend-sbom.spdx.json

      - name: Verify production frontend runtime health
        shell: bash
        run: |
          set -euo pipefail
          container="repoguard-frontend-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="${FRONTEND_IMAGE}@${{ steps.frontend_image.outputs.digest }}"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs "$container" || true
              docker inspect "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run -d --name "$container" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m,mode=1777 \
            --add-host backend:127.0.0.1 \
            "$image" >/dev/null
          test "$(docker exec "$container" id -u)" != "0"

          for attempt in $(seq 1 30); do
            if docker exec "$container" sh -ec \
              "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'"; then
              exit 0
            fi
            if [ "$(docker inspect "$container" --format '{{.State.Running}}')" != "true" ]; then
              echo "Frontend runtime container exited before becoming healthy." >&2
              exit 1
            fi
            sleep 1
          done
          echo "Frontend runtime health check failed." >&2
          exit 1

      - name: Scan backend image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ${{ env.BACKEND_IMAGE }}@${{ steps.backend_image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan frontend image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: ${{ env.FRONTEND_IMAGE }}@${{ steps.frontend_image.outputs.digest }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Bind checked source images to release manifest
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.digest }}
        run: python3 scripts/release-manifest.py create-source --output "$RUNNER_TEMP/release-source-manifest.json"

      - name: Attest checked release manifest
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-source-manifest.json

      - name: Preserve verified source manifest
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-source-manifest.json
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Deploy to production (manual opt-in)
    runs-on: ubuntu-latest
    needs: [resolve, build]
    # Keep this guard fail-closed: no push event, test branch, or omitted input
    # can reach the production host. A maintainer must explicitly set deploy=true
    # from a protected main/master branch or v* tag.
    if: ${{ always() && needs.resolve.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.deploy == true && (github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/v')) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.resolve.outputs.reuse_run_id != '')) }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment: production
    steps:
      - name: Checkout compose file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load verified release manifest before touching production
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ needs.resolve.outputs.reuse_run_id }}
          MANIFEST_KIND: ${{ needs.resolve.outputs.manifest_kind }}
          DEPLOY_EXISTING_TAG: ${{ inputs.deploy_existing_tag }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          source_run_id="${REUSE_RUN_ID:-$GITHUB_RUN_ID}"
          kind="${MANIFEST_KIND:-source}"
          python3 scripts/release-manifest.py fetch --run-id "$source_run_id" --kind "$kind" \
            --tag "$DEPLOY_EXISTING_TAG" --directory "$RUNNER_TEMP/release"
          if [ "$kind" = source ]; then
            manifest="$RUNNER_TEMP/release/release-source-manifest.json"
          else
            manifest="$RUNNER_TEMP/release/release-manifest.json"
          fi
          echo "RELEASE_MANIFEST_KIND=$kind" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$(jq -r .version "$manifest")" >> "$GITHUB_ENV"
          for role in backend frontend; do
            prefix="${role^^}"
            echo "SOURCE_${prefix}_DIGEST=$(jq -r ".images.$role.source.digest" "$manifest")" >> "$GITHUB_ENV"
            echo "SOURCE_${prefix}_IMAGE=$(jq -r ".images.$role.source.repository" "$manifest")@$(jq -r ".images.$role.source.digest" "$manifest")" >> "$GITHUB_ENV"
          done

      - name: Prepare SSH key
        uses: ./.github/actions/bootstrap-production-ssh
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          deploy-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Upload deployment and smoke assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          test -s config/rabbitmq/rabbitmq.conf || { echo "Missing RabbitMQ deployment config"; exit 1; }
          test -s docker-compose.metrics-bridge.yml || { echo "Missing metrics bridge overlay"; exit 1; }
          test -s scripts/migrate-prod-secret-files.sh || { echo "Missing production secret migration script"; exit 1; }
          ssh_args=(
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -i ~/.ssh/deploy_key
            -p "${DEPLOY_PORT:-22}"
          )
          scp_args=(
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=20
            -i ~/.ssh/deploy_key
            -P "${DEPLOY_PORT:-22}"
          )
          run_remote() {
            timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "$@"
          }
          run_transfer() {
            timeout --signal=TERM --kill-after=10s 120s scp "${scp_args[@]}" "$@"
          }
          echo "每个生产资产 SSH/SCP 操作最长 120 秒，失败将终止本次部署并保留远程回滚资产。"
          asset_backup_dir="${DEPLOY_PATH}/.deploy-backup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_remote "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu
             mkdir -p '${DEPLOY_PATH}/scripts' \
                      '${DEPLOY_PATH}/performance/remote' \
                      '${DEPLOY_PATH}/config/rabbitmq' \
                      '${asset_backup_dir}/config/rabbitmq'
             if [ -f '${DEPLOY_PATH}/docker-compose.prod.yml' ]; then
               cp -p '${DEPLOY_PATH}/docker-compose.prod.yml' '${asset_backup_dir}/docker-compose.prod.yml'
             fi
             if [ -f '${DEPLOY_PATH}/docker-compose.metrics-bridge.yml' ]; then
               cp -p '${DEPLOY_PATH}/docker-compose.metrics-bridge.yml' \
                     '${asset_backup_dir}/docker-compose.metrics-bridge.yml'
             fi
             if [ -f '${DEPLOY_PATH}/Caddyfile' ]; then
               cp -p '${DEPLOY_PATH}/Caddyfile' '${asset_backup_dir}/Caddyfile'
             fi
             if [ -f '${DEPLOY_PATH}/config/rabbitmq/rabbitmq.conf' ]; then
               cp -p '${DEPLOY_PATH}/config/rabbitmq/rabbitmq.conf' \
                     '${asset_backup_dir}/config/rabbitmq/rabbitmq.conf'
             fi"
          echo "DEPLOY_ASSET_BACKUP_DIR=.deploy-backup/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          # Upload bind sources before the compose file that references them.
          run_transfer config/rabbitmq/rabbitmq.conf "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/config/rabbitmq/rabbitmq.conf"
          run_transfer docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"
          run_transfer docker-compose.metrics-bridge.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.metrics-bridge.yml"
          run_transfer docker-compose.smoke.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.smoke.yml"
          run_transfer Caddyfile "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/Caddyfile"
          run_transfer scripts/deploy-prod.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/deploy-prod.sh"
          run_transfer scripts/release-manifest.py "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/release-manifest.py"
          run_transfer scripts/migrate-prod-secret-files.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/migrate-prod-secret-files.sh"
          run_transfer \
            performance/remote/run-isolated-real-chain-smoke.sh \
            performance/remote/run-real-chain-smoke.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/performance/remote/"
          run_remote "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/migrate-prod-secret-files.sh' \
                        '${DEPLOY_PATH}/performance/remote/run-isolated-real-chain-smoke.sh' \
                        '${DEPLOY_PATH}/performance/remote/run-real-chain-smoke.sh'"

      - name: Mirror checked images to Aliyun ACR over VPC
        if: ${{ env.RELEASE_MANIFEST_KIND == 'source' }}
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACR_TOKEN: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ACR_REGISTRY: ${{ env.ALIYUN_DEPLOY_REGISTRY }}
          ACR_USER: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          BACKEND_DIGEST: ${{ env.SOURCE_BACKEND_DIGEST }}
          FRONTEND_DIGEST: ${{ env.SOURCE_FRONTEND_DIGEST }}
          BACKEND_TARGET: ${{ env.ALIYUN_DEPLOY_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPOSITORY }}:backend-${{ env.RELEASE_VERSION }}
          FRONTEND_TARGET: ${{ env.ALIYUN_DEPLOY_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPOSITORY }}:frontend-${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          test -n "$GHCR_TOKEN" && test -n "$ACR_TOKEN"
          [[ "$BACKEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          BACKEND_SOURCE="${SOURCE_BACKEND_IMAGE}"
          FRONTEND_SOURCE="${SOURCE_FRONTEND_IMAGE}"
          backend_transfer="pragent-backend-transfer:${BACKEND_DIGEST#sha256:}"
          frontend_transfer="pragent-frontend-transfer:${FRONTEND_DIGEST#sha256:}"
          remote="${DEPLOY_USER}@${DEPLOY_HOST}"
          ssh_args=(-o ServerAliveInterval=15 -o ServerAliveCountMax=80 -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}")
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          transfer_dir="${RUNNER_TEMP}/repoguard-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote_dir="/tmp/repoguard-images-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            timeout 30s ssh "${ssh_args[@]}" "$remote" \
              "rm -f -- '${remote_dir}'/part-* '${remote_dir}/inspections.json'; rmdir -- '${remote_dir}'" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          timeout 600s docker pull "$BACKEND_SOURCE"
          timeout 600s docker pull "$FRONTEND_SOURCE"
          docker tag "$BACKEND_SOURCE" "$backend_transfer"
          docker tag "$FRONTEND_SOURCE" "$frontend_transfer"
          printf '%s' "$ACR_TOKEN" | ssh "${ssh_args[@]}" "$remote" \
            "docker login '${ACR_REGISTRY}' -u '${ACR_USER}' --password-stdin"
          # Divide the exact scanned images into small, checksummed chunks so
          # parallel SSH connections can overcome slow cross-region transfers.
          install -d -m 700 "$transfer_dir"
          archive="${transfer_dir}/images.tar.gz"
          timeout 600s docker save "$backend_transfer" "$frontend_transfer" | gzip -1 > "$archive"
          archive_sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          split -b 8m -d -a 5 "$archive" "${transfer_dir}/part-"
          ssh "${ssh_args[@]}" "$remote" "install -d -m 700 '${remote_dir}'"
          upload_chunk() {
            local part="$1"
            for attempt in 1 2 3; do
              timeout 600s scp -q -o ConnectTimeout=15 -o ConnectionAttempts=1 \
                -o ServerAliveInterval=15 -o ServerAliveCountMax=80 \
                -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
                "$part" "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_dir}/$(basename "$part")" && return 0
              sleep "$attempt"
            done
            return 1
          }
          export -f upload_chunk
          export DEPLOY_PORT DEPLOY_USER DEPLOY_HOST remote_dir
          find "$transfer_dir" -maxdepth 1 -type f -name 'part-*' -print0 | \
            xargs -0 -r -n1 -P8 bash -c 'upload_chunk "$1"' _
          remote_sha="$(ssh "${ssh_args[@]}" "$remote" \
            "cat '${remote_dir}'/part-* | sha256sum | cut -d' ' -f1")"
          test "$remote_sha" = "$archive_sha"
          timeout 600s ssh "${ssh_args[@]}" "$remote" \
            "bash -o pipefail -c \"cat '${remote_dir}'/part-* | gzip -dc | docker load\""
          ssh "${ssh_args[@]}" "$remote" "
            set -e
            docker tag '${backend_transfer}' '${BACKEND_TARGET}'
            docker tag '${frontend_transfer}' '${FRONTEND_TARGET}'
            test \"\$(docker image inspect --format '{{.Id}}' '${backend_transfer}')\" = \"\$(docker image inspect --format '{{.Id}}' '${BACKEND_TARGET}')\"
            test \"\$(docker image inspect --format '{{.Id}}' '${frontend_transfer}')\" = \"\$(docker image inspect --format '{{.Id}}' '${FRONTEND_TARGET}')\"
            timeout 600s docker push '${BACKEND_TARGET}'
            timeout 600s docker push '${FRONTEND_TARGET}'
            docker manifest inspect '${BACKEND_TARGET}' >/dev/null
            docker manifest inspect '${FRONTEND_TARGET}' >/dev/null
            docker image rm '${backend_transfer}' '${frontend_transfer}' >/dev/null
          "
          # Re-read the actual target platform objects after promotion. Target
          # manifest digests may differ from GHCR; their config digests must match.
          ssh "${ssh_args[@]}" "$remote" "
            set -e
            docker pull '${BACKEND_TARGET}' >/dev/null
            docker pull '${FRONTEND_TARGET}' >/dev/null
            python3 '${DEPLOY_PATH}/scripts/release-manifest.py' inspect-images \
              --output '${remote_dir}/inspections.json' '${BACKEND_TARGET}' '${FRONTEND_TARGET}'
            cat '${remote_dir}/inspections.json'
          " > "$RUNNER_TEMP/promoted-images.json"

      - name: Bind immutable target deployment identities
        shell: bash
        run: |
          set -euo pipefail
          target_repository="${ALIYUN_DEPLOY_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}"
          manifest="$RUNNER_TEMP/release/release-manifest.json"
          if [ "$RELEASE_MANIFEST_KIND" = source ]; then
            python3 scripts/release-manifest.py promote --source "$RUNNER_TEMP/release/release-source-manifest.json" \
              --inspections "$RUNNER_TEMP/promoted-images.json" --target-repository "$target_repository" --output "$manifest"
          fi
          manifest_sha="$(sha256sum "$manifest" | cut -d' ' -f1)"
          approval_run_id="$(jq -r .approval.runId "$manifest")"
          python3 scripts/release-manifest.py deployment-env --manifest "$manifest" --sha256 "$manifest_sha" \
            --target-repository "$target_repository" --approval-run-id "$approval_run_id" > "$RUNNER_TEMP/release-identities.env"
          . "$RUNNER_TEMP/release-identities.env"
          echo "RELEASE_BACKEND_IMAGE=$BACKEND_IMAGE" >> "$GITHUB_ENV"
          echo "RELEASE_FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$GITHUB_ENV"
          echo "RELEASE_MANIFEST_SHA256=$manifest_sha" >> "$GITHUB_ENV"
          echo "RELEASE_APPROVAL_RUN_ID=$approval_run_id" >> "$GITHUB_ENV"

      - name: Attest approved target manifest
        if: ${{ env.RELEASE_MANIFEST_KIND == 'source' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/release-manifest.json

      - name: Preserve approved target manifest
        if: ${{ env.RELEASE_MANIFEST_KIND == 'source' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-release-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Pull and restart
        shell: bash
        env:
          ALIYUN_DEPLOY_REGISTRY: ${{ env.ALIYUN_DEPLOY_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ env.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ env.ALIYUN_REPOSITORY }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ALIYUN_REGISTRY_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS || vars.APP_CORS_ALLOWED_ORIGINS }}
          HEALTH_URL: ${{ secrets.HEALTH_URL || vars.HEALTH_URL }}
          MIGRATE_LEGACY_SECRET_FILES: ${{ inputs.migrate_legacy_secret_files }}
          INITIALIZE_MISSING_ENCRYPTION_SALT: ${{ inputs.initialize_missing_encryption_salt }}
          REPOGUARD_FRONTEND_SERVER_NAME: ${{ secrets.REPOGUARD_FRONTEND_SERVER_NAME || vars.REPOGUARD_FRONTEND_SERVER_NAME }}
        run: |
          test -n "${ALIYUN_REGISTRY_PASSWORD}" || { echo "Missing ALIYUN_REGISTRY_PASSWORD secret"; exit 1; }
          test -n "${ALIYUN_DEPLOY_REGISTRY}" || { echo "Missing ALIYUN_DEPLOY_REGISTRY secret or variable"; exit 1; }
          test -n "${ALIYUN_NAMESPACE}" || { echo "Missing ALIYUN_NAMESPACE secret or variable"; exit 1; }
          test -n "${ALIYUN_REPOSITORY}" || { echo "Missing ALIYUN_REPOSITORY secret or variable"; exit 1; }
          test -n "${ALIYUN_REGISTRY_USERNAME}" || { echo "Missing ALIYUN_REGISTRY_USERNAME secret or variable"; exit 1; }
          test -n "${REPOGUARD_FRONTEND_SERVER_NAME}" || { echo "Missing REPOGUARD_FRONTEND_SERVER_NAME secret or variable"; exit 1; }
          test -n "${APP_CORS_ALLOWED_ORIGINS}" || { echo "Missing APP_CORS_ALLOWED_ORIGINS secret or variable"; exit 1; }
          backend_image="${RELEASE_BACKEND_IMAGE}"
          frontend_image="${RELEASE_FRONTEND_IMAGE}"
          health_url="${HEALTH_URL:-http://127.0.0.1/healthz}"
          health_url="${health_url%%,*}"
          health_url="${health_url%% *}"
          test -n "${health_url}" || { echo "HEALTH_URL resolved to an empty value"; exit 1; }
          release_manifest=".deploy-state/release-manifest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          ssh_args=(-o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1
            -o ServerAliveInterval=15 -o ServerAliveCountMax=80
            -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}")
          timeout --signal=TERM --kill-after=10s 120s ssh "${ssh_args[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p '${DEPLOY_PATH}/.deploy-state'"
          timeout --signal=TERM --kill-after=10s 120s scp -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" "$RUNNER_TEMP/release/release-manifest.json" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/${release_manifest}"
          printf '%s' "${ALIYUN_REGISTRY_PASSWORD}" | timeout --signal=TERM --kill-after=10s 120s \
            ssh "${ssh_args[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login '${ALIYUN_DEPLOY_REGISTRY}' -u '${ALIYUN_REGISTRY_USERNAME}' --password-stdin"
          ssh "${ssh_args[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             BACKEND_IMAGE='${backend_image}' \
             FRONTEND_IMAGE='${frontend_image}' \
             RELEASE_MANIFEST='${release_manifest}' \
             RELEASE_MANIFEST_SHA256='${RELEASE_MANIFEST_SHA256}' \
             RELEASE_APPROVAL_RUN_ID='${RELEASE_APPROVAL_RUN_ID}' \
             RELEASE_TARGET_REPOSITORY='${ALIYUN_DEPLOY_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}' \
             REPOGUARD_FRONTEND_SERVER_NAME='${REPOGUARD_FRONTEND_SERVER_NAME}' \
             APP_CORS_ALLOWED_ORIGINS='${APP_CORS_ALLOWED_ORIGINS}' \
             HEALTH_URL='${health_url}' \
             DEPLOY_ASSET_BACKUP_DIR='${DEPLOY_ASSET_BACKUP_DIR}' \
             MIGRATE_LEGACY_SECRET_FILES='${MIGRATE_LEGACY_SECRET_FILES}' \
             INITIALIZE_MISSING_ENCRYPTION_SALT='${INITIALIZE_MISSING_ENCRYPTION_SALT}' \
             sh scripts/deploy-prod.sh"
