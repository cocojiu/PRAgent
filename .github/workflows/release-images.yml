name: Release Images

on:
  push:
    branches:
      - main
      - master
      - PRAgent-test
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      deploy_existing_tag:
        description: Existing image tag to deploy without rebuilding, for rollback
        required: false
        type: string
      deploy:
        description: Deploy to the configured server after pushing images
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY || vars.ALIYUN_REGISTRY }}
  ALIYUN_DEPLOY_REGISTRY: ${{ secrets.ALIYUN_DEPLOY_REGISTRY || vars.ALIYUN_DEPLOY_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE || vars.ALIYUN_NAMESPACE }}
  ALIYUN_REPOSITORY: ${{ secrets.ALIYUN_REPOSITORY || vars.ALIYUN_REPOSITORY }}
  ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME || vars.ALIYUN_REGISTRY_USERNAME }}
  PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR || 'false' }}

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deploy_existing_tag != '') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: maven

      - name: Build backend
        working-directory: repoguard-backend
        run: mvn -B package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: repoguard-frontend/package-lock.json

      - name: Build frontend
        working-directory: repoguard-frontend
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image names
        id: images
        shell: bash
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          test -n "${ALIYUN_REGISTRY}" || { echo "Missing ALIYUN_REGISTRY secret or variable"; exit 1; }
          test -n "${ALIYUN_NAMESPACE}" || { echo "Missing ALIYUN_NAMESPACE secret or variable"; exit 1; }
          test -n "${ALIYUN_REPOSITORY}" || { echo "Missing ALIYUN_REPOSITORY secret or variable"; exit 1; }
          test -n "${ALIYUN_REGISTRY_USERNAME}" || { echo "Missing ALIYUN_REGISTRY_USERNAME secret or variable"; exit 1; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          if [ -n "${IMAGE_TAG_INPUT}" ]; then
            image_tag="${IMAGE_TAG_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            ref_slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
            image_tag="${ref_slug}-${GITHUB_SHA::12}"
          fi
          test -n "${image_tag}" || { echo "Missing resolved image tag"; exit 1; }
          backend_image="${REGISTRY}/${owner}/${repo}-backend:${image_tag}"
          frontend_image="${REGISTRY}/${owner}/${repo}-frontend:${image_tag}"
          aliyun_backend_image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:backend-${image_tag}"
          aliyun_frontend_image="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:frontend-${image_tag}"
          echo "BACKEND_IMAGE=${backend_image}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${frontend_image}" >> "$GITHUB_ENV"
          echo "ALIYUN_BACKEND_IMAGE=${aliyun_backend_image}" >> "$GITHUB_ENV"
          echo "ALIYUN_FRONTEND_IMAGE=${aliyun_frontend_image}" >> "$GITHUB_ENV"
          {
            echo "BACKEND_IMAGE_TAGS<<EOF"
            if [ "${PUBLISH_GHCR}" = "true" ]; then
              echo "${backend_image}"
            fi
            echo "${aliyun_backend_image}"
            echo "EOF"
            echo "FRONTEND_IMAGE_TAGS<<EOF"
            if [ "${PUBLISH_GHCR}" = "true" ]; then
              echo "${frontend_image}"
            fi
            echo "${aliyun_frontend_image}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: ${{ env.PUBLISH_GHCR == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: repoguard-backend
          file: repoguard-backend/Dockerfile
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          tags: ${{ env.BACKEND_IMAGE_TAGS }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: repoguard-frontend
          file: repoguard-frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          tags: ${{ env.FRONTEND_IMAGE_TAGS }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.deploy && (github.ref_name == 'main' || github.ref_name == 'master' || startsWith(github.ref, 'refs/tags/v')) && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment: production
    steps:
      - name: Checkout compose file
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]*)
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key for deployment target..."
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying after $((attempt * 10)) seconds..." >&2
            sed 's/^/ssh-keyscan: /' ssh-keyscan.err >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Upload compose file
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}/scripts'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" docker-compose.prod.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" Caddyfile "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/Caddyfile"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" scripts/deploy-prod.sh "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/deploy-prod.sh"

      - name: Pull and restart
        shell: bash
        env:
          ALIYUN_DEPLOY_REGISTRY: ${{ env.ALIYUN_DEPLOY_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ env.ALIYUN_NAMESPACE }}
          ALIYUN_REPOSITORY: ${{ env.ALIYUN_REPOSITORY }}
          ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
          ALIYUN_REGISTRY_USERNAME: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          DEPLOY_EXISTING_TAG: ${{ inputs.deploy_existing_tag }}
          APP_CORS_ALLOWED_ORIGINS: ${{ secrets.APP_CORS_ALLOWED_ORIGINS || vars.APP_CORS_ALLOWED_ORIGINS }}
          HEALTH_URL: ${{ secrets.HEALTH_URL || vars.HEALTH_URL }}
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REPOGUARD_FRONTEND_SERVER_NAME: ${{ secrets.REPOGUARD_FRONTEND_SERVER_NAME || vars.REPOGUARD_FRONTEND_SERVER_NAME }}
        run: |
          test -n "${ALIYUN_REGISTRY_PASSWORD}" || { echo "Missing ALIYUN_REGISTRY_PASSWORD secret"; exit 1; }
          test -n "${ALIYUN_DEPLOY_REGISTRY}" || { echo "Missing ALIYUN_DEPLOY_REGISTRY secret or variable"; exit 1; }
          test -n "${ALIYUN_NAMESPACE}" || { echo "Missing ALIYUN_NAMESPACE secret or variable"; exit 1; }
          test -n "${ALIYUN_REPOSITORY}" || { echo "Missing ALIYUN_REPOSITORY secret or variable"; exit 1; }
          test -n "${ALIYUN_REGISTRY_USERNAME}" || { echo "Missing ALIYUN_REGISTRY_USERNAME secret or variable"; exit 1; }
          if [ -n "${DEPLOY_EXISTING_TAG}" ]; then
            image_tag="${DEPLOY_EXISTING_TAG}"
          elif [ -n "${IMAGE_TAG_INPUT}" ]; then
            image_tag="${IMAGE_TAG_INPUT}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            image_tag="${GITHUB_REF_NAME}"
          else
            ref_slug="$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+|-+$//g')"
            image_tag="${ref_slug}-${GITHUB_SHA::12}"
          fi
          test -n "${image_tag}" || { echo "Missing resolved image tag"; exit 1; }
          test -n "${REPOGUARD_FRONTEND_SERVER_NAME}" || { echo "Missing REPOGUARD_FRONTEND_SERVER_NAME secret or variable"; exit 1; }
          test -n "${APP_CORS_ALLOWED_ORIGINS}" || { echo "Missing APP_CORS_ALLOWED_ORIGINS secret or variable"; exit 1; }
          backend_image="${ALIYUN_DEPLOY_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:backend-${image_tag}"
          frontend_image="${ALIYUN_DEPLOY_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}:frontend-${image_tag}"
          health_url="${HEALTH_URL:-http://127.0.0.1/actuator/health}"
          health_url="${health_url%%,*}"
          health_url="${health_url%% *}"
          test -n "${health_url}" || { echo "HEALTH_URL resolved to an empty value"; exit 1; }
          printf '%s' "${ALIYUN_REGISTRY_PASSWORD}" | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker login '${ALIYUN_DEPLOY_REGISTRY}' -u '${ALIYUN_REGISTRY_USERNAME}' --password-stdin"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             BACKEND_IMAGE='${backend_image}' \
             FRONTEND_IMAGE='${frontend_image}' \
             REPOGUARD_FRONTEND_SERVER_NAME='${REPOGUARD_FRONTEND_SERVER_NAME}' \
             APP_CORS_ALLOWED_ORIGINS='${APP_CORS_ALLOWED_ORIGINS}' \
             HEALTH_URL='${health_url}' \
             sh scripts/deploy-prod.sh"
