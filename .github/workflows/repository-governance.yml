name: Repository Governance

on:
  pull_request:
    branches:
      - main
      - master
      - PRAgent-test
  push:
    branches:
      - main
      - master
      - PRAgent-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Tracked file governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run repository governance checks
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests
