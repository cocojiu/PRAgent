name: Repository Governance

on:
  pull_request:
    branches:
      - main
      - master
      - PRAgent-test
  push:
    branches:
      - main
      - master
      - PRAgent-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Tracked file governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run repository governance checks
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests
