name: Repository Governance

on:
  push:
    branches:
      - main
      - master
      - PRAgent-test
  workflow_dispatch:
    inputs:
      linux_quality:
        description: Run the existing Linux quality suite on this ref without creating a PR or deploying
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Tracked file governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository governance checks
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests

  linux-quality:
    name: Isolated Linux quality
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_quality == true }}
    needs: guard
    uses: ./.github/workflows/pr-quality.yml
