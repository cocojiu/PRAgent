name: Production MySQL Legacy Backup Cleanup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_4_VERIFIED_PLAINTEXT_SQL_FILES to delete the confirmed files
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-mysql-backup
  cancel-in-progress: false

jobs:
  delete-legacy-plaintext:
    name: Delete four confirmed plaintext SQL backups
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]* | "")
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Upload verified cleanup operation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -m 700 -d '${DEPLOY_PATH}/scripts'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            scripts/delete-verified-legacy-mysql-backups.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/delete-verified-legacy-mysql-backups.sh"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/delete-verified-legacy-mysql-backups.sh'"

      - name: Verify encrypted copies and delete confirmed plaintext
        id: cleanup
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.REPOGUARD_BACKUP_ENCRYPTION_PASSWORD }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          expected_confirmation="DELETE_4_VERIFIED_PLAINTEXT_SQL_FILES"
          [[ "${CONFIRMATION}" == "${expected_confirmation}" ]] || {
            echo "The cleanup confirmation text did not match." >&2
            exit 1
          }
          test -n "${BACKUP_ENCRYPTION_PASSWORD}" || {
            echo "Missing REPOGUARD_BACKUP_ENCRYPTION_PASSWORD secret." >&2
            exit 1
          }
          echo "::add-mask::${BACKUP_ENCRYPTION_PASSWORD}"

          result_file="${RUNNER_TEMP}/legacy-mysql-cleanup-result.txt"
          printf '%s\n' "${BACKUP_ENCRYPTION_PASSWORD}" \
            | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                "cd '${DEPLOY_PATH}' && \
                 DELETE_CONFIRMATION='DELETE_4_VERIFIED_PLAINTEXT_SQL_FILES' \
                 bash scripts/delete-verified-legacy-mysql-backups.sh --password-stdin" \
            | tee "${result_file}"

          operation="$(awk -F= '$1 == "OPERATION" { print $2 }' "${result_file}")"
          before_count="$(awk -F= '$1 == "LEGACY_BACKUP_COUNT_BEFORE" { print $2 }' "${result_file}")"
          empty_count="$(awk -F= '$1 == "EMPTY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          nonempty_count="$(awk -F= '$1 == "NONEMPTY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          manifest_sha256="$(awk -F= '$1 == "CONFIRMED_MANIFEST_SHA256" { print $2 }' "${result_file}")"
          verified_count="$(awk -F= '$1 == "ROUNDTRIP_VERIFIED_COUNT" { print $2 }' "${result_file}")"
          predelete_verified="$(awk -F= '$1 == "PREDELETE_VERIFIED" { print $2 }' "${result_file}")"
          deleted_count="$(awk -F= '$1 == "DELETED_BACKUP_COUNT" { print $2 }' "${result_file}")"
          remaining_count="$(awk -F= '$1 == "REMAINING_PLAINTEXT_BACKUP_COUNT" { print $2 }' "${result_file}")"
          plaintext_deleted="$(awk -F= '$1 == "PLAINTEXT_DELETED" { print $2 }' "${result_file}")"

          [[ "${operation}" == "delete" \
            && "${before_count}" == "4" \
            && "${empty_count}" == "2" \
            && "${nonempty_count}" == "2" \
            && "${manifest_sha256}" == "a14872adbd19c7d9e37ae58aa04c2704e693161d74ad14c7c9f30a0d1936e278" \
            && "${verified_count}" == "2" \
            && "${predelete_verified}" == "true" \
            && "${deleted_count}" == "4" \
            && "${remaining_count}" == "0" \
            && "${plaintext_deleted}" == "true" ]] || {
            echo "The verified cleanup result did not satisfy every invariant." >&2
            exit 1
          }

      - name: Write sanitized cleanup summary
        if: always()
        shell: bash
        run: |
          result_file="${RUNNER_TEMP}/legacy-mysql-cleanup-result.txt"
          {
            echo "## Production MySQL legacy plaintext cleanup"
            echo
            if [[ ! -s "${result_file}" ]]; then
              echo "The cleanup operation did not produce a sanitized result."
              exit 0
            fi

            while IFS='=' read -r key value; do
              case "${key}" in
                OPERATION)
                  echo "- Operation: \`${value}\`"
                  ;;
                VERIFICATION_TIMESTAMP_UTC)
                  echo "- Verification timestamp (UTC): \`${value}\`"
                  ;;
                LEGACY_BACKUP_COUNT_BEFORE)
                  echo "- Plaintext backups before cleanup: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_PATH)
                  echo
                  echo "### \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_BYTES)
                  echo "- Plaintext bytes: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_MTIME_UTC)
                  echo "- Last modified (UTC): \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_SHA256)
                  echo "- Plaintext SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_CLASSIFICATION)
                  echo "- Classification: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_PATH)
                  echo "- Encrypted copy: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_SHA256)
                  echo "- Encrypted SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_COPY_VERIFIED)
                  echo "- Encrypted copy verified: \`${value}\`"
                  ;;
                EMPTY_BACKUP_COUNT)
                  echo "- Empty files verified: \`${value}\`"
                  ;;
                NONEMPTY_BACKUP_COUNT)
                  echo "- Nonempty backups verified: \`${value}\`"
                  ;;
                TOTAL_SOURCE_BYTES)
                  echo "- Total plaintext bytes removed: \`${value}\`"
                  ;;
                CONFIRMED_MANIFEST_SHA256)
                  echo "- Confirmed manifest SHA-256: \`${value}\`"
                  ;;
                ROUNDTRIP_VERIFIED_COUNT)
                  echo "- Encrypted round trips verified: \`${value}\`"
                  ;;
                PREDELETE_VERIFIED)
                  echo "- Pre-delete verification complete: \`${value}\`"
                  ;;
                DELETION_TIMESTAMP_UTC)
                  echo "- Deletion timestamp (UTC): \`${value}\`"
                  ;;
                DELETED_BACKUP_COUNT)
                  echo "- Plaintext files deleted: \`${value}\`"
                  ;;
                REMAINING_PLAINTEXT_BACKUP_COUNT)
                  echo "- Plaintext backups remaining: \`${value}\`"
                  ;;
                PLAINTEXT_DELETED)
                  echo "- Plaintext deleted: \`${value}\`"
                  ;;
              esac
            done <"${result_file}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove one-time cleanup operation
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "rm -f -- '${DEPLOY_PATH}/scripts/delete-verified-legacy-mysql-backups.sh'"

      - name: Verify production health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            https://pragent.top/actuator/health)"
          status="$(jq -r '.status // empty' <<<"${health}")"
          [[ "${status}" == "UP" ]] || {
            echo "Production health is not UP after legacy backup cleanup." >&2
            exit 1
          }
