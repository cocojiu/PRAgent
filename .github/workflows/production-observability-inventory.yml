name: Production Observability Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability-maintenance
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only observability inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]* | "")
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Inventory production observability
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          inventory_file="${RUNNER_TEMP}/production-observability-inventory.txt"
          remote_inventory_file="${RUNNER_TEMP}/production-observability-remote.txt"

          set +e
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=40 \
            -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' sh -s" > "${remote_inventory_file}" <<'REMOTE_INVENTORY'
          set -eu

          command -v docker >/dev/null 2>&1 || {
            echo "ERROR=docker_not_found"
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "ERROR=docker_daemon_unavailable"
            exit 1
          }

          cd "${DEPLOY_PATH}"
          test -f .env || {
            echo "ERROR=production_env_not_found"
            exit 1
          }
          test -f docker-compose.prod.yml || {
            echo "ERROR=production_compose_not_found"
            exit 1
          }

          orphan_stderr="$(mktemp)"
          production_config_stdout="$(mktemp)"
          production_config_stderr="$(mktemp)"
          observability_config_stdout="$(mktemp)"
          observability_config_stderr="$(mktemp)"
          loki_ready_body="$(mktemp)"
          loki_build_body="$(mktemp)"
          loki_labels_body="$(mktemp)"
          trap 'rm -f "${orphan_stderr}" "${production_config_stdout}" "${production_config_stderr}" "${observability_config_stdout}" "${observability_config_stderr}" "${loki_ready_body}" "${loki_build_body}" "${loki_labels_body}"' EXIT

          echo "INVENTORY_TIMESTAMP_UTC=$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "DOCKER_SERVER_VERSION=$(docker version --format '{{.Server.Version}}')"
          echo "DOCKER_COMPOSE_VERSION=$(docker compose version --short)"
          echo "REMOTE_PRODUCTION_COMPOSE_SHA256=$(sha256sum docker-compose.prod.yml | awk '{ print $1 }')"
          echo "ENV_COMPOSE_PROJECT_NAME=$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env | tail -n 1)"
          if grep -q '^GRAFANA_ADMIN_PASSWORD=.' .env; then
            echo "ENV_GRAFANA_ADMIN_PASSWORD_PRESENT=true"
          else
            echo "ENV_GRAFANA_ADMIN_PASSWORD_PRESENT=false"
          fi

          if docker compose --env-file .env -f docker-compose.prod.yml config --services >"${production_config_stdout}" 2>"${production_config_stderr}"; then
            echo "PRODUCTION_COMPOSE_CONFIG_OK=true"
            echo "PRODUCTION_COMPOSE_SERVICES=$(paste -sd, - < "${production_config_stdout}")"
          else
            echo "PRODUCTION_COMPOSE_CONFIG_OK=false"
          fi

          if [ -f docker-compose.observability.yml ]; then
            echo "OBSERVABILITY_COMPOSE_PRESENT=true"
            echo "REMOTE_OBSERVABILITY_COMPOSE_SHA256=$(sha256sum docker-compose.observability.yml | awk '{ print $1 }')"
            if docker compose --env-file .env -f docker-compose.observability.yml config --services >"${observability_config_stdout}" 2>"${observability_config_stderr}"; then
              echo "OBSERVABILITY_COMPOSE_CONFIG_OK=true"
              echo "OBSERVABILITY_COMPOSE_SERVICES=$(paste -sd, - < "${observability_config_stdout}")"
            else
              echo "OBSERVABILITY_COMPOSE_CONFIG_OK=false"
            fi
          else
            echo "OBSERVABILITY_COMPOSE_PRESENT=false"
            echo "REMOTE_OBSERVABILITY_COMPOSE_SHA256=missing"
            echo "OBSERVABILITY_COMPOSE_CONFIG_OK=not_run"
          fi

          if docker compose --env-file .env -f docker-compose.prod.yml ps >/dev/null 2>"${orphan_stderr}"; then
            if grep -qi 'orphan containers' "${orphan_stderr}"; then
              echo "PRODUCTION_COMPOSE_ORPHAN_WARNING=true"
            else
              echo "PRODUCTION_COMPOSE_ORPHAN_WARNING=false"
            fi
          else
            echo "ERROR=production_compose_ps_failed"
            exit 1
          fi

          legacy_observability_container_count=0
          for service_name in loki promtail alloy docker-proxy grafana; do
            service_count="$(docker ps -aq \
              --filter 'label=com.docker.compose.project=app' \
              --filter "label=com.docker.compose.service=${service_name}" \
              | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
            legacy_observability_container_count=$((legacy_observability_container_count + service_count))
          done
          echo "LEGACY_OBSERVABILITY_CONTAINER_COUNT=${legacy_observability_container_count}"
          echo "LOG_STACK_CANARY_CONTAINER_COUNT=$(docker ps -a --format '{{.Names}}' \
            | awk '/^repoguard-(loki|alloy|docker-proxy)-canary-[0-9]+-[0-9]+$/ { count++ } END { print count + 0 }')"
          echo "LOG_STACK_CANARY_NETWORK_COUNT=$(docker network ls --format '{{.Name}}' \
            | awk '/^repoguard-observability-canary(-docker-api)?-[0-9]+-[0-9]+$/ { count++ } END { print count + 0 }')"
          echo "LOG_STACK_CANARY_VOLUME_COUNT=$(docker volume ls --format '{{.Name}}' \
            | awk '/^repoguard-observability-canary-(loki|alloy)-[0-9]+-[0-9]+$/ { count++ } END { print count + 0 }')"
          echo "LOG_STACK_UPGRADE_STAGE_COUNT=$(find "${DEPLOY_PATH}" -mindepth 1 -maxdepth 1 -type d \
            -name '.observability-log-upgrade-*' | wc -l | tr -d ' ')"
          echo "LOG_STACK_UPGRADE_TRANSIENT_CONTAINER_COUNT=$(docker ps -a --format '{{.Names}}' \
            | awk '/^repoguard-(loki-pre-v37|promtail-pre-alloy|loki-upgrade-[0-9]+)-/ { count++ } END { print count + 0 }')"

          canary_loki_running_count=0
          canary_loki_ready_count=0
          canary_loki_v37_count=0
          canary_loki_error_count=0
          for canary_loki in $(docker ps -a --format '{{.Names}}' \
            | awk '/^repoguard-loki-canary-[0-9]+-[0-9]+$/ { print }'); do
            if [ "$(docker inspect --format '{{.State.Status}}' "${canary_loki}")" = "running" ]; then
              canary_loki_running_count=$((canary_loki_running_count + 1))
              canary_loki_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "${canary_loki}")"
              if curl -fsS --connect-timeout 3 --max-time 5 "http://${canary_loki_ip}:3100/ready" 2>/dev/null \
                | grep -q '^ready'; then
                canary_loki_ready_count=$((canary_loki_ready_count + 1))
              fi
              if curl -fsS --connect-timeout 3 --max-time 5 \
                "http://${canary_loki_ip}:3100/loki/api/v1/status/buildinfo" 2>/dev/null \
                | grep -q '"version":"3.7.4"'; then
                canary_loki_v37_count=$((canary_loki_v37_count + 1))
              fi
            fi
            service_errors="$(docker logs --since 10m "${canary_loki}" 2>&1 \
              | grep -Eic 'level=(error|fatal)|permission denied|operation not permitted|no space left|read-only file system|input/output error|corrupt|checksum' || true)"
            canary_loki_error_count=$((canary_loki_error_count + service_errors))
          done
          echo "LOG_STACK_CANARY_LOKI_RUNNING_COUNT=${canary_loki_running_count}"
          echo "LOG_STACK_CANARY_LOKI_READY_COUNT=${canary_loki_ready_count}"
          echo "LOG_STACK_CANARY_LOKI_V37_COUNT=${canary_loki_v37_count}"
          echo "LOG_STACK_CANARY_LOKI_ERROR_COUNT_10M=${canary_loki_error_count}"

          canary_alloy_running_count=0
          canary_alloy_ready_count=0
          canary_alloy_healthy_count=0
          canary_alloy_entries=0
          canary_alloy_parsing_errors=0
          canary_alloy_error_count=0
          canary_alloy_docker_error_count=0
          for canary_alloy in $(docker ps -a --format '{{.Names}}' \
            | awk '/^repoguard-alloy-canary-[0-9]+-[0-9]+$/ { print }'); do
            if [ "$(docker inspect --format '{{.State.Status}}' "${canary_alloy}")" = "running" ]; then
              canary_alloy_running_count=$((canary_alloy_running_count + 1))
              canary_alloy_network="$(docker inspect \
                --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' \
                "${canary_alloy}" \
                | grep -E '^repoguard-observability-canary-[0-9]+-[0-9]+$' | head -n 1)"
              canary_alloy_ip="$(docker inspect \
                --format "{{(index .NetworkSettings.Networks \"${canary_alloy_network}\").IPAddress}}" \
                "${canary_alloy}")"
              if curl -fsS --connect-timeout 3 --max-time 5 "http://${canary_alloy_ip}:12345/-/ready" 2>/dev/null \
                | grep -q 'Alloy is ready'; then
                canary_alloy_ready_count=$((canary_alloy_ready_count + 1))
              fi
              if curl -fsS --connect-timeout 3 --max-time 5 "http://${canary_alloy_ip}:12345/-/healthy" 2>/dev/null \
                | grep -q 'All Alloy components are healthy'; then
                canary_alloy_healthy_count=$((canary_alloy_healthy_count + 1))
              fi
              alloy_metrics="$(curl -fsS --connect-timeout 3 --max-time 5 \
                "http://${canary_alloy_ip}:12345/metrics" 2>/dev/null || true)"
              service_entries="$(printf '%s\n' "${alloy_metrics}" \
                | awk '/^loki_source_docker_target_entries_total[{ ]/ { total += $NF } END { printf "%.0f", total + 0 }')"
              service_parsing_errors="$(printf '%s\n' "${alloy_metrics}" \
                | awk '/^loki_source_docker_target_parsing_errors_total[{ ]/ { total += $NF } END { printf "%.0f", total + 0 }')"
              canary_alloy_entries=$((canary_alloy_entries + service_entries))
              canary_alloy_parsing_errors=$((canary_alloy_parsing_errors + service_parsing_errors))
            fi
            service_errors="$(docker logs --since 10m "${canary_alloy}" 2>&1 \
              | grep -Eic 'level=(error|fatal)' || true)"
            docker_errors="$(docker logs --since 10m "${canary_alloy}" 2>&1 \
              | grep -Eic 'docker.sock|permission denied|operation not permitted|dial unix|connection refused' || true)"
            canary_alloy_error_count=$((canary_alloy_error_count + service_errors))
            canary_alloy_docker_error_count=$((canary_alloy_docker_error_count + docker_errors))
          done
          echo "LOG_STACK_CANARY_ALLOY_RUNNING_COUNT=${canary_alloy_running_count}"
          echo "LOG_STACK_CANARY_ALLOY_READY_COUNT=${canary_alloy_ready_count}"
          echo "LOG_STACK_CANARY_ALLOY_HEALTHY_COUNT=${canary_alloy_healthy_count}"
          echo "LOG_STACK_CANARY_ALLOY_TARGET_ENTRIES_TOTAL=${canary_alloy_entries}"
          echo "LOG_STACK_CANARY_ALLOY_PARSING_ERRORS_TOTAL=${canary_alloy_parsing_errors}"
          echo "LOG_STACK_CANARY_ALLOY_ERROR_COUNT_10M=${canary_alloy_error_count}"
          echo "LOG_STACK_CANARY_ALLOY_DOCKER_ERROR_COUNT_10M=${canary_alloy_docker_error_count}"

          canary_proxy_running_count=0
          canary_proxy_ready_count=0
          canary_proxy_error_count=0
          for canary_proxy in $(docker ps -a --format '{{.Names}}' \
            | awk '/^repoguard-docker-proxy-canary-[0-9]+-[0-9]+$/ { print }'); do
            if [ "$(docker inspect --format '{{.State.Status}}' "${canary_proxy}")" = "running" ]; then
              canary_proxy_running_count=$((canary_proxy_running_count + 1))
              if [ "$(docker inspect --format '{{.State.Health.Status}}' "${canary_proxy}")" = "healthy" ]; then
                canary_proxy_ready_count=$((canary_proxy_ready_count + 1))
              fi
            fi
            service_errors="$(docker logs --since 10m "${canary_proxy}" 2>&1 \
              | grep -Eic 'level=error|(^|[[:space:]])(err|crit|alert|emerg)([[:space:]]|$)' || true)"
            canary_proxy_error_count=$((canary_proxy_error_count + service_errors))
          done
          echo "LOG_STACK_CANARY_DOCKER_PROXY_RUNNING_COUNT=${canary_proxy_running_count}"
          echo "LOG_STACK_CANARY_DOCKER_PROXY_READY_COUNT=${canary_proxy_ready_count}"
          echo "LOG_STACK_CANARY_DOCKER_PROXY_ERROR_COUNT_10M=${canary_proxy_error_count}"

          if [ "$(docker inspect --format '{{.State.Status}}' repoguard-alloy 2>/dev/null || true)" = "running" ]; then
            collector_name="repoguard-alloy"
          else
            collector_name="repoguard-promtail"
          fi
          echo "LOG_COLLECTOR_NAME=${collector_name}"
          if docker inspect repoguard-promtail >/dev/null 2>&1; then
            echo "PROMTAIL_CONTAINER_EXISTS=true"
          else
            echo "PROMTAIL_CONTAINER_EXISTS=false"
          fi

          container_names="repoguard-loki ${collector_name}"
          if docker inspect repoguard-docker-proxy >/dev/null 2>&1; then
            container_names="${container_names} repoguard-docker-proxy"
          fi
          container_names="${container_names} repoguard-grafana"

          container_index=0
          volume_names=""
          for container_name in ${container_names}; do
            container_index=$((container_index + 1))
            echo "CONTAINER_${container_index}_NAME=${container_name}"
            if ! docker inspect "${container_name}" >/dev/null 2>&1; then
              echo "CONTAINER_${container_index}_EXISTS=false"
              continue
            fi

            echo "CONTAINER_${container_index}_EXISTS=true"
            echo "CONTAINER_${container_index}_STATUS=$(docker inspect --format '{{.State.Status}}' "${container_name}")"
            echo "CONTAINER_${container_index}_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_name}")"
            echo "CONTAINER_${container_index}_RESTART_COUNT=$(docker inspect --format '{{.RestartCount}}' "${container_name}")"
            echo "CONTAINER_${container_index}_STARTED_AT=$(docker inspect --format '{{.State.StartedAt}}' "${container_name}")"
            echo "CONTAINER_${container_index}_RESTART_POLICY=$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_PROJECT=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_SERVICE=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_WORKING_DIR=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_CONFIG_FILES=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_IMAGE_REF=$(docker inspect --format '{{.Config.Image}}' "${container_name}")"
            image_id="$(docker inspect --format '{{.Image}}' "${container_name}")"
            echo "CONTAINER_${container_index}_IMAGE_ID=${image_id}"
            echo "CONTAINER_${container_index}_IMAGE_REPO_DIGESTS=$(docker image inspect --format '{{json .RepoDigests}}' "${image_id}")"
            echo "CONTAINER_${container_index}_NETWORKS=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{printf "%s," $name}}{{end}}' "${container_name}")"
            echo "CONTAINER_${container_index}_PORTS=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "${container_name}")"
            echo "CONTAINER_${container_index}_MOUNTS=$(docker inspect --format '{{range .Mounts}}{{printf "%s|%s|%s," .Type .Name .Destination}}{{end}}' "${container_name}")"
            container_volumes="$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{printf "%s\n" .Name}}{{end}}{{end}}' "${container_name}")"
            if [ -n "${container_volumes}" ]; then
              volume_names="${volume_names} ${container_volumes}"
            fi
          done

          volume_index=0
          printf '%s\n' "${volume_names}" | tr ' ' '\n' | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r volume_name; do
            volume_index=$((volume_index + 1))
            echo "VOLUME_${volume_index}_NAME=${volume_name}"
            echo "VOLUME_${volume_index}_DRIVER=$(docker volume inspect --format '{{.Driver}}' "${volume_name}")"
            echo "VOLUME_${volume_index}_LABELS=$(docker volume inspect --format '{{json .Labels}}' "${volume_name}")"
          done

          grafana_health="$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:3000/api/health 2>/dev/null | tr -d '\r\n' || true)"
          if [ -n "${grafana_health}" ]; then
            echo "GRAFANA_HEALTH_OK=true"
            echo "GRAFANA_HEALTH_RESPONSE=${grafana_health}"
          else
            echo "GRAFANA_HEALTH_OK=false"
          fi

          loki_ready_http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
            --output "${loki_ready_body}" --write-out '%{http_code}' http://127.0.0.1:3100/ready 2>/dev/null || true)"
          echo "LOKI_READY_HTTP_STATUS=${loki_ready_http_status:-000}"
          loki_ready="$(tr -d '\r\n' < "${loki_ready_body}" | cut -c 1-240)"
          if [ "${loki_ready_http_status}" = "200" ]; then
            echo "LOKI_READY_OK=true"
          else
            echo "LOKI_READY_OK=false"
          fi
          echo "LOKI_READY_RESPONSE=${loki_ready:-empty}"

          loki_build_http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
            --output "${loki_build_body}" --write-out '%{http_code}' http://127.0.0.1:3100/loki/api/v1/status/buildinfo 2>/dev/null || true)"
          echo "LOKI_BUILD_INFO_HTTP_STATUS=${loki_build_http_status:-000}"
          if [ "${loki_build_http_status}" = "200" ]; then
            echo "LOKI_BUILD_INFO_OK=true"
            echo "LOKI_BUILD_INFO_RESPONSE=$(tr -d '\r\n' < "${loki_build_body}" | cut -c 1-480)"
          else
            echo "LOKI_BUILD_INFO_OK=false"
          fi

          loki_labels_http_status="$(curl --silent --show-error --connect-timeout 5 --max-time 10 \
            --output "${loki_labels_body}" --write-out '%{http_code}' http://127.0.0.1:3100/loki/api/v1/labels 2>/dev/null || true)"
          echo "LOKI_LABELS_HTTP_STATUS=${loki_labels_http_status:-000}"
          if [ "${loki_labels_http_status}" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"success"' "${loki_labels_body}"; then
            echo "LOKI_LABELS_QUERY_OK=true"
          else
            echo "LOKI_LABELS_QUERY_OK=false"
          fi

          if curl -fsS --connect-timeout 5 --max-time 10 \
            http://127.0.0.1:3100/loki/api/v1/label/container/values 2>/dev/null \
            | grep -q '"repoguard-backend"'; then
            echo "LOKI_BACKEND_CONTAINER_LABEL_OK=true"
          else
            echo "LOKI_BACKEND_CONTAINER_LABEL_OK=false"
          fi

          count_service_errors() {
            since="$1"
            container_name="$2"
            docker logs --since "${since}" "${container_name}" 2>&1 \
              | grep -Eic 'level=(error|fatal)|(^|[[:space:]])(error|fatal)([[:space:]]|$)' || true
          }
          echo "LOKI_ERROR_LOG_COUNT_1M=$(count_service_errors 1m repoguard-loki)"
          echo "LOKI_ERROR_LOG_COUNT_5M=$(count_service_errors 5m repoguard-loki)"
          echo "LOKI_ERROR_LOG_COUNT_10M=$(count_service_errors 10m repoguard-loki)"
          if docker inspect repoguard-promtail >/dev/null 2>&1; then
            echo "PROMTAIL_ERROR_LOG_COUNT_1M=$(count_service_errors 1m repoguard-promtail)"
            echo "PROMTAIL_ERROR_LOG_COUNT_5M=$(count_service_errors 5m repoguard-promtail)"
            echo "PROMTAIL_ERROR_LOG_COUNT_10M=$(count_service_errors 10m repoguard-promtail)"
          else
            echo "PROMTAIL_ERROR_LOG_COUNT_1M=not_present"
            echo "PROMTAIL_ERROR_LOG_COUNT_5M=not_present"
            echo "PROMTAIL_ERROR_LOG_COUNT_10M=not_present"
          fi
          if docker inspect repoguard-alloy >/dev/null 2>&1; then
            echo "ALLOY_ERROR_LOG_COUNT_1M=$(count_service_errors 1m repoguard-alloy)"
            echo "ALLOY_ERROR_LOG_COUNT_5M=$(count_service_errors 5m repoguard-alloy)"
            echo "ALLOY_ERROR_LOG_COUNT_10M=$(count_service_errors 10m repoguard-alloy)"
            if curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:9080/-/ready 2>/dev/null \
              | grep -q 'Alloy is ready'; then
              echo "ALLOY_READY_OK=true"
            else
              echo "ALLOY_READY_OK=false"
            fi
            if curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:9080/-/healthy 2>/dev/null \
              | grep -q 'All Alloy components are healthy'; then
              echo "ALLOY_HEALTHY_OK=true"
            else
              echo "ALLOY_HEALTHY_OK=false"
            fi
            alloy_metrics="$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:9080/metrics 2>/dev/null || true)"
            echo "ALLOY_DOCKER_TARGET_ENTRIES_TOTAL=$(printf '%s\n' "${alloy_metrics}" \
              | awk '/^loki_source_docker_target_entries_total[{ ]/ { total += $NF } END { printf "%.0f", total + 0 }')"
            echo "ALLOY_DOCKER_PARSING_ERRORS_TOTAL=$(printf '%s\n' "${alloy_metrics}" \
              | awk '/^loki_source_docker_target_parsing_errors_total[{ ]/ { total += $NF } END { printf "%.0f", total + 0 }')"
            alloy_socket_mount="$(docker inspect \
              --format '{{range .Mounts}}{{if eq .Destination "/var/run/docker.sock"}}{{.Type}}:{{.RW}}{{end}}{{end}}' \
              repoguard-alloy)"
            echo "ALLOY_DIRECT_DOCKER_SOCKET_MOUNT=${alloy_socket_mount:-none}"
          else
            echo "ALLOY_ERROR_LOG_COUNT_1M=not_present"
            echo "ALLOY_ERROR_LOG_COUNT_5M=not_present"
            echo "ALLOY_ERROR_LOG_COUNT_10M=not_present"
            echo "ALLOY_READY_OK=not_present"
            echo "ALLOY_HEALTHY_OK=not_present"
            echo "ALLOY_DOCKER_TARGET_ENTRIES_TOTAL=not_present"
            echo "ALLOY_DOCKER_PARSING_ERRORS_TOTAL=not_present"
            echo "ALLOY_DIRECT_DOCKER_SOCKET_MOUNT=not_present"
          fi

          if docker inspect repoguard-docker-proxy >/dev/null 2>&1; then
            echo "DOCKER_PROXY_CONTAINER_EXISTS=true"
            proxy_socket_mount="$(docker inspect \
              --format '{{range .Mounts}}{{if eq .Destination "/var/run/docker.sock"}}{{.Type}}:{{.RW}}{{end}}{{end}}' \
              repoguard-docker-proxy)"
            echo "DOCKER_PROXY_SOCKET_MOUNT=${proxy_socket_mount:-none}"
            echo "DOCKER_PROXY_USER=$(docker inspect --format '{{.Config.User}}' repoguard-docker-proxy)"
            echo "DOCKER_PROXY_GROUP_ADD=$(docker inspect --format '{{json .HostConfig.GroupAdd}}' repoguard-docker-proxy)"
            echo "DOCKER_PROXY_READ_ONLY_ROOT=$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' repoguard-docker-proxy)"
            proxy_args="$(docker inspect --format '{{range .Config.Cmd}}{{println .}}{{end}}' repoguard-docker-proxy)"
            if printf '%s\n' "${proxy_args}" | grep -qx -- '-allowfrom=alloy'; then
              echo "DOCKER_PROXY_ALLOY_ONLY=true"
            else
              echo "DOCKER_PROXY_ALLOY_ONLY=false"
            fi
            if printf '%s\n' "${proxy_args}" \
              | grep -Fq -- 'containers/[A-Za-z0-9_.-]+/(json|logs)'; then
              echo "DOCKER_PROXY_CONTAINERS_GET_ENABLED=true"
            else
              echo "DOCKER_PROXY_CONTAINERS_GET_ENABLED=false"
            fi
            if printf '%s\n' "${proxy_args}" \
              | grep -Fq -- 'networks/[A-Za-z0-9_.-]+'; then
              echo "DOCKER_PROXY_NETWORK_GET_ENABLED=true"
            else
              echo "DOCKER_PROXY_NETWORK_GET_ENABLED=false"
            fi
            if ! printf '%s\n' "${proxy_args}" | grep -q '^-allowPOST='; then
              echo "DOCKER_PROXY_POST_DISABLED=true"
            else
              echo "DOCKER_PROXY_POST_DISABLED=false"
            fi
            echo "DOCKER_PROXY_HEALTH=$(docker inspect --format '{{.State.Health.Status}}' repoguard-docker-proxy)"
            echo "DOCKER_PROXY_CONTAINERS_GET_HTTP_STATUS=restricted_to_alloy"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_1M=$(docker logs --since 1m repoguard-docker-proxy 2>&1 \
              | grep -Eic 'level=error|(^|[[:space:]])(err|crit|alert|emerg)([[:space:]]|$)' || true)"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_5M=$(docker logs --since 5m repoguard-docker-proxy 2>&1 \
              | grep -Eic 'level=error|(^|[[:space:]])(err|crit|alert|emerg)([[:space:]]|$)' || true)"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_10M=$(docker logs --since 10m repoguard-docker-proxy 2>&1 \
              | grep -Eic 'level=error|(^|[[:space:]])(err|crit|alert|emerg)([[:space:]]|$)' || true)"
          else
            echo "DOCKER_PROXY_CONTAINER_EXISTS=false"
            echo "DOCKER_PROXY_SOCKET_MOUNT=not_present"
            echo "DOCKER_PROXY_USER=not_present"
            echo "DOCKER_PROXY_GROUP_ADD=not_present"
            echo "DOCKER_PROXY_READ_ONLY_ROOT=not_present"
            echo "DOCKER_PROXY_ALLOY_ONLY=not_present"
            echo "DOCKER_PROXY_CONTAINERS_GET_ENABLED=not_present"
            echo "DOCKER_PROXY_NETWORK_GET_ENABLED=not_present"
            echo "DOCKER_PROXY_POST_DISABLED=not_present"
            echo "DOCKER_PROXY_HEALTH=not_present"
            echo "DOCKER_PROXY_CONTAINERS_GET_HTTP_STATUS=not_present"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_1M=not_present"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_5M=not_present"
            echo "DOCKER_PROXY_ERROR_LOG_COUNT_10M=not_present"
          fi
          echo "GRAFANA_ERROR_LOG_COUNT_1M=$(count_service_errors 1m repoguard-grafana)"
          echo "GRAFANA_ERROR_LOG_COUNT_5M=$(count_service_errors 5m repoguard-grafana)"
          echo "GRAFANA_ERROR_LOG_COUNT_10M=$(count_service_errors 10m repoguard-grafana)"

          count_loki_error_category() {
            category_pattern="$1"
            docker logs --since 10m repoguard-loki 2>&1 \
              | grep -Ei 'level=(error|fatal)|(^|[[:space:]])(error|fatal)([[:space:]]|$)' \
              | grep -Eic "${category_pattern}" || true
          }
          echo "LOKI_FATAL_LOG_COUNT_10M=$(count_loki_error_category 'level=fatal|(^|[[:space:]])fatal([[:space:]]|$)')"
          echo "LOKI_PERMISSION_ERROR_COUNT_10M=$(count_loki_error_category 'permission denied|operation not permitted')"
          echo "LOKI_MISSING_PATH_ERROR_COUNT_10M=$(count_loki_error_category 'no such file|not found')"
          echo "LOKI_STORAGE_ERROR_COUNT_10M=$(count_loki_error_category 'input/output error|read-only file system|no space left|disk')"
          echo "LOKI_CORRUPTION_ERROR_COUNT_10M=$(count_loki_error_category 'corrupt|checksum')"
          echo "LOKI_TIMEOUT_ERROR_COUNT_10M=$(count_loki_error_category 'timeout|deadline exceeded')"
          echo "LOKI_CONNECTION_ERROR_COUNT_10M=$(count_loki_error_category 'connection refused|connection reset|network is unreachable')"
          echo "LOKI_COMPACTOR_ERROR_COUNT_10M=$(count_loki_error_category 'compactor|retention')"
          echo "LOKI_INGESTER_ERROR_COUNT_10M=$(count_loki_error_category 'ingester|wal')"
          REMOTE_INVENTORY
          ssh_status=$?
          set -e

          if [ "${ssh_status}" -ne 0 ]; then
            echo "Remote inventory failed with exit code ${ssh_status}; partial sanitized inventory follows." >&2
            cat "${remote_inventory_file}" >&2
            exit "${ssh_status}"
          fi

          {
            echo "REPOSITORY_PRODUCTION_COMPOSE_SHA256=$(sha256sum docker-compose.prod.yml | awk '{ print $1 }')"
            echo "REPOSITORY_OBSERVABILITY_COMPOSE_SHA256=$(sha256sum docker-compose.observability.yml | awk '{ print $1 }')"
            cat "${remote_inventory_file}"
          } > "${inventory_file}"

          cat "${inventory_file}"
          {
            echo "## Production observability inventory"
            echo
            echo '```text'
            cat "${inventory_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
