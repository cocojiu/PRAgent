name: Production Observability Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-observability-maintenance
  cancel-in-progress: false

jobs:
  inventory:
    name: Read-only observability inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]* | "")
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Inventory production observability
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          inventory_file="${RUNNER_TEMP}/production-observability-inventory.txt"
          remote_inventory_file="${RUNNER_TEMP}/production-observability-remote.txt"

          set +e
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH='${DEPLOY_PATH}' sh -s" > "${remote_inventory_file}" <<'REMOTE_INVENTORY'
          set -eu

          command -v docker >/dev/null 2>&1 || {
            echo "ERROR=docker_not_found"
            exit 1
          }
          docker info >/dev/null 2>&1 || {
            echo "ERROR=docker_daemon_unavailable"
            exit 1
          }

          cd "${DEPLOY_PATH}"
          test -f .env || {
            echo "ERROR=production_env_not_found"
            exit 1
          }
          test -f docker-compose.prod.yml || {
            echo "ERROR=production_compose_not_found"
            exit 1
          }
          test -f docker-compose.observability.yml || {
            echo "ERROR=observability_compose_not_found"
            exit 1
          }

          orphan_stderr="$(mktemp)"
          production_config_stdout="$(mktemp)"
          production_config_stderr="$(mktemp)"
          observability_config_stdout="$(mktemp)"
          observability_config_stderr="$(mktemp)"
          trap 'rm -f "${orphan_stderr}" "${production_config_stdout}" "${production_config_stderr}" "${observability_config_stdout}" "${observability_config_stderr}"' EXIT

          echo "INVENTORY_TIMESTAMP_UTC=$(date -u +'%Y%m%dT%H%M%SZ')"
          echo "DOCKER_SERVER_VERSION=$(docker version --format '{{.Server.Version}}')"
          echo "DOCKER_COMPOSE_VERSION=$(docker compose version --short)"
          echo "REMOTE_PRODUCTION_COMPOSE_SHA256=$(sha256sum docker-compose.prod.yml | awk '{ print $1 }')"
          echo "REMOTE_OBSERVABILITY_COMPOSE_SHA256=$(sha256sum docker-compose.observability.yml | awk '{ print $1 }')"
          echo "ENV_COMPOSE_PROJECT_NAME=$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env | tail -n 1)"

          if docker compose --env-file .env -f docker-compose.prod.yml config --services >"${production_config_stdout}" 2>"${production_config_stderr}"; then
            echo "PRODUCTION_COMPOSE_CONFIG_OK=true"
            echo "PRODUCTION_COMPOSE_SERVICES=$(paste -sd, - < "${production_config_stdout}")"
          else
            echo "PRODUCTION_COMPOSE_CONFIG_OK=false"
          fi

          if docker compose --env-file .env -f docker-compose.observability.yml config --services >"${observability_config_stdout}" 2>"${observability_config_stderr}"; then
            echo "OBSERVABILITY_COMPOSE_CONFIG_OK=true"
            echo "OBSERVABILITY_COMPOSE_SERVICES=$(paste -sd, - < "${observability_config_stdout}")"
          else
            echo "OBSERVABILITY_COMPOSE_CONFIG_OK=false"
          fi

          if docker compose --env-file .env -f docker-compose.prod.yml ps >/dev/null 2>"${orphan_stderr}"; then
            if grep -qi 'orphan containers' "${orphan_stderr}"; then
              echo "PRODUCTION_COMPOSE_ORPHAN_WARNING=true"
            else
              echo "PRODUCTION_COMPOSE_ORPHAN_WARNING=false"
            fi
          else
            echo "ERROR=production_compose_ps_failed"
            exit 1
          fi

          container_index=0
          volume_names=""
          for container_name in repoguard-loki repoguard-promtail repoguard-grafana; do
            container_index=$((container_index + 1))
            echo "CONTAINER_${container_index}_NAME=${container_name}"
            if ! docker inspect "${container_name}" >/dev/null 2>&1; then
              echo "CONTAINER_${container_index}_EXISTS=false"
              continue
            fi

            echo "CONTAINER_${container_index}_EXISTS=true"
            echo "CONTAINER_${container_index}_STATUS=$(docker inspect --format '{{.State.Status}}' "${container_name}")"
            echo "CONTAINER_${container_index}_HEALTH=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container_name}")"
            echo "CONTAINER_${container_index}_RESTART_POLICY=$(docker inspect --format '{{.HostConfig.RestartPolicy.Name}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_PROJECT=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_SERVICE=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_WORKING_DIR=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_COMPOSE_CONFIG_FILES=$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "${container_name}")"
            echo "CONTAINER_${container_index}_IMAGE_REF=$(docker inspect --format '{{.Config.Image}}' "${container_name}")"
            image_id="$(docker inspect --format '{{.Image}}' "${container_name}")"
            echo "CONTAINER_${container_index}_IMAGE_ID=${image_id}"
            echo "CONTAINER_${container_index}_IMAGE_REPO_DIGESTS=$(docker image inspect --format '{{json .RepoDigests}}' "${image_id}")"
            echo "CONTAINER_${container_index}_NETWORKS=$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{printf "%s," $name}}{{end}}' "${container_name}")"
            echo "CONTAINER_${container_index}_MOUNTS=$(docker inspect --format '{{range .Mounts}}{{printf "%s|%s|%s," .Type .Name .Destination}}{{end}}' "${container_name}")"
            container_volumes="$(docker inspect --format '{{range .Mounts}}{{if eq .Type "volume"}}{{printf "%s\n" .Name}}{{end}}{{end}}' "${container_name}")"
            if [ -n "${container_volumes}" ]; then
              volume_names="${volume_names} ${container_volumes}"
            fi
          done

          volume_index=0
          printf '%s\n' "${volume_names}" | tr ' ' '\n' | sed '/^[[:space:]]*$/d' | sort -u | while IFS= read -r volume_name; do
            volume_index=$((volume_index + 1))
            echo "VOLUME_${volume_index}_NAME=${volume_name}"
            echo "VOLUME_${volume_index}_DRIVER=$(docker volume inspect --format '{{.Driver}}' "${volume_name}")"
            echo "VOLUME_${volume_index}_LABELS=$(docker volume inspect --format '{{json .Labels}}' "${volume_name}")"
          done

          grafana_health="$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:3000/api/health 2>/dev/null | tr -d '\r\n' || true)"
          if [ -n "${grafana_health}" ]; then
            echo "GRAFANA_HEALTH_OK=true"
            echo "GRAFANA_HEALTH_RESPONSE=${grafana_health}"
          else
            echo "GRAFANA_HEALTH_OK=false"
          fi

          loki_ready="$(curl -fsS --connect-timeout 5 --max-time 10 http://127.0.0.1:3100/ready 2>/dev/null | tr -d '\r\n' || true)"
          if [ -n "${loki_ready}" ]; then
            echo "LOKI_READY_OK=true"
            echo "LOKI_READY_RESPONSE=${loki_ready}"
          else
            echo "LOKI_READY_OK=false"
          fi
          REMOTE_INVENTORY
          ssh_status=$?
          set -e

          if [ "${ssh_status}" -ne 0 ]; then
            echo "Remote inventory failed with exit code ${ssh_status}; partial sanitized inventory follows." >&2
            cat "${remote_inventory_file}" >&2
            exit "${ssh_status}"
          fi

          {
            echo "REPOSITORY_PRODUCTION_COMPOSE_SHA256=$(sha256sum docker-compose.prod.yml | awk '{ print $1 }')"
            echo "REPOSITORY_OBSERVABILITY_COMPOSE_SHA256=$(sha256sum docker-compose.observability.yml | awk '{ print $1 }')"
            cat "${remote_inventory_file}"
          } > "${inventory_file}"

          cat "${inventory_file}"
          {
            echo "## Production observability inventory"
            echo
            echo '```text'
            cat "${inventory_file}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
