name: Rotate Production Webhook Secret

on:
  push:
    branches:
      - PRAgent-test
    paths:
      - .github/workflows/rotate-production-webhook-secret.yml

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 30 -p "${DEPLOY_PORT:-22}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Rotate secret and restart webhook consumers
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          WEBHOOK_SECRET: ${{ secrets.REPOGUARD_GITHUB_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "${WEBHOOK_SECRET}"
          secret_file="$(mktemp)"
          trap 'rm -f "${secret_file}"' EXIT
          printf '%s' "${WEBHOOK_SECRET}" > "${secret_file}"
          chmod 600 "${secret_file}"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" "${secret_file}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.webhook-secret.next"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && \
             secret=\$(cat .webhook-secret.next) && \
             tmp=\$(mktemp) && \
             awk -v value=\"\${secret}\" \
               'BEGIN { found=0 } /^REPOGUARD_GITHUB_WEBHOOK_SECRET=/ { print \"REPOGUARD_GITHUB_WEBHOOK_SECRET=\" value; found=1; next } { print } END { if (!found) print \"REPOGUARD_GITHUB_WEBHOOK_SECRET=\" value }' \
               .env > \"\${tmp}\" && \
             chmod 600 \"\${tmp}\" && mv \"\${tmp}\" .env && rm -f .webhook-secret.next && \
             docker compose -f docker-compose.prod.yml up -d --force-recreate backend backend-worker"

      - name: Verify production health
        shell: bash
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL || vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          health_url="${HEALTH_URL:-https://pragent.top/actuator/health}"
          health_url="${health_url%%,*}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${health_url}" | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
