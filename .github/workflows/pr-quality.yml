name: Pull Request Quality

on:
  workflow_call:
    inputs:
      isolated_review_acceptance:
        description: Exercise immutable application images with owned infrastructure and HTTPS supplier stubs
        required: false
        default: false
        type: boolean
      linux_backup_integration:
        description: Validate scheduled backups, SSE proxy transport and immutable schema rollback on a fresh hosted runner
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - master
      - PRAgent-test

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: Tracked file governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository governance checks
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests

  secret-scan:
    name: PR secret diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  edge-config:
    name: Production edge configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral validation secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/repoguard-compose-secrets"
          install -d -m 700 "${secret_dir}"
          write_secret() {
            setting="$1"
            filename="$2"
            value="$3"
            path="${secret_dir}/${filename}"
            printf '%s' "${value}" > "${path}"
            chmod 444 "${path}"
            echo "${setting}=${path}" >> "$GITHUB_ENV"
          }
          encryption_key="CI!1-$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 32)"
          auth_token_secret="$(openssl rand -hex 32)"
          admin_api_key="$(openssl rand -hex 32)"
          webhook_secret="$(openssl rand -hex 32)"
          for value in "${encryption_key}" "${encryption_salt}" "${auth_token_secret}" "${admin_api_key}" "${webhook_secret}"; do
            echo "::add-mask::${value}"
          done
          echo "REPOGUARD_SECURITY_ENCRYPTION_KEY=${encryption_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_SECURITY_ENCRYPTION_SALT=${encryption_salt}" >> "$GITHUB_ENV"
          echo "SMOKE_AUTH_TOKEN_SECRET=${auth_token_secret}" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_API_KEY=${admin_api_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_GITHUB_WEBHOOK_SECRET=${webhook_secret}" >> "$GITHUB_ENV"
          write_secret MYSQL_ROOT_PASSWORD_FILE mysql.root-password "$(openssl rand -hex 32)"
          write_secret MYSQL_PASSWORD_FILE spring.datasource.password "$(openssl rand -hex 32)"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE repoguard.security.encryption-key "${encryption_key}"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE repoguard.security.encryption-salt "${encryption_salt}"
          write_secret REPOGUARD_AUTH_TOKEN_SECRET_FILE repoguard.auth.token-secret "${auth_token_secret}"
          write_secret REPOGUARD_ADMIN_API_KEY_FILE app.security.admin-api-key.key "${admin_api_key}"
          write_secret REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE app.github.webhook.secret "${webhook_secret}"
      - name: Validate Compose configuration matrix
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml config --quiet
          REPOGUARD_RUNTIME_ROLE=api \
          REPOGUARD_DEPLOYMENT_MODE=split \
            docker compose --profile worker-split \
              --env-file .env.prod.example \
              -f docker-compose.prod.yml config --quiet
          SMOKE_BACKEND_IMAGE=repoguard/backend:validation \
          SMOKE_BACKEND_PORT=18081 \
          SMOKE_MYSQL_ROOT_PASSWORD=validation-root \
          SMOKE_MYSQL_PASSWORD=validation-db \
          SMOKE_RABBITMQ_PASSWORD=validation-rabbit \
          REPOGUARD_SECURITY_ENCRYPTION_KEY_ID=validation-001 \
            docker compose -f docker-compose.smoke.yml config --quiet
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml \
            -f docker-compose.metrics-bridge.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
          METRICS_REMOTE_WRITE_URL=https://metrics-validation.invalid/api/v1/write \
          METRICS_REMOTE_WRITE_USERNAME=validation \
          METRICS_REMOTE_WRITE_PASSWORD=validation \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              -f config/observability/docker-compose.metrics.yml \
              config --quiet
      - name: Exercise production deployment preflight
        shell: bash
        run: >-
          BACKEND_IMAGE=repoguard/backend:validation
          FRONTEND_IMAGE=repoguard/frontend:validation
          ENV_FILE=.env.prod.example
          PREFLIGHT_ONLY=true
          sh scripts/deploy-prod.sh
      - name: Validate production Caddy configuration
        run: >-
          docker run --rm
          -e "REPOGUARD_FRONTEND_SERVER_NAME=repoguard.example www.repoguard.example"
          -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend-unit:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend production readiness slice
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick
      - name: Run backend tests
        working-directory: repoguard-backend
        run: ./mvnw -B verify
      - name: Scan backend libraries for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: fs
          scan-ref: repoguard-backend/target
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          vuln-type: library
          severity: HIGH,CRITICAL
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jacoco
          path: repoguard-backend/target/site/jacoco
          if-no-files-found: warn

  frontend-quality:
    name: Frontend typecheck lint test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repoguard-frontend/package-lock.json
      - name: Install dependencies
        working-directory: repoguard-frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: repoguard-frontend
        run: npx playwright install --with-deps chromium
      - name: Run quality gate
        working-directory: repoguard-frontend
        run: npm run quality
      - name: Build and test opt-in personal SSE frontend
        working-directory: repoguard-frontend
        env:
          VITE_REVIEW_PROGRESS_STREAM: 'true'
        run: npm run test:e2e -- --grep "SSE progress"
      - name: Build and run browser end-to-end tests
        working-directory: repoguard-frontend
        env:
          VITE_REPOGUARD_EDITION: enterprise-experimental
        run: npm run test:e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright-failure-${{ github.run_id }}
          path: |
            repoguard-frontend/playwright-report
            repoguard-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
  backend-integration:
    name: Spring MySQL RabbitMQ integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: repoguard_integration
          MYSQL_USER: repoguard
          MYSQL_PASSWORD: integration-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REPOGUARD_RUN_INTEGRATION_TESTS: 'true'
      REPOGUARD_RUN_PREFLIGHT_INTEGRATION: 'true'
      REPOGUARD_MYSQL_DIAGNOSTICS_PASSWORD: integration-root
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/repoguard_integration?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: repoguard
      SPRING_DATASOURCE_PASSWORD: integration-db
      SPRING_RABBITMQ_HOST: 127.0.0.1
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_VIRTUAL_HOST: /
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: integration-001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate ephemeral integration secrets
        shell: bash
        run: |
          set -euo pipefail
          encryption_key="CI!1-$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 32)"
          REPOGUARD_AUTH_TOKEN_SECRET=$(openssl rand -hex 32)
          auth_token_secret="${REPOGUARD_AUTH_TOKEN_SECRET}"
          admin_api_key="$(openssl rand -hex 32)"
          for value in "${encryption_key}" "${encryption_salt}" "${auth_token_secret}" "${admin_api_key}"; do
            echo "::add-mask::${value}"
          done
          echo "REPOGUARD_SECURITY_ENCRYPTION_KEY=${encryption_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_SECURITY_ENCRYPTION_SALT=${encryption_salt}" >> "$GITHUB_ENV"
          echo "REPOGUARD_AUTH_TOKEN_SECRET=${auth_token_secret}" >> "$GITHUB_ENV"
          echo "REPOGUARD_ADMIN_API_KEY=${admin_api_key}" >> "$GITHUB_ENV"
      - name: Run production-like context tests
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=ProductionRuntimeContextIntegrationTest,PreflightPreviewMysqlIntegrationTest,PreflightTransportIntegrationTest,ReviewMemberAssignmentMysqlIntegrationTest test 2>&1

      - name: Require actual online CLI and assignment integration execution
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          $expectedSuites = @{
            'integration.PreflightPreviewMysqlIntegrationTest' = 5
            'review.PreflightTransportIntegrationTest' = 1
            'integration.ReviewMemberAssignmentMysqlIntegrationTest' = 7
          }
          foreach ($suiteName in $expectedSuites.Keys) {
            [xml]$testReport = Get-Content -LiteralPath "target/surefire-reports/TEST-com.repoguard.agent.$suiteName.xml" -Raw
            $suite = $testReport.testsuite
            if ([int]$suite.tests -ne $expectedSuites[$suiteName] -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
              throw "Integration $suiteName must execute and pass without skipping."
            }
          }

  migration-upgrade:
    name: Flyway supported upgrade path
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: repoguard_upgrade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REPOGUARD_RUN_INTEGRATION_TESTS: 'true'
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/repoguard_upgrade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: integration-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run supported upgrade path and durable accounting tests
        working-directory: repoguard-backend
        run: ./mvnw -B -Dsurefire.runOrder=alphabetical -Dtest=FlywayMigrationUpgradePathIntegrationTest,LlmUsageBudgetMysqlIntegrationTest,LlmModelSafetyMysqlIntegrationTest,ReviewQueryOptimizationMysqlIntegrationTest,GithubFeedbackMysqlIntegrationTest test

  scheduled-backup-integration:
    name: Linux backup restore, SSE transport and schema rollback
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_backup_integration == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      REPOGUARD_RUN_LINUX_BACKUP_INTEGRATION: 'true'
      REPOGUARD_ROLLBACK_PREVIOUS_SCHEMA_VERSION: '108'
      # Signed candidate source run 39117463631; production rollback approved run 39107320086 (source 39022353214).
      REPOGUARD_ROLLBACK_UPGRADE_IMAGE: ghcr.io/cocojiu/pragent-backend@sha256:285253d17a58164c27557f23cbd26042d63f5a63a9944606f0b0594853f50cdf
      REPOGUARD_ROLLBACK_UPGRADE_REVISION: f2e6ce94f396e493a89b14ddfb840fdf6f7f0678
      REPOGUARD_ROLLBACK_PREVIOUS_IMAGE: ghcr.io/cocojiu/pragent-backend@sha256:ff1c61bcec73255767caecc5292f27696ae6201b54ad682c596153e9bd254517
      REPOGUARD_ROLLBACK_PREVIOUS_REVISION: 268aa8b7f71063aa0b23816a10c0f7fa1e03be02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Authenticate immutable release image pulls
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run real restore, TLS streaming and runtime rollback checks
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=ScheduledMysqlBackupLinuxIntegrationTest,ReviewProgressTransportIntegrationTest,RuntimeSchemaRollbackLinuxIntegrationTest test
      - name: Require actual Linux integration execution
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          $expectedSuites = @{
            ScheduledMysqlBackupLinuxIntegrationTest = 1
            ReviewProgressTransportIntegrationTest = 2
            RuntimeSchemaRollbackLinuxIntegrationTest = 1
          }
          foreach ($suiteName in $expectedSuites.Keys) {
            [xml]$testReport = Get-Content -LiteralPath "target/surefire-reports/TEST-com.repoguard.agent.integration.$suiteName.xml" -Raw
            $suite = $testReport.testsuite
            if ([int]$suite.tests -ne $expectedSuites[$suiteName] -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
              throw "Linux $suiteName must actually execute and pass without skipping."
            }
          }
      - name: Upload bounded test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-backup-linux-${{ github.run_id }}
          path: |
            repoguard-backend/target/surefire-reports/*ScheduledMysqlBackupLinuxIntegrationTest*
            repoguard-backend/target/surefire-reports/*ReviewProgressTransportIntegrationTest*
            repoguard-backend/target/surefire-reports/*RuntimeSchemaRollbackLinuxIntegrationTest*
            repoguard-backend/target/runtime-rollback/
          if-no-files-found: warn
          retention-days: 7

  isolated-review-acceptance:
    name: Isolated long review and browser recovery
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.isolated_review_acceptance == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      REPOGUARD_RUN_ISOLATED_REVIEW_ACCEPTANCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install isolated Chromium test runtime
        working-directory: repoguard-backend
        run: ./mvnw -B test-compile org.codehaus.mojo:exec-maven-plugin:3.6.3:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"
      - name: Run real application acceptance in headed Chromium
        working-directory: repoguard-backend
        run: xvfb-run --auto-servernum ./mvnw -B -Dtest=IsolatedReviewAcceptanceLinuxIntegrationTest test
      - name: Require all acceptance scenarios without skips
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          [xml]$report = Get-Content -LiteralPath target/surefire-reports/TEST-com.repoguard.agent.integration.IsolatedReviewAcceptanceLinuxIntegrationTest.xml -Raw
          $suite = $report.testsuite
          if ([int]$suite.tests -ne 3 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
            throw "Isolated review acceptance must execute all three scenarios without skipping."
          }
      - name: Upload bounded acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-review-acceptance-${{ github.run_id }}
          path: |
            repoguard-backend/target/surefire-reports/*IsolatedReviewAcceptanceLinuxIntegrationTest*
            repoguard-backend/target/isolated-review-acceptance/
          if-no-files-found: warn
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
