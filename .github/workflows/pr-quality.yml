name: Pull Request Quality

on:
  workflow_call:
    inputs:
      isolated_review_acceptance:
        description: Exercise immutable application images with owned infrastructure and HTTPS supplier stubs
        required: false
        default: false
        type: boolean
      linux_backup_integration:
        description: Validate scheduled backups, SSE proxy transport and immutable schema rollback on a fresh hosted runner
        required: false
        default: false
        type: boolean
  pull_request:
    branches:
      - main
      - master
      - PRAgent-test

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-governance:
    name: Tracked file governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run repository governance checks
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick -SkipBackendTests

  secret-scan:
    name: PR secret diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  edge-config:
    name: Production edge configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate ephemeral validation secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_dir="${RUNNER_TEMP}/repoguard-compose-secrets"
          install -d -m 700 "${secret_dir}"
          write_secret() {
            setting="$1"
            filename="$2"
            value="$3"
            path="${secret_dir}/${filename}"
            printf '%s' "${value}" > "${path}"
            chmod 444 "${path}"
            echo "${setting}=${path}" >> "$GITHUB_ENV"
          }
          encryption_key="CI!1-$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 32)"
          auth_token_secret="$(openssl rand -hex 32)"
          admin_api_key="$(openssl rand -hex 32)"
          webhook_secret="$(openssl rand -hex 32)"
          for value in "${encryption_key}" "${encryption_salt}" "${auth_token_secret}" "${admin_api_key}" "${webhook_secret}"; do
            echo "::add-mask::${value}"
          done
          echo "REPOGUARD_SECURITY_ENCRYPTION_KEY=${encryption_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_SECURITY_ENCRYPTION_SALT=${encryption_salt}" >> "$GITHUB_ENV"
          echo "SMOKE_AUTH_TOKEN_SECRET=${auth_token_secret}" >> "$GITHUB_ENV"
          echo "SMOKE_ADMIN_API_KEY=${admin_api_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_GITHUB_WEBHOOK_SECRET=${webhook_secret}" >> "$GITHUB_ENV"
          write_secret MYSQL_ROOT_PASSWORD_FILE mysql.root-password "$(openssl rand -hex 32)"
          write_secret MYSQL_PASSWORD_FILE spring.datasource.password "$(openssl rand -hex 32)"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_KEY_FILE repoguard.security.encryption-key "${encryption_key}"
          write_secret REPOGUARD_SECURITY_ENCRYPTION_SALT_FILE repoguard.security.encryption-salt "${encryption_salt}"
          write_secret REPOGUARD_AUTH_TOKEN_SECRET_FILE repoguard.auth.token-secret "${auth_token_secret}"
          write_secret REPOGUARD_ADMIN_API_KEY_FILE app.security.admin-api-key.key "${admin_api_key}"
          write_secret REPOGUARD_GITHUB_WEBHOOK_SECRET_FILE app.github.webhook.secret "${webhook_secret}"
      - name: Validate Compose configuration matrix
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml config --quiet
          REPOGUARD_RUNTIME_ROLE=api \
          REPOGUARD_DEPLOYMENT_MODE=split \
            docker compose --profile worker-split \
              --env-file .env.prod.example \
              -f docker-compose.prod.yml config --quiet
          SMOKE_BACKEND_IMAGE=repoguard/backend:validation \
          SMOKE_BACKEND_PORT=18081 \
          SMOKE_MYSQL_ROOT_PASSWORD=validation-root \
          SMOKE_MYSQL_PASSWORD=validation-db \
          SMOKE_RABBITMQ_PASSWORD=validation-rabbit \
          REPOGUARD_SECURITY_ENCRYPTION_KEY_ID=validation-001 \
            docker compose -f docker-compose.smoke.yml config --quiet
          docker compose --env-file .env.prod.example \
            -f docker-compose.prod.yml \
            -f docker-compose.metrics-bridge.yml config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              config --quiet
          GRAFANA_ADMIN_PASSWORD=validation-only \
          DOCKER_SOCKET_GID=0 \
          METRICS_REMOTE_WRITE_URL=https://metrics-validation.invalid/api/v1/write \
          METRICS_REMOTE_WRITE_USERNAME=validation \
          METRICS_REMOTE_WRITE_PASSWORD=validation \
            docker compose --env-file /dev/null \
              -f docker-compose.observability.yml \
              -f config/observability/docker-compose.production.yml \
              -f config/observability/docker-compose.metrics.yml \
              config --quiet
      - name: Exercise production deployment preflight
        shell: bash
        run: >-
          BACKEND_IMAGE=repoguard/backend:validation
          FRONTEND_IMAGE=repoguard/frontend:validation
          ENV_FILE=.env.prod.example
          PREFLIGHT_ONLY=true
          sh scripts/deploy-prod.sh
      - name: Validate production Caddy configuration
        run: >-
          docker run --rm
          -e "REPOGUARD_FRONTEND_SERVER_NAME=repoguard.example www.repoguard.example"
          -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend-unit:
    name: Backend unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend production readiness slice
        shell: pwsh
        run: ./scripts/production-readiness-check.ps1 -Mode quick
      - name: Run backend tests
        working-directory: repoguard-backend
        run: ./mvnw -B verify
      - name: Scan backend libraries for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: fs
          scan-ref: repoguard-backend/target
          scanners: vuln
          format: table
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          vuln-type: library
          severity: HIGH,CRITICAL
      - name: Build and inspect backend runtime image
        shell: bash
        run: |
          set -euo pipefail
          build_runtime() {
            timeout 600s docker buildx build --load --progress plain --build-arg OCI_REVISION="${GITHUB_SHA}" \
              --build-arg OCI_VERSION=pr-runtime "$@" -t repoguard/backend:pr-runtime repoguard-backend
          }
          build_runtime --pull
          build_runtime 2>&1 | tee backend-runtime-cache.log
          build_runtime --no-cache-filter runtime 2>&1 | tee backend-runtime-refresh.log
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          for kind,cached in [('cache',True),('refresh',False)]:
              text=pathlib.Path('backend-runtime-'+kind+'.log').read_text()
              ids=re.findall(r'^(#\d+) \[[^\]]+\] RUN apk upgrade --no-cache(?:\s|$)',text,re.M)
              assert len(ids)==1,'runtime APK step missing or ambiguous'
              hit=bool(re.search(r'^'+re.escape(ids[0])+r' CACHED\s*$',text,re.M))
              assert hit==cached,'runtime cache policy did not execute as requested'
              if not cached:assert re.search(r'^'+re.escape(ids[0])+r' DONE(?:\s|$)',text,re.M)
          image_id=subprocess.check_output(['docker','image','inspect','--format','{{.Id}}','repoguard/backend:pr-runtime'],text=True,timeout=10).strip()
          pathlib.Path('backend-runtime-cache-verification.json').write_text(json.dumps({'state':'verified','runtimeStage':'runtime','baselineCacheHit':True,'filteredRuntimeExecuted':True,'imageId':image_id}))
          PY
          test "$(docker image inspect --format '{{.Config.User}}' repoguard/backend:pr-runtime)" = '10001:10001'
          docker image inspect --format '{{.Id}} {{.Config.User}}' repoguard/backend:pr-runtime > backend-runtime-identity.txt
          timeout 30s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /sbin/apk repoguard/backend:pr-runtime \
            list --installed musl musl-utils zlib | tee -a backend-runtime-identity.txt
      - name: Scan backend runtime image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: repoguard/backend:pr-runtime
          scanners: vuln
          format: json
          output: backend-runtime-trivy.json
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
      - name: Preserve backend runtime scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-runtime-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend-runtime-identity.txt
            backend-runtime-trivy.json
            backend-runtime-cache-verification.json
            backend-runtime-cache.log
            backend-runtime-refresh.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-jacoco
          path: repoguard-backend/target/site/jacoco
          if-no-files-found: warn

  frontend-quality:
    name: Frontend typecheck lint test build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repoguard-frontend/package-lock.json
      - name: Install dependencies
        working-directory: repoguard-frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: repoguard-frontend
        run: npx playwright install --with-deps chromium
      - name: Run quality gate
        working-directory: repoguard-frontend
        run: npm run quality
      - name: Build and test opt-in personal SSE frontend
        working-directory: repoguard-frontend
        env:
          VITE_REVIEW_PROGRESS_STREAM: 'true'
        run: npm run test:e2e -- --grep "SSE progress"
      - name: Build and run browser end-to-end tests
        working-directory: repoguard-frontend
        env:
          VITE_REPOGUARD_EDITION: enterprise-experimental
        run: npm run test:e2e
      - name: Build and inspect frontend runtime image
        shell: bash
        env:
          VITE_REPOGUARD_EDITION: personal
          VITE_REVIEW_PROGRESS_STREAM: 'false'
        run: |
          set -euo pipefail
          npm --prefix repoguard-frontend run build
          build_runtime() {
            timeout 600s docker buildx build --load --progress plain --build-arg OCI_REVISION="${GITHUB_SHA}" \
              --build-arg OCI_VERSION=pr-runtime --build-arg REVIEW_PROGRESS_STREAM=false \
              "$@" -t repoguard/frontend:pr-runtime repoguard-frontend
          }
          build_runtime --pull
          build_runtime 2>&1 | tee frontend-runtime-cache.log
          build_runtime --no-cache-filter runtime 2>&1 | tee frontend-runtime-refresh.log
          python3 - <<'PY'
          import json,pathlib,re,subprocess
          for kind,cached in [('cache',True),('refresh',False)]:
              text=pathlib.Path('frontend-runtime-'+kind+'.log').read_text()
              ids=re.findall(r'^(#\d+) \[[^\]]+\] RUN apk upgrade --no-cache(?:\s|$)',text,re.M)
              assert len(ids)==1,'runtime APK step missing or ambiguous'
              hit=bool(re.search(r'^'+re.escape(ids[0])+r' CACHED\s*$',text,re.M))
              assert hit==cached,'runtime cache policy did not execute as requested'
              if not cached:assert re.search(r'^'+re.escape(ids[0])+r' DONE(?:\s|$)',text,re.M)
          image_id=subprocess.check_output(['docker','image','inspect','--format','{{.Id}}','repoguard/frontend:pr-runtime'],text=True,timeout=10).strip()
          pathlib.Path('frontend-runtime-cache-verification.json').write_text(json.dumps({'state':'verified','runtimeStage':'runtime','baselineCacheHit':True,'filteredRuntimeExecuted':True,'imageId':image_id}))
          PY
          test "$(docker image inspect --format '{{.Config.User}}' repoguard/frontend:pr-runtime)" = '101'
          docker image inspect --format '{{.Id}} {{.Config.User}}' repoguard/frontend:pr-runtime > frontend-runtime-identity.txt
          timeout 30s docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint /sbin/apk repoguard/frontend:pr-runtime \
            list --installed musl musl-utils zlib | tee -a frontend-runtime-identity.txt
      - name: Scan frontend runtime image for high and critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
        with:
          scan-type: image
          image-ref: repoguard/frontend:pr-runtime
          scanners: vuln
          format: json
          output: frontend-runtime-trivy.json
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
      - name: Preserve frontend runtime scan evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-runtime-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend-runtime-identity.txt
            frontend-runtime-trivy.json
            frontend-runtime-cache-verification.json
            frontend-runtime-cache.log
            frontend-runtime-refresh.log
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-playwright-failure-${{ github.run_id }}
          path: |
            repoguard-frontend/playwright-report
            repoguard-frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
  backend-integration:
    name: Spring MySQL RabbitMQ integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: repoguard_integration
          MYSQL_USER: repoguard
          MYSQL_PASSWORD: integration-db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      rabbitmq:
        image: rabbitmq:3.13.7@sha256:87178a0ee3e2f52980ba356d38646ed1056705ff2d5ff281f8965456eaa0c1e3
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REPOGUARD_RUN_INTEGRATION_TESTS: 'true'
      REPOGUARD_RUN_PREFLIGHT_INTEGRATION: 'true'
      REPOGUARD_MYSQL_DIAGNOSTICS_PASSWORD: integration-root
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/repoguard_integration?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: repoguard
      SPRING_DATASOURCE_PASSWORD: integration-db
      SPRING_RABBITMQ_HOST: 127.0.0.1
      SPRING_RABBITMQ_PORT: '5672'
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_VIRTUAL_HOST: /
      REPOGUARD_SECURITY_ENCRYPTION_KEY_ID: integration-001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Generate ephemeral integration secrets
        shell: bash
        run: |
          set -euo pipefail
          encryption_key="CI!1-$(openssl rand -hex 32)"
          encryption_salt="$(openssl rand -hex 32)"
          REPOGUARD_AUTH_TOKEN_SECRET=$(openssl rand -hex 32)
          auth_token_secret="${REPOGUARD_AUTH_TOKEN_SECRET}"
          admin_api_key="$(openssl rand -hex 32)"
          for value in "${encryption_key}" "${encryption_salt}" "${auth_token_secret}" "${admin_api_key}"; do
            echo "::add-mask::${value}"
          done
          echo "REPOGUARD_SECURITY_ENCRYPTION_KEY=${encryption_key}" >> "$GITHUB_ENV"
          echo "REPOGUARD_SECURITY_ENCRYPTION_SALT=${encryption_salt}" >> "$GITHUB_ENV"
          echo "REPOGUARD_AUTH_TOKEN_SECRET=${auth_token_secret}" >> "$GITHUB_ENV"
          echo "REPOGUARD_ADMIN_API_KEY=${admin_api_key}" >> "$GITHUB_ENV"
      - name: Run production-like context tests
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=ProductionRuntimeContextIntegrationTest,PreflightPreviewMysqlIntegrationTest,PreflightTransportIntegrationTest,ReviewMemberAssignmentMysqlIntegrationTest test 2>&1

      - name: Run comparison and retention MySQL optimizations
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=ReviewFindingComparisonMysqlIntegrationTest,OperationalRetentionMysqlIntegrationTest test

      - name: Require actual online CLI and assignment integration execution
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          $expectedSuites = @{
            'integration.PreflightPreviewMysqlIntegrationTest' = 5
            'review.PreflightTransportIntegrationTest' = 1
            'integration.ReviewMemberAssignmentMysqlIntegrationTest' = 7
            'review.execution.ReviewFindingComparisonMysqlIntegrationTest' = 3
            'retention.OperationalRetentionMysqlIntegrationTest' = 4
          }
          foreach ($suiteName in $expectedSuites.Keys) {
            [xml]$testReport = Get-Content -LiteralPath "target/surefire-reports/TEST-com.repoguard.agent.$suiteName.xml" -Raw
            $suite = $testReport.testsuite
            if ([int]$suite.tests -ne $expectedSuites[$suiteName] -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
              throw "Integration $suiteName must execute and pass without skipping."
            }
          }

      - name: Upload MySQL optimization evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: optimization-mysql-${{ github.run_id }}
          path: |
            repoguard-backend/target/optimization-acceptance/
            repoguard-backend/target/surefire-reports/*ReviewFindingComparisonMysqlIntegrationTest*
            repoguard-backend/target/surefire-reports/*OperationalRetentionMysqlIntegrationTest*
          if-no-files-found: error
          retention-days: 7

  migration-upgrade:
    name: Flyway supported upgrade path
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: integration-root
          MYSQL_DATABASE: repoguard_upgrade
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pintegration-root --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REPOGUARD_RUN_INTEGRATION_TESTS: 'true'
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/repoguard_upgrade?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: integration-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run supported upgrade path and durable accounting tests
        working-directory: repoguard-backend
        run: ./mvnw -B -Dsurefire.runOrder=alphabetical -Dtest=FlywayMigrationUpgradePathIntegrationTest,LlmUsageBudgetMysqlIntegrationTest,LlmModelSafetyMysqlIntegrationTest,ReviewQueryOptimizationMysqlIntegrationTest,GithubFeedbackMysqlIntegrationTest test

  scheduled-backup-integration:
    name: Linux backup restore, SSE transport and schema rollback
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.linux_backup_integration == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      REPOGUARD_RUN_LINUX_BACKUP_INTEGRATION: 'true'
      REPOGUARD_ROLLBACK_PREVIOUS_SCHEMA_VERSION: '108'
      # Keep the signed d969/V108 rollback baseline; build the upgrade from this exact checkout below.
      REPOGUARD_ROLLBACK_PREVIOUS_IMAGE: ghcr.io/cocojiu/pragent-backend@sha256:59ad1c7d8241f97e5fdff4ee0f517a182999e51d363d71ed294c1c195da7fcfe
      REPOGUARD_ROLLBACK_PREVIOUS_REVISION: d9696dce33c06f072cfc966adeb7e620fcfca769
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Authenticate immutable release image pulls
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build exact checkout backend for schema rollback
        shell: bash
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "${revision}" = "${GITHUB_SHA}"
          (cd repoguard-backend && ./mvnw -B -DskipTests package)
          docker build --build-arg "OCI_REVISION=${revision}" --build-arg "OCI_VERSION=isolated-${GITHUB_RUN_ID}" \
            --iidfile "${RUNNER_TEMP}/rollback-candidate-image.id" -f repoguard-backend/Dockerfile repoguard-backend
          image="$(cat "${RUNNER_TEMP}/rollback-candidate-image.id")"
          [[ "${image}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "REPOGUARD_ROLLBACK_UPGRADE_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "REPOGUARD_ROLLBACK_UPGRADE_REVISION=${revision}" >> "$GITHUB_ENV"
      - name: Run real restore, TLS streaming and runtime rollback checks
        working-directory: repoguard-backend
        run: ./mvnw -B -Dtest=ScheduledMysqlBackupLinuxIntegrationTest,ReviewProgressTransportIntegrationTest,RuntimeSchemaRollbackLinuxIntegrationTest test
      - name: Require actual Linux integration execution
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          $expectedSuites = @{
            ScheduledMysqlBackupLinuxIntegrationTest = 1
            ReviewProgressTransportIntegrationTest = 2
            RuntimeSchemaRollbackLinuxIntegrationTest = 1
          }
          foreach ($suiteName in $expectedSuites.Keys) {
            [xml]$testReport = Get-Content -LiteralPath "target/surefire-reports/TEST-com.repoguard.agent.integration.$suiteName.xml" -Raw
            $suite = $testReport.testsuite
            if ([int]$suite.tests -ne $expectedSuites[$suiteName] -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
              throw "Linux $suiteName must actually execute and pass without skipping."
            }
          }
      - name: Upload bounded test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-backup-linux-${{ github.run_id }}
          path: |
            repoguard-backend/target/surefire-reports/*ScheduledMysqlBackupLinuxIntegrationTest*
            repoguard-backend/target/surefire-reports/*ReviewProgressTransportIntegrationTest*
            repoguard-backend/target/surefire-reports/*RuntimeSchemaRollbackLinuxIntegrationTest*
            repoguard-backend/target/runtime-rollback/
            repoguard-backend/target/publication-maintenance/
          if-no-files-found: warn
          retention-days: 7

  isolated-review-acceptance:
    name: Isolated long review and browser recovery
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.isolated_review_acceptance == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      REPOGUARD_RUN_ISOLATED_REVIEW_ACCEPTANCE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repoguard-frontend/package-lock.json
      - name: Build exact checkout application images without publishing
        shell: bash
        env:
          VITE_REVIEW_PROGRESS_STREAM: 'true'
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          test "${revision}" = "${GITHUB_SHA}"
          (cd repoguard-backend && ./mvnw -B -DskipTests package)
          (cd repoguard-frontend && npm ci && npm run build)
          docker build --build-arg "OCI_REVISION=${revision}" --build-arg "OCI_VERSION=isolated-${GITHUB_RUN_ID}" \
            --iidfile "${RUNNER_TEMP}/acceptance-backend-image.id" -f repoguard-backend/Dockerfile repoguard-backend
          docker build --build-arg "OCI_REVISION=${revision}" --build-arg "OCI_VERSION=isolated-${GITHUB_RUN_ID}" \
            --build-arg REVIEW_PROGRESS_STREAM=true --iidfile "${RUNNER_TEMP}/acceptance-frontend-image.id" \
            -f repoguard-frontend/Dockerfile repoguard-frontend
          backend="$(cat "${RUNNER_TEMP}/acceptance-backend-image.id")"
          frontend="$(cat "${RUNNER_TEMP}/acceptance-frontend-image.id")"
          [[ "${backend}" =~ ^sha256:[a-f0-9]{64}$ && "${frontend}" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "REPOGUARD_ISOLATED_BACKEND_IMAGE=${backend}" >> "$GITHUB_ENV"
          echo "REPOGUARD_ISOLATED_FRONTEND_IMAGE=${frontend}" >> "$GITHUB_ENV"
          echo "REPOGUARD_ISOLATED_REVISION=${revision}" >> "$GITHUB_ENV"
      - name: Install isolated Chromium test runtime
        working-directory: repoguard-backend
        run: ./mvnw -B test-compile org.codehaus.mojo:exec-maven-plugin:3.6.3:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.classpathScope=test -Dexec.args="install --with-deps chromium"
      - name: Run real application acceptance in headed Chromium
        working-directory: repoguard-backend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: xvfb-run --auto-servernum ./mvnw -B -Dtest=IsolatedReviewAcceptanceLinuxIntegrationTest test
      - name: Require all acceptance scenarios without skips
        shell: pwsh
        working-directory: repoguard-backend
        run: |
          [xml]$report = Get-Content -LiteralPath target/surefire-reports/TEST-com.repoguard.agent.integration.IsolatedReviewAcceptanceLinuxIntegrationTest.xml -Raw
          $suite = $report.testsuite
          if ([int]$suite.tests -ne 4 -or [int]$suite.skipped -ne 0 -or [int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) {
            throw "Isolated review acceptance must execute all four scenarios without skipping."
          }
      - name: Upload bounded acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-review-acceptance-${{ github.run_id }}
          path: |
            repoguard-backend/target/surefire-reports/*IsolatedReviewAcceptanceLinuxIntegrationTest*
            repoguard-backend/target/isolated-review-acceptance/
          if-no-files-found: warn
          retention-days: 7

  mysql-physical-recovery:
    name: Linux MySQL encrypted physical recovery
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exercise actual local clone, encryption and isolated native-type recovery
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, secrets, shutil, subprocess, sys, time, uuid
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          spec = importlib.util.spec_from_file_location('mysql_backup', 'scripts/mysql-physical-backup.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          owner = 'ci-mysql-clone-' + uuid.uuid4().hex
          label = 'com.repoguard.mysql-clone-ci-owner'
          root = pathlib.Path('/opt/repoguard/backups')
          # Provision the disposable runner as a protected host. Never relax runtime key checks.
          for parent in (pathlib.Path('/opt'), root.parent, root):
              parent.mkdir(exist_ok=True, mode=0o700)
              assert parent.is_dir() and not parent.is_symlink() and parent.resolve() == parent
              print(json.dumps({'fixtureParent': str(parent), 'uidBefore': parent.stat().st_uid,
                  'modeBefore': oct(parent.stat().st_mode & 0o777)}), flush=True)
              os.chown(parent, 0, 0); parent.chmod(0o755 if parent == pathlib.Path('/opt') else 0o700)
          home = root / owner; home.mkdir(mode=0o700)
          password = secrets.token_hex(32).encode()
          key = home / 'key'; key.write_text(secrets.token_hex(32)); key.chmod(0o600)
          auth = home / 'password'; auth.write_bytes(password); auth.chmod(0o600)
          source = owner + '-source'; volume = owner + '-data'; recipient = owner + '-audit'
          image = 'mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b'
          created = []; audit_id = None; result = {}; volume_created = False
          evidence = {'productionConnections': 0, 'publishedPorts': 0, 'modelCalls': 0, 'state': 'failed'}
          try:
              m.docker('pull', image, timeout=240)
              m.docker('volume', 'create', '--label', label + '=' + owner, volume)
              volume_created = True
              m.docker('run', '--detach', '--name', source, '--label', label + '=' + owner,
                  '--network', 'none', '--restart', 'no', '--memory', '512m', '--memory-swap', '512m',
                  '--env', 'MYSQL_ROOT_PASSWORD_FILE=/run/root-password', '--env', 'MYSQL_DATABASE=clone_fixture',
                  '--mount', 'type=bind,src=' + str(auth) + ',dst=/run/root-password,readonly',
                  '--volume', volume + ':/var/lib/mysql', image, '--innodb-buffer-pool-size=64M',
                  '--max-connections=8', '--mysqlx=OFF', timeout=60)
              created.append(source)
              deadline = time.monotonic() + 150
              while True:
                  try:
                      if m.docker('exec', source, 'cat', '/proc/1/comm').strip() == b'mysqld' and m.query(source, password, 'SELECT 1;') == '1':
                          break
                  except ValueError:
                      pass
                  assert time.monotonic() < deadline, 'source_readiness_timeout'
                  time.sleep(1)
              m.query(source, password, '''INSTALL PLUGIN clone SONAME 'mysql_clone.so';
              CREATE TABLE clone_fixture.types(id INT PRIMARY KEY, doc JSON) ENGINE=InnoDB;
              INSERT INTO clone_fixture.types VALUES
              (1,'[9088544342.689998]'),
              (2,JSON_OBJECT('x',1.4334335999999999e0)),
              (3,JSON_OBJECT('x',CAST('1.2' AS DECIMAL(10,1)))),
              (4,JSON_OBJECT('x',CAST('2026-01-02' AS DATE))),
              (5,JSON_OBJECT('x',CAST('2026-01-02 12:34:56.123456' AS DATETIME(6))));
              CREATE TABLE clone_fixture.no_pk(v VARCHAR(10), n INT) ENGINE=InnoDB;
              INSERT INTO clone_fixture.no_pk VALUES('dup',1),('dup',1),(NULL,2);''')
              sql = "SELECT id,HEX(CAST(doc AS CHAR)),JSON_TYPE(doc),JSON_TYPE(JSON_EXTRACT(doc,'$.x')) FROM clone_fixture.types ORDER BY id;"
              expected = m.query(source, password, sql)
              before = m.inspect(source)
              result = m.run(source, 'clone_fixture', home / 'backup', key)
              evidence.update(failurePhase=result.get('phase'), failureReason=result.get('reason'))
              assert result['restoreVerified'] and result['physicalFilesVerified'] and result['ownedResourcesCleaned'], result.get('reason')
              assert result['restored'] == {'tables': 2, 'rows': 8}
              assert m.inspect(source)['state']['StartedAt'] == before['state']['StartedAt']
              # Independent second recovery reads only the encrypted artifact and its protected receipt.
              restored = home / 'independent'; restored.mkdir(mode=0o700)
              receipt = m.snapshot.restore_snapshot(result['archive'], {'mysql': restored}, key, m.PROFILE)
              assert receipt['restoreVerified']
              audit_id = m.docker('create', '--name', recipient, '--label', label + '=' + owner,
                  '--network', 'none', '--memory', '384m', '--memory-swap', '384m', '--cpus', '0.50',
                  '--user', 'mysql', '--mount', 'type=bind,src=' + str(restored) + ',dst=/var/lib/mysql',
                  '--entrypoint', 'mysqld', result['imageId'], '--skip-networking', '--mysqlx=OFF',
                  '--skip-log-bin', '--skip-replica-start', '--event-scheduler=OFF',
                  '--innodb-buffer-pool-size=64M', '--performance-schema=OFF').decode().strip()
              created.append(audit_id); m.docker('start', audit_id)
              deadline = time.monotonic() + 120
              while True:
                  try:
                      actual = m.query(audit_id, password, sql)
                      break
                  except ValueError:
                      assert time.monotonic() < deadline, 'audit_readiness_timeout'
                      time.sleep(1)
              assert actual == expected, 'native_json_type_or_value_changed'
              assert m.query(audit_id, password, 'SELECT COUNT(*) FROM clone_fixture.no_pk;') == '3'
              m.query(source, password, "INSERT INTO clone_fixture.no_pk VALUES('later',3);")
              assert m.query(audit_id, password, 'SELECT COUNT(*) FROM clone_fixture.no_pk;') == '3'
              assert m.query(source, password, 'SELECT COUNT(*) FROM clone_fixture.no_pk;') == '4'
              assert m.inspect(audit_id)['network'] == 'none'
              # Damaged ciphertext must fail before a decryption process or SQL is started.
              damaged = home / 'damaged.enc'; raw = pathlib.Path(result['archive']['archive']).read_bytes()
              damaged.write_bytes(raw[:-1] + bytes([raw[-1] ^ 1]))
              destination = home / 'reject'; destination.mkdir(mode=0o700)
              try:
                  m.snapshot.restore_snapshot(dict(result['archive'], archive=str(damaged)), {'mysql': destination}, key, m.PROFILE)
              except ValueError as error:
                  assert str(error) == 'snapshot_checksum_mismatch'
              else:
                  raise AssertionError('damaged_archive_accepted')
              assert not any(destination.iterdir())
              evidence.update(state='verified', nativeJsonTypesPreserved=True, numericValuesPreserved=True,
                  duplicateRowsPreserved=True, donorRemainedOnline=True, snapshotIndependent=True,
                  encryptedPhysicalFilesVerified=True, corruptedCiphertextRejected=True,
                  mysqlVersion=result['mysqlVersion'], imageId=result['imageId'], tables=2, rows=8)
          finally:
              for container in reversed(created):
                  value = m.inspect(container)
                  assert value['labels'].get(label) == owner
                  m.docker('rm', '--force', value['id'])
              if volume_created:
                  volumes = json.loads(m.docker('volume', 'inspect', volume))
                  assert len(volumes) == 1 and volumes[0]['Labels'].get(label) == owner
                  m.docker('volume', 'rm', volume)
              # An unknown wrapper-created resource must remain visible as a failed cleanup.
              if result.get('owner'):
                  assert not m.docker('ps', '--all', '--quiet', '--filter', 'label=' + m.LABEL + '=' + result['owner']).strip()
              evidence['ownedResourcesCleaned'] = True
              output = pathlib.Path('repoguard-backend/target/mysql-physical-recovery.json')
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(evidence, indent=2) + '\n'); output.chmod(0o644)
              shutil.rmtree(home)
          PY
      - name: Preserve aggregate physical recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mysql-physical-recovery-${{ github.run_id }}
          path: repoguard-backend/target/mysql-physical-recovery.json
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
