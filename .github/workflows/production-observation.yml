name: Production Availability

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Inject one synthetic failure to test alert creation and recovery
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: production-availability
  cancel-in-progress: true

env:
  PRODUCTION_BASE_URL: https://pragent.top
  ALERT_ISSUE_TITLE: "[生产告警] RepoGuard 可用性检查失败"
  SIMULATE_FAILURE: ${{ inputs.simulate_failure }}

jobs:
  observe:
    name: Probe production endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe production endpoints
        id: probe
        shell: bash
        run: |
          set -uo pipefail

          report_path="${RUNNER_TEMP}/production-availability-report.txt"
          : > "${report_path}"
          failures=0
          checked_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          probe_endpoint() {
            local label="$1"
            local path="$2"
            local expected_code="$3"
            local body_rule="$4"
            local cache_rule="$5"
            local body_file header_file metrics curl_exit
            local status_code remote_ip dns_time connect_time ttfb total_time
            local x_cache age health_status result detail

            body_file="$(mktemp "${RUNNER_TEMP}/repoguard-body.XXXXXX")"
            header_file="$(mktemp "${RUNNER_TEMP}/repoguard-headers.XXXXXX")"
            health_status="-"
            result="PASS"
            detail="ok"

            if metrics="$(curl --silent --show-error \
              --retry 2 --retry-delay 3 --retry-all-errors \
              --connect-timeout 8 --max-time 20 \
              --output "${body_file}" --dump-header "${header_file}" \
              --write-out '%{http_code}|%{remote_ip}|%{time_namelookup}|%{time_connect}|%{time_starttransfer}|%{time_total}' \
              "${PRODUCTION_BASE_URL}${path}")"; then
              IFS='|' read -r status_code remote_ip dns_time connect_time ttfb total_time <<<"${metrics}"
            else
              curl_exit=$?
              status_code="000"
              remote_ip="-"
              dns_time="-"
              connect_time="-"
              ttfb="-"
              total_time="-"
              result="FAIL"
              detail="curl_exit=${curl_exit}"
            fi

            x_cache="$(awk 'tolower($0) ~ /^x-cache:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub("\\r", ""); value=$0 } END { print value }' "${header_file}")"
            age="$(awk 'tolower($0) ~ /^age:/ { sub(/^[^:]*:[[:space:]]*/, ""); gsub("\\r", ""); value=$0 } END { print value }' "${header_file}")"
            x_cache="${x_cache:--}"
            age="${age:--}"

            if [[ "${result}" == "PASS" && "${status_code}" != "${expected_code}" ]]; then
              result="FAIL"
              detail="expected_http=${expected_code}"
            fi

            if [[ "${result}" == "PASS" && "${body_rule}" == "health_up" ]]; then
              health_status="$(jq -r '.status // empty' "${body_file}" 2>/dev/null || true)"
              if [[ "${health_status}" != "UP" ]]; then
                result="FAIL"
                detail="health_status=${health_status:-missing}"
              fi
            fi

            if [[ "${result}" == "PASS" && "${cache_rule}" == "dynamic" && "${x_cache}" =~ (^|[[:space:],])(HIT|TCP_HIT|MEM_HIT)($|[[:space:],]) ]]; then
              result="FAIL"
              detail="protected_endpoint_cached=${x_cache}"
            fi

            if [[ "${result}" == "FAIL" ]]; then
              failures=$((failures + 1))
            fi

            printf '%s label=%q path=%q http=%s health=%s ip=%s dns=%s connect=%s ttfb=%s total=%s x_cache=%q age=%q detail=%q\n' \
              "${result}" "${label}" "${path}" "${status_code}" "${health_status:--}" "${remote_ip}" \
              "${dns_time}" "${connect_time}" "${ttfb}" "${total_time}" "${x_cache}" "${age}" "${detail}" \
              >> "${report_path}"

            rm -f "${body_file}" "${header_file}"
          }

          probe_endpoint "liveness" "/actuator/health/liveness" "200" "health_up" "dynamic"
          probe_endpoint "readiness" "/actuator/health/readiness" "200" "health_up" "dynamic"
          probe_endpoint "home" "/" "200" "none" "page"
          probe_endpoint "login" "/login" "200" "none" "page"
          probe_endpoint "overview" "/repoguard/overview" "200" "none" "page"
          probe_endpoint "anonymous-auth" "/api/v1/auth/me" "401" "none" "dynamic"

          if [[ "${SIMULATE_FAILURE:-false}" == "true" ]]; then
            failures=$((failures + 1))
            echo "FAIL label=synthetic-drill path=- http=- health=- ip=- dns=- connect=- ttfb=- total=- x_cache=- age=- detail=manual_workflow_dispatch" \
              >> "${report_path}"
          fi

          if (( failures == 0 )); then
            healthy="true"
            result_label="PASS"
          else
            healthy="false"
            result_label="FAIL (${failures} endpoint(s))"
          fi

          {
            echo "## Production availability"
            echo
            echo "- Checked at: ${checked_at}"
            echo "- Base URL: ${PRODUCTION_BASE_URL}"
            echo "- Synthetic failure: ${SIMULATE_FAILURE:-false}"
            echo "- Result: ${result_label}"
            echo
            echo '```text'
            cat "${report_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "healthy=${healthy}" >> "${GITHUB_OUTPUT}"
          echo "report_path=${report_path}" >> "${GITHUB_OUTPUT}"

      - name: Manage availability alert issue
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROBE_HEALTHY: ${{ steps.probe.outputs.healthy }}
          PROBE_REPORT_PATH: ${{ steps.probe.outputs.report_path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");
            const title = process.env.ALERT_ISSUE_TITLE;
            const healthy = process.env.PROBE_HEALTHY === "true";
            const runUrl = process.env.RUN_URL;
            const reportPath = process.env.PROBE_REPORT_PATH;
            const report = reportPath && fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, "utf8").trim()
              : "Probe did not produce a diagnostic report.";
            const synthetic = report.includes("label=synthetic-drill");
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const alert = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (healthy) {
              if (alert) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: alert.number,
                  body: `✅ 生产端点已恢复。\n\n[查看恢复检查](${runUrl})`,
                });
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: alert.number,
                  state: "closed",
                  state_reason: "completed",
                });
              }
              core.info("Production endpoints are healthy.");
              return;
            }

            const body = [
              synthetic
                ? "这是一次手动告警演练，不代表生产服务故障。恢复检查会自动关闭此 Issue。"
                : "RepoGuard 定时生产可用性检查失败。持续故障只更新此 Issue，恢复后会自动关闭。",
              "",
              `- 类型：${synthetic ? "手动演练" : "真实探测失败"}`,
              `- 检测时间：${new Date().toISOString()}`,
              `- 运行日志：[GitHub Actions](${runUrl})`,
              "",
              "```text",
              report,
              "```",
            ].join("\n");

            if (alert) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: alert.number,
                body,
                assignees: [owner],
              });
              core.warning(`Updated existing alert issue #${alert.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: [owner],
              });
              core.warning(`Created alert issue #${created.data.number}.`);
            }

      - name: Fail unhealthy observation
        if: steps.probe.outputs.healthy != 'true'
        shell: bash
        run: |
          echo "Production availability probe failed. See the step summary and alert issue." >&2
          exit 1
