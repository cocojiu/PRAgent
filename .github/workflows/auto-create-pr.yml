name: Auto Create Pull Request

on:
  push:
    branches:
      - PRAgent-test

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-create-pr:
    runs-on: ubuntu-latest
    if: github.ref_name == 'PRAgent-test'
    steps:
      - name: Create or reuse pull request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'main';

            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 1
            });

            if (existing.data.length > 0) {
              core.info(`Open PR already exists: #${existing.data[0].number}`);
              return;
            }

            const response = await github.rest.pulls.create({
              owner,
              repo,
              title: `Auto PR: ${head}`,
              head,
              base,
              draft: false,
              body: [
                'Created automatically after PRAgent-test branch push.',
                '',
                'RepoGuard will start review from the pull_request webhook.'
              ].join('\n')
            });

            core.info(`Created PR #${response.data.number}`);
