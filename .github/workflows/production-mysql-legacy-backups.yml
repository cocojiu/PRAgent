name: Production MySQL Legacy Backup Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inventory/encrypt legacy backups, or perform the approved one-time admin reset
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - encrypt
          - reset-admin-password

permissions:
  contents: read

concurrency:
  group: production-mysql-backup
  cancel-in-progress: false

jobs:
  legacy-backups:
    name: Inventory or encrypt legacy plaintext backups
    if: ${{ inputs.operation != 'reset-admin-password' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        uses: ./.github/actions/bootstrap-production-ssh
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          deploy-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Upload legacy backup operation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -m 700 -d '${DEPLOY_PATH}/scripts'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            scripts/migrate-legacy-mysql-backups.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/migrate-legacy-mysql-backups.sh"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/migrate-legacy-mysql-backups.sh'"

      - name: Inventory or encrypt legacy backups
        id: migrate
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.REPOGUARD_BACKUP_ENCRYPTION_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            inventory | encrypt)
              ;;
            *)
              echo "operation must resolve to inventory or encrypt." >&2
              exit 1
              ;;
          esac

          result_file="${RUNNER_TEMP}/legacy-mysql-backup-result.txt"
          if [[ "${OPERATION}" == "encrypt" ]]; then
            test -n "${BACKUP_ENCRYPTION_PASSWORD}" || {
              echo "Missing REPOGUARD_BACKUP_ENCRYPTION_PASSWORD secret." >&2
              exit 1
            }
            echo "::add-mask::${BACKUP_ENCRYPTION_PASSWORD}"
            printf '%s\n' "${BACKUP_ENCRYPTION_PASSWORD}" \
              | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "cd '${DEPLOY_PATH}' && \
                   MODE='encrypt' \
                   bash scripts/migrate-legacy-mysql-backups.sh --password-stdin" \
              | tee "${result_file}"
          else
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && \
               MODE='inventory' \
               bash scripts/migrate-legacy-mysql-backups.sh" \
              | tee "${result_file}"
          fi

          actual_operation="$(awk -F= '$1 == "OPERATION" { print $2 }' "${result_file}")"
          [[ "${actual_operation}" == "${OPERATION}" ]] || {
            echo "Legacy backup operation result did not match the request." >&2
            exit 1
          }

          legacy_count="$(awk -F= '$1 == "LEGACY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          [[ "${legacy_count}" =~ ^[0-9]+$ ]] || {
            echo "Legacy backup count was not numeric." >&2
            exit 1
          }

          empty_count="$(awk -F= '$1 == "EMPTY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          migratable_count="$(awk -F= '$1 == "MIGRATABLE_BACKUP_COUNT" { print $2 }' "${result_file}")"
          [[ "${empty_count}" =~ ^[0-9]+$ && "${migratable_count}" =~ ^[0-9]+$ ]] || {
            echo "Legacy backup classification counts were not numeric." >&2
            exit 1
          }
          classified_count=$((empty_count + migratable_count))
          [[ "${classified_count}" == "${legacy_count}" ]] || {
            echo "Legacy backup classification did not cover every file." >&2
            exit 1
          }

          plaintext_deleted="$(awk -F= '$1 == "PLAINTEXT_DELETED" { print $2 }' "${result_file}")"
          [[ "${plaintext_deleted}" == "false" ]] || {
            echo "The operation must not delete plaintext backups." >&2
            exit 1
          }

          if [[ "${OPERATION}" == "encrypt" ]]; then
            encrypted_count="$(awk -F= '$1 == "ENCRYPTED_BACKUP_COUNT" { print $2 }' "${result_file}")"
            verified_count="$(awk -F= '$1 == "ROUNDTRIP_VERIFIED_COUNT" { print $2 }' "${result_file}")"
            [[ "${encrypted_count}" == "${migratable_count}" \
              && "${verified_count}" == "${migratable_count}" ]] || {
              echo "Not every nonempty legacy backup has a verified encrypted copy." >&2
              exit 1
            }
          fi

      - name: Write sanitized migration summary
        if: always()
        shell: bash
        run: |
          result_file="${RUNNER_TEMP}/legacy-mysql-backup-result.txt"
          {
            echo "## Production MySQL legacy backups"
            echo
            if [[ ! -s "${result_file}" ]]; then
              echo "The operation did not produce a sanitized result."
              exit 0
            fi

            while IFS='=' read -r key value; do
              case "${key}" in
                OPERATION)
                  echo "- Operation: \`${value}\`"
                  ;;
                INVENTORY_TIMESTAMP_UTC)
                  echo "- Inventory timestamp (UTC): \`${value}\`"
                  ;;
                LEGACY_BACKUP_COUNT)
                  echo "- Plaintext backups: \`${value}\`"
                  ;;
                EMPTY_BACKUP_COUNT)
                  echo "- Empty plaintext files: \`${value}\`"
                  ;;
                MIGRATABLE_BACKUP_COUNT)
                  echo "- Nonempty backups eligible for encryption: \`${value}\`"
                  ;;
                TOTAL_SOURCE_BYTES)
                  echo "- Total plaintext bytes: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_PATH)
                  echo
                  echo "### \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_BYTES)
                  echo "- Plaintext bytes: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_MTIME_UTC)
                  echo "- Last modified (UTC): \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_SHA256)
                  echo "- Plaintext SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_CLASSIFICATION)
                  echo "- Classification: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_PATH)
                  echo "- Encrypted copy: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_BYTES)
                  echo "- Encrypted bytes: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_SHA256)
                  echo "- Encrypted SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_MIGRATION_STATUS)
                  echo "- Migration status: \`${value}\`"
                  ;;
                LEGACY_*_ROUNDTRIP_VERIFIED)
                  echo "- Exact round trip verified: \`${value}\`"
                  ;;
                KEY_FINGERPRINT)
                  echo "- Key fingerprint: \`${value}\`"
                  ;;
                ENCRYPTED_BACKUP_COUNT)
                  echo "- Verified encrypted copies: \`${value}\`"
                  ;;
                ROUNDTRIP_VERIFIED_COUNT)
                  echo "- Exact round trips verified: \`${value}\`"
                  ;;
                PLAINTEXT_DELETED)
                  echo "- Plaintext deleted: \`${value}\`"
                  ;;
              esac
            done <"${result_file}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify production health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            https://pragent.top/actuator/health/readiness)"
          status="$(jq -r '.status // empty' <<<"${health}")"
          [[ "${status}" == "UP" ]] || {
            echo "Production health is not UP after legacy backup operation." >&2
            exit 1
          }

  reset-admin-password:
    name: Reset production admin password
    if: ${{ inputs.operation == 'reset-admin-password' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare SSH key
        uses: ./.github/actions/bootstrap-production-ssh
        with:
          deploy-host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          deploy-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Validate reset request and generate BCrypt hash
        id: credential
        shell: bash
        env:
          RESET_PASSWORD: ${{ secrets.REPOGUARD_ADMIN_PASSWORD_RESET }}
        run: |
          set -euo pipefail
          test -n "${RESET_PASSWORD}" || {
            echo "Missing production secret REPOGUARD_ADMIN_PASSWORD_RESET" >&2
            exit 2
          }
          test "${#RESET_PASSWORD}" -ge 8 || {
            echo "Reset password must contain at least 8 characters" >&2
            exit 2
          }
          [[ "${RESET_PASSWORD}" =~ [A-Za-z] ]] && [[ "${RESET_PASSWORD}" =~ [0-9] ]] || {
            echo "Reset password must contain both letters and digits" >&2
            exit 2
          }

          if ! command -v htpasswd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends apache2-utils >/dev/null
          fi
          password_hash="$(htpasswd -bnBC 12 '' "${RESET_PASSWORD}" | tr -d ':\n')"
          [[ "${password_hash}" =~ ^\$2[aby]\$12\$[./A-Za-z0-9]{53}$ ]] || {
            echo "Generated password hash is invalid" >&2
            exit 1
          }
          echo "::add-mask::${password_hash}"
          echo "password_hash=${password_hash}" >> "${GITHUB_OUTPUT}"

      - name: Rotate admin password and revoke active refresh tokens
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          PASSWORD_HASH: ${{ steps.credential.outputs.password_hash }}
        run: |
          set -euo pipefail
          account=admin
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH" >&2; exit 2; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER" >&2; exit 2; }
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*) ;;
            *) echo "DEPLOY_PATH must stay under /opt/repoguard" >&2; exit 2 ;;
          esac

          printf -v reset_args ' %q' "${DEPLOY_PATH}" "${account}" "${PASSWORD_HASH}"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "bash -s --${reset_args}" <<'REMOTE_RESET'
          set -euo pipefail
          deploy_path="$1"
          account="$2"
          password_hash="$3"
          [[ "${account}" == "admin" ]] || exit 2
          [[ "${password_hash}" =~ ^\$2[aby]\$12\$[./A-Za-z0-9]{53}$ ]] || exit 2

          cd "${deploy_path}"
          mysql_container="$(docker compose --env-file .env -f docker-compose.prod.yml ps -q mysql)"
          test -n "${mysql_container}" || {
            echo "Production MySQL container is unavailable" >&2
            exit 1
          }

          changed="$({
            docker exec \
              --env "RESET_ACCOUNT=${account}" \
              --env "RESET_PASSWORD_HASH=${password_hash}" \
              "${mysql_container}" sh -lc '
                set -eu
                if [ -n "${MYSQL_ROOT_PASSWORD:-}" ]; then
                  root_password="${MYSQL_ROOT_PASSWORD}"
                elif [ -n "${MYSQL_ROOT_PASSWORD_FILE:-}" ] && [ -r "${MYSQL_ROOT_PASSWORD_FILE}" ]; then
                  root_password="$(cat "${MYSQL_ROOT_PASSWORD_FILE}")"
                else
                  echo "MySQL root password source is unavailable" >&2
                  exit 64
                fi
                sql="START TRANSACTION;
                  UPDATE user_account
                  SET password_hash='\''${RESET_PASSWORD_HASH}'\'',
                      session_version=COALESCE(session_version, 0) + 1,
                      failed_login_count=0,
                      locked_until=NULL,
                      updated_at=NOW()
                  WHERE username='\''${RESET_ACCOUNT}'\''
                    AND status='\''ACTIVE'\''
                    AND role IN ('\''ADMIN'\'', '\''PLATFORM_ADMIN'\'');
                  SET @changed=ROW_COUNT();
                  UPDATE user_refresh_token
                  SET status='\''REVOKED'\'', revoked_at=NOW(), updated_at=NOW()
                  WHERE user_id=(SELECT id FROM user_account WHERE username='\''${RESET_ACCOUNT}'\'' LIMIT 1)
                    AND status='\''ACTIVE'\'';
                  COMMIT;
                  SELECT @changed;"
                MYSQL_PWD="${root_password}" exec mysql \
                  --batch --skip-column-names --user=root "${MYSQL_DATABASE}" --execute="${sql}"
              '
          } | tail -n 1)"
          test "${changed}" = "1" || {
            echo "The active admin account was not reset" >&2
            exit 1
          }
          echo "Password reset completed for the active admin account."
          REMOTE_RESET

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            https://pragent.top/actuator/health/readiness)"
          status="$(jq -r '.status // empty' <<<"${health}")"
          [[ "${status}" == "UP" ]] || {
            echo "Production health is not UP after admin password reset" >&2
            exit 1
          }
