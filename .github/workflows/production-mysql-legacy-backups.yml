name: Production MySQL Legacy Backup Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inventory plaintext SQL backups or create and verify encrypted copies
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - encrypt

permissions:
  contents: read

concurrency:
  group: production-mysql-backup
  cancel-in-progress: false

jobs:
  legacy-backups:
    name: Inventory or encrypt legacy plaintext backups
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST secret or variable"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }

          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]* | "")
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying." >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Upload legacy backup operation
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER secret or variable"; exit 1; }
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH secret or variable"; exit 1; }
          case "${DEPLOY_USER}" in
            *[!A-Za-z0-9_.-]*)
              echo "DEPLOY_USER contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            *[!A-Za-z0-9_./-]*)
              echo "DEPLOY_PATH contains unsupported characters." >&2
              exit 1
              ;;
          esac
          case "${DEPLOY_PATH}" in
            /opt/repoguard | /opt/repoguard/*)
              ;;
            *)
              echo "DEPLOY_PATH must stay under /opt/repoguard." >&2
              exit 1
              ;;
          esac

          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "install -m 700 -d '${DEPLOY_PATH}/scripts'"
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            scripts/migrate-legacy-mysql-backups.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/scripts/migrate-legacy-mysql-backups.sh"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod 0700 '${DEPLOY_PATH}/scripts/migrate-legacy-mysql-backups.sh'"

      - name: Inventory or encrypt legacy backups
        id: migrate
        shell: bash
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.REPOGUARD_BACKUP_ENCRYPTION_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            inventory | encrypt)
              ;;
            *)
              echo "operation must resolve to inventory or encrypt." >&2
              exit 1
              ;;
          esac

          result_file="${RUNNER_TEMP}/legacy-mysql-backup-result.txt"
          if [[ "${OPERATION}" == "encrypt" ]]; then
            test -n "${BACKUP_ENCRYPTION_PASSWORD}" || {
              echo "Missing REPOGUARD_BACKUP_ENCRYPTION_PASSWORD secret." >&2
              exit 1
            }
            echo "::add-mask::${BACKUP_ENCRYPTION_PASSWORD}"
            printf '%s\n' "${BACKUP_ENCRYPTION_PASSWORD}" \
              | ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
                  "cd '${DEPLOY_PATH}' && \
                   MODE='encrypt' \
                   bash scripts/migrate-legacy-mysql-backups.sh --password-stdin" \
              | tee "${result_file}"
          else
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "cd '${DEPLOY_PATH}' && \
               MODE='inventory' \
               bash scripts/migrate-legacy-mysql-backups.sh" \
              | tee "${result_file}"
          fi

          actual_operation="$(awk -F= '$1 == "OPERATION" { print $2 }' "${result_file}")"
          [[ "${actual_operation}" == "${OPERATION}" ]] || {
            echo "Legacy backup operation result did not match the request." >&2
            exit 1
          }

          legacy_count="$(awk -F= '$1 == "LEGACY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          [[ "${legacy_count}" =~ ^[0-9]+$ ]] || {
            echo "Legacy backup count was not numeric." >&2
            exit 1
          }

          empty_count="$(awk -F= '$1 == "EMPTY_BACKUP_COUNT" { print $2 }' "${result_file}")"
          migratable_count="$(awk -F= '$1 == "MIGRATABLE_BACKUP_COUNT" { print $2 }' "${result_file}")"
          [[ "${empty_count}" =~ ^[0-9]+$ && "${migratable_count}" =~ ^[0-9]+$ ]] || {
            echo "Legacy backup classification counts were not numeric." >&2
            exit 1
          }
          classified_count=$((empty_count + migratable_count))
          [[ "${classified_count}" == "${legacy_count}" ]] || {
            echo "Legacy backup classification did not cover every file." >&2
            exit 1
          }

          plaintext_deleted="$(awk -F= '$1 == "PLAINTEXT_DELETED" { print $2 }' "${result_file}")"
          [[ "${plaintext_deleted}" == "false" ]] || {
            echo "The operation must not delete plaintext backups." >&2
            exit 1
          }

          if [[ "${OPERATION}" == "encrypt" ]]; then
            encrypted_count="$(awk -F= '$1 == "ENCRYPTED_BACKUP_COUNT" { print $2 }' "${result_file}")"
            verified_count="$(awk -F= '$1 == "ROUNDTRIP_VERIFIED_COUNT" { print $2 }' "${result_file}")"
            [[ "${encrypted_count}" == "${migratable_count}" \
              && "${verified_count}" == "${migratable_count}" ]] || {
              echo "Not every nonempty legacy backup has a verified encrypted copy." >&2
              exit 1
            }
          fi

      - name: Write sanitized migration summary
        if: always()
        shell: bash
        run: |
          result_file="${RUNNER_TEMP}/legacy-mysql-backup-result.txt"
          {
            echo "## Production MySQL legacy backups"
            echo
            if [[ ! -s "${result_file}" ]]; then
              echo "The operation did not produce a sanitized result."
              exit 0
            fi

            while IFS='=' read -r key value; do
              case "${key}" in
                OPERATION)
                  echo "- Operation: \`${value}\`"
                  ;;
                INVENTORY_TIMESTAMP_UTC)
                  echo "- Inventory timestamp (UTC): \`${value}\`"
                  ;;
                LEGACY_BACKUP_COUNT)
                  echo "- Plaintext backups: \`${value}\`"
                  ;;
                EMPTY_BACKUP_COUNT)
                  echo "- Empty plaintext files: \`${value}\`"
                  ;;
                MIGRATABLE_BACKUP_COUNT)
                  echo "- Nonempty backups eligible for encryption: \`${value}\`"
                  ;;
                TOTAL_SOURCE_BYTES)
                  echo "- Total plaintext bytes: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_PATH)
                  echo
                  echo "### \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_BYTES)
                  echo "- Plaintext bytes: \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_MTIME_UTC)
                  echo "- Last modified (UTC): \`${value}\`"
                  ;;
                LEGACY_*_SOURCE_SHA256)
                  echo "- Plaintext SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_CLASSIFICATION)
                  echo "- Classification: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_PATH)
                  echo "- Encrypted copy: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_BYTES)
                  echo "- Encrypted bytes: \`${value}\`"
                  ;;
                LEGACY_*_ENCRYPTED_SHA256)
                  echo "- Encrypted SHA-256: \`${value}\`"
                  ;;
                LEGACY_*_MIGRATION_STATUS)
                  echo "- Migration status: \`${value}\`"
                  ;;
                LEGACY_*_ROUNDTRIP_VERIFIED)
                  echo "- Exact round trip verified: \`${value}\`"
                  ;;
                KEY_FINGERPRINT)
                  echo "- Key fingerprint: \`${value}\`"
                  ;;
                ENCRYPTED_BACKUP_COUNT)
                  echo "- Verified encrypted copies: \`${value}\`"
                  ;;
                ROUNDTRIP_VERIFIED_COUNT)
                  echo "- Exact round trips verified: \`${value}\`"
                  ;;
                PLAINTEXT_DELETED)
                  echo "- Plaintext deleted: \`${value}\`"
                  ;;
              esac
            done <"${result_file}"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Verify production health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 8 --max-time 20 \
            https://pragent.top/actuator/health/readiness)"
          status="$(jq -r '.status // empty' <<<"${health}")"
          [[ "${status}" == "UP" ]] || {
            echo "Production health is not UP after legacy backup operation." >&2
            exit 1
          }
