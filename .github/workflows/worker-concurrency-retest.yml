name: Worker Concurrency Retest

on:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Review Worker concurrency under test
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "4"
      start_pr_number:
        description: First unique PR number used by this run
        required: true
        type: string
      task_count:
        description: Number of unique Mock review tasks
        required: true
        default: "12"
        type: string

permissions:
  contents: read

jobs:
  retest:
    name: Retest Worker concurrency
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "${DEPLOY_HOST}" || { echo "Missing DEPLOY_HOST"; exit 1; }
          test -n "${DEPLOY_SSH_KEY}" || { echo "Missing DEPLOY_SSH_KEY"; exit 1; }
          deploy_port="${DEPLOY_PORT:-22}"
          case "${deploy_port}" in
            *[!0-9]*)
              echo "DEPLOY_PORT must be a numeric TCP port." >&2
              exit 1
              ;;
          esac
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Scanning SSH host key for deployment target..."
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 30 -p "${deploy_port}" "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>ssh-keyscan.err; then
              break
            fi
            echo "ssh-keyscan attempt ${attempt}/5 failed; retrying after $((attempt * 10)) seconds..." >&2
            sed 's/^/ssh-keyscan: /' ssh-keyscan.err >&2
            sleep $((attempt * 10))
          done
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan returned no host keys."; exit 1; }

      - name: Verify remote retest assets
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          test -n "${DEPLOY_PATH}" || { echo "Missing DEPLOY_PATH"; exit 1; }
          test -n "${DEPLOY_USER}" || { echo "Missing DEPLOY_USER"; exit 1; }
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "test -x '${DEPLOY_PATH}/performance/set-review-worker-concurrency.sh' || {
               echo 'Missing executable remote helper: ${DEPLOY_PATH}/performance/set-review-worker-concurrency.sh' >&2
               exit 1
             }
             test -x '${DEPLOY_PATH}/performance/verify-worker-comparison.sh' || {
               echo 'Missing executable remote helper: ${DEPLOY_PATH}/performance/verify-worker-comparison.sh' >&2
               exit 1
             }
             test -r '${DEPLOY_PATH}/performance/k6/review-burst-100.js' || {
               echo 'Missing readable remote k6 script: ${DEPLOY_PATH}/performance/k6/review-burst-100.js' >&2
               exit 1
             }"

      - name: Switch Worker concurrency
        shell: bash
        env:
          CONCURRENCY: ${{ inputs.concurrency }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "'${DEPLOY_PATH}/performance/set-review-worker-concurrency.sh' '${CONCURRENCY}'"

      - name: Load admin key
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          admin_key="$(ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "docker exec repoguard-backend printenv REPOGUARD_ADMIN_API_KEY")"
          test -n "${admin_key}" || { echo "Missing runtime admin API key"; exit 1; }
          echo "::add-mask::${admin_key}"
          echo "ADMIN_API_KEY=${admin_key}" >> "$GITHUB_ENV"

      - name: Run Mock task burst
        continue-on-error: true
        shell: bash
        env:
          CONCURRENCY: ${{ inputs.task_count }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          START_PR_NUMBER: ${{ inputs.start_pr_number }}
        run: |
          mkdir -p performance/reports/worker-retest
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/performance/k6/review-burst-100.js" \
            "${RUNNER_TEMP}/review-burst-100.js"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${RUNNER_TEMP}:/scripts:ro" \
            -v "${GITHUB_WORKSPACE}/performance/reports/worker-retest:/reports" \
            grafana/k6:0.54.0 run \
            -e BASE_URL="http://${DEPLOY_HOST}" \
            -e ADMIN_API_KEY="${ADMIN_API_KEY}" \
            -e CONCURRENCY="${CONCURRENCY}" \
            -e START_PR_NUMBER="${START_PR_NUMBER}" \
            -e RUN_SUFFIX="worker-c${{ inputs.concurrency }}-${GITHUB_RUN_ID}" \
            -e SUMMARY_FILE="/reports/worker-c${{ inputs.concurrency }}-${GITHUB_RUN_ID}.json" \
            /scripts/review-burst-100.js

      - name: Verify database, queue, and logs
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
          START_PR_NUMBER: ${{ inputs.start_pr_number }}
          TASK_COUNT: ${{ inputs.task_count }}
        run: |
          sleep 15
          verify_output="$(ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "'${DEPLOY_PATH}/performance/verify-worker-comparison.sh' '${START_PR_NUMBER}' '${TASK_COUNT}'")"
          printf '%s\n' "${verify_output}"
          failed_count="$(printf '%s\n' "${verify_output}" | awk '$1 == "FAILED" { print $2 }')"
          completed_count="$(printf '%s\n' "${verify_output}" | awk '$1 == "COMPLETED" { print $2 }')"
          total_count="$(printf '%s\n' "${verify_output}" | awk '$1 == "total_tasks" { print $2 }')"
          unfinished_count="$(printf '%s\n' "${verify_output}" | awk '$1 == "unfinished_tasks" { print $2 }')"
          duplicate_count="$(printf '%s\n' "${verify_output}" | awk '$1 == "duplicate_pr_groups" { print $2 }')"
          test "${total_count:-0}" = "${TASK_COUNT}"
          test "${completed_count:-0}" = "${TASK_COUNT}"
          test "${failed_count:-0}" = "0"
          test "${unfinished_count:-0}" = "0"
          test "${duplicate_count:-0}" = "0"
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "if docker logs --since 10m repoguard-backend 2>&1 | grep -q 'DeadlockLoserDataAccessException'; then
               echo 'DeadlockLoserDataAccessException found in backend logs' >&2
               exit 1
             fi"

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-c${{ inputs.concurrency }}-${{ github.run_id }}
          path: performance/reports/worker-retest/*.json
          if-no-files-found: warn

      - name: Restore Worker concurrency 1
        if: always()
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "'${DEPLOY_PATH}/performance/set-review-worker-concurrency.sh' 1"
