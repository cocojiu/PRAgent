version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directory: /repoguard-backend
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: Asia/Shanghai
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /repoguard-frontend
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Shanghai
    groups:
      # Match the TypeScript/lint toolchain before the catch-all dependency group.
      frontend-toolchain:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "vue-tsc"
          - "typescript-eslint"
          - "@typescript-eslint/*"
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-vue"
          - "vue-eslint-parser"
        update-types:
          - "minor"
          - "patch"
      frontend-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /repoguard-backend
    schedule:
      interval: weekly
      day: monday
      time: "03:45"
      timezone: Asia/Shanghai
    groups:
      backend-container:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /repoguard-frontend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    groups:
      frontend-container:
        patterns:
          - "*"
    open-pull-requests-limit: 3
